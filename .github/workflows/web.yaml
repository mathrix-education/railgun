name: Web pipeline
on:
  push:
    branches: ['master']
    tags: ['**']
  pull_request:
    branches: ['**']
jobs:
  # ============================================================================
  # Setup the mappings for all the subsequent jobs.
  # ============================================================================
  mappings:
    name: Generate mappings
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.mappings.outputs.environment }}
      url: ${{ steps.mappings.outputs.url }}
      semver: ${{ steps.mappings.outputs.semver }}
      image: ${{ steps.mappings.outputs.image }}
      image_latest: ${{ steps.mappings.outputs.image_latest }}
      image_version: ${{ steps.mappings.outputs.image_version }}
      image_exists: ${{ steps.mappings.outputs.image_exists }}
      skip_lint: ${{ steps.mappings.outputs.skip_lint }}
      skip_test: ${{ steps.mappings.outputs.skip_test }}
      skip_build: ${{ steps.mappings.outputs.skip_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup Google Cloud SDK
        uses: mathrix-education/setup-gcloud@1.2.0
        with:
          version: local
          service-account-key: ${{ secrets.GCLOUD_AUTH }}
      - name: Setup mappings
        id: mappings
        run: .github/scripts/setup.sh
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: .github/scripts/version_check.sh
      - name: Debug mappings
        run: echo "$MAPPINGS" | jq -C .
        env:
          MAPPINGS: ${{ toJson(steps.mappings.outputs) }}

  # ============================================================================
  # Lint the source code with PHP_CodeSniffer
  # ============================================================================
  lint:
    name: Lint with PHP_CodeSniffer
    needs: [mappings]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: needs.mappings.outputs.skip_lint != '1'
        uses: actions/checkout@v2
      - name: Setup PHP
        if: needs.mappings.outputs.skip_lint != '1'
        uses: shivammathur/setup-php@2.3.2
        with:
          php-version: 7.4
          coverage: none
          tools: prestissimo
      - name: Install dependencies
        if: needs.mappings.outputs.skip_lint != '1'
        run: composer install --ignore-platform-reqs --no-progress --no-suggest --prefer-dist
      - name: Lint with PHP_CodeSniffer
        if: needs.mappings.outputs.skip_lint != '1'
        run: vendor/bin/phpcs

  # ============================================================================
  # Run the tests with PHPUnit
  # ============================================================================
  tests:
    name: Test with PHPUnit
    needs: [mappings]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: needs.mappings.outputs.skip_test != '1'
        uses: actions/checkout@v2
      - name: Setup Google Cloud Service Account Key
        if: needs.mappings.outputs.skip_test != '1'
        run: echo "${{ secrets.GCLOUD_AUTH }}" | base64 -d > storage/keychain/service_account.json
      - name: Setup PHP
        if: needs.mappings.outputs.skip_test != '1'
        uses: shivammathur/setup-php@2.3.2
        with:
          php-version: 7.4
          extensions: gd, gmp, mbstring, mysql, zip
          coverage: pcov
          tools: prestissimo
      - name: Install dependencies
        if: needs.mappings.outputs.skip_test != '1'
        run: composer install --no-progress --no-suggest --prefer-dist --optimize-autoloader
      - name: Setup application
        if: needs.mappings.outputs.skip_test != '1'
        run: |
          sudo service mysql start
          mysql -u "root" -p"root" -Bse "CREATE DATABASE mathrix_education_testing;"
          cp tests/.env .env
          php artisan migrate --seed
      - name: Test with PHPUnit
        if: needs.mappings.outputs.skip_test != '1'
        env:
          GOOGLE_CLOUD_KEY_FILE: keychain/service_account.json
          MAILJET_SECRET: ${{ secrets.MAILJET_SECRET }}
          STRIPE_SECRET: ${{ secrets.STRIPE_SECRET }}
          BRAINTREE_PRIVATE_KEY: ${{ secrets.BRAINTREE_PRIVATE_KEY }}
        run: |
          vendor/bin/paratest -f \
            --log-junit=storage/artifacts/phpunit-junit.xml \
            --coverage-clover=storage/artifacts/phpunit-coverage.xml \
            --coverage-text
      - name: Upload coverage report to Codecov
        if: needs.mappings.outputs.skip_test != '1'
        uses: codecov/codecov-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: storage/artifacts/phpunit-coverage.xml

  # ============================================================================
  # Build the Docker image
  # ============================================================================
  docker:
    name: Build Docker image
    needs: [mappings, lint, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: needs.mappings.outputs.skip_build != '1'
        uses: actions/checkout@v2
      - name: Setup Google Cloud SDK
        uses: mathrix-education/setup-gcloud@1.2.0
        with:
          version: local
          service-account-key: ${{ secrets.GCLOUD_AUTH }}
          configure-docker: true
      - name: Build Docker image
        if: needs.mappings.outputs.skip_build != '1'
        run: |
          docker build \
            --build-arg "RELEASE=${{ needs.mappings.outputs.semver }}" \
            --tag ${{ needs.mappings.outputs.image }} \
            .
      - name: Push Docker image to Google Cloud Container Registry
        if: needs.mappings.outputs.skip_build != '1'
        run: docker push ${{ needs.mappings.outputs.image }}
      - name: Add "latest" tag
        if: github.event_name == 'push'
        run: |
          gcloud container images add-tag \
            ${{ needs.mappings.outputs.image }} \
            ${{ needs.mappings.outputs.image_latest }}
      - name: Add "version" tag
        if: needs.mappings.outputs.environment == 'production'
        run: |
          gcloud container images add-tag \
            ${{ needs.mappings.outputs.image }} \
            ${{ needs.mappings.outputs.image_version }}

  # ============================================================================
  # Deploy the container to the Google Cloud Kubernetes Cluster.
  # ============================================================================
  deploy_gke:
    name: Deploy on Google Kubernetes Engine
    if: github.event_name != 'pull_request'
    needs: [mappings, lint, tests, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: '0'
      - name: Setup Google Cloud SDK
        uses: mathrix-education/setup-gcloud@1.2.0
        with:
          version: local
          service-account-key: ${{ secrets.GCLOUD_AUTH }}
      - name: Trigger deployment event
        id: deployment
        if: needs.mappings.outputs.image_exists && github.event_name != 'pull_request'
        uses: avakar/create-deployment@v1
        with:
          ref: ${{ github.ref }}
          task: deploy
          auto_merge: false
          required_contexts: ''
          payload: ${{ toJson(needs.mappings.outputs) }}
          environment: ${{ needs.mappings.outputs.environment }}
          description: Deploy ${{ needs.mappings.outputs.semver }} on ${{ needs.mappings.outputs.environment }}
          production_environment: ${{ needs.mappings.outputs.environment == 'production' }}
          transient_environment: false
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      - name: Set deployment status to "in_progress"
        uses: avakar/set-deployment-status@v1
        with:
          state: in_progress
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          log_url: https://github.com/${{ github.repository	}}/actions/runs/${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Sentry CLI
        uses: mathrix-education/setup-sentry-cli@0.1.1
        with:
          token: ${{ SECRETS.SENTRY_TOKEN }}
          organization: mathrix-tech
          project: railgun
      - name: Create Sentry Release
        run: |
          sentry-cli releases new ${{ needs.mappings.outputs.semver }}
          sentry-cli releases set-commits ${{ needs.mappings.outputs.semver }} --auto
          sentry-cli releases finalize ${{ needs.mappings.outputs.semver }}
      - name: Change image version
        run: |
          gcloud container clusters get-credentials teknoid --zone=europe-west1-b
          kubectl set image -n ${{ needs.mappings.outputs.environment }} \
            deployment/railgun-server "server=${{ needs.mappings.outputs.image }}"
          kubectl set image -n ${{ needs.mappings.outputs.environment }} \
            deployment/railgun-worker "worker=${{ needs.mappings.outputs.image }}"
      - name: Deploy Sentry Release
        run: |
          sentry-cli releases deploys ${{ needs.mappings.outputs.semver }} \
            new -e ${{ needs.mappings.outputs.environment }}
      - name: Set deployment status to "success"
        uses: avakar/set-deployment-status@v1
        with:
          state: success
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          environment_url: ${{ needs.mappings.outputs.url }}
          log_url: https://github.com/${{ github.repository	}}/actions/runs/${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set deployment status to "failure"
        uses: avakar/set-deployment-status@v1
        if: failure()
        with:
          state: failure
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          log_url: https://github.com/${{ github.repository	}}/actions/runs/${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
