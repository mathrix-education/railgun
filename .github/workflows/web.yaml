name: Web pipeline
on:
  push:
    branches: ["main"]
    tags: ["**"]
  pull_request:
    branches: ["**"]

env:
  GCP_PROJECT: mathrix-education
  GCP_REGISTRY: europe-west1-docker.pkg.dev/mathrix-education/docker

jobs:
  # ============================================================================
  # Setup the mappings for all the subsequent jobs.
  # ============================================================================
  mappings:
    name: Generate mappings
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.mappings.outputs.environment }}
      url: ${{ steps.mappings.outputs.url }}
      semver: ${{ steps.mappings.outputs.semver }}
      image: ${{ steps.mappings.outputs.image }}
      image_latest: ${{ steps.mappings.outputs.image_latest }}
      image_version: ${{ steps.mappings.outputs.image_version }}
      image_exists: ${{ steps.mappings.outputs.image_exists }}
      deploy_force: ${{ steps.mappings.outputs.deploy_force }}
      skip_lint: ${{ steps.mappings.outputs.skip_lint }}
      skip_test: ${{ steps.mappings.outputs.skip_test }}
      skip_build: ${{ steps.mappings.outputs.skip_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup Google Cloud SDK
        uses: mathrix-education/setup-gcloud@1.2.0
        with:
          version: local
          service-account-key: ${{ secrets.GCLOUD_AUTH }}
      - name: Setup mappings
        id: mappings
        run: .github/scripts/setup.sh
        env:
          GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: .github/scripts/version_check.sh
      - name: Debug mappings
        run: echo "$MAPPINGS" | jq -C .
        env:
          MAPPINGS: ${{ toJson(steps.mappings.outputs) }}

  # ============================================================================
  # Lint the source code with PHP_CodeSniffer
  # ============================================================================
  lint:
    name: Lint with PHP_CodeSniffer
    needs: [mappings]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: needs.mappings.outputs.skip_lint != '1'
        uses: actions/checkout@v2
      - name: Setup PHP
        if: needs.mappings.outputs.skip_lint != '1'
        uses: shivammathur/setup-php@2.9.0
        with:
          php-version: 7.4
          coverage: none
          tools: prestissimo
      - name: Install dependencies
        if: needs.mappings.outputs.skip_lint != '1'
        run: composer install --ignore-platform-reqs=ext-redis --no-progress --no-suggest --prefer-dist
      - name: Lint with PHP_CodeSniffer
        if: needs.mappings.outputs.skip_lint != '1'
        run: vendor/bin/phpcs

  # ============================================================================
  # Build the Docker image
  # ============================================================================
  docker:
    name: Build Docker image
    needs: [mappings, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: needs.mappings.outputs.skip_build != '1'
        uses: actions/checkout@v3
      - name: Authenticate to Google Cloud SDK
        if: needs.mappings.outputs.skip_build != '1'
        id: auth
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCLOUD_AUTH }}
      - name: Docker login
        if: needs.mappings.outputs.skip_build != '1'
        uses: docker/login-action@v2
        with:
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
          registry: ${{ env.GCP_REGISTRY }}
      - name: Build Docker image
        if: needs.mappings.outputs.skip_build != '1'
        uses: docker/build-push-action@v3
        with:
          context: .
          push: ${{ needs.mappings.outputs.skip_build != '1' }}
          tags: ${{ needs.mappings.outputs.image }}
          build-args: RELEASE=${{ needs.mappings.outputs.semver }}
      - name: Add "latest" tag
        if: github.event_name == 'push'
        run: |
          gcloud artifacts docker tags add \
            ${{ needs.mappings.outputs.image }} \
            ${{ needs.mappings.outputs.image_latest }}
      - name: Add "version" tag
        if: needs.mappings.outputs.environment == 'production'
        run: |
          gcloud artifacts docker tags add  \
            ${{ needs.mappings.outputs.image }} \
            ${{ needs.mappings.outputs.image_version }}

  # ============================================================================
  # Deploy the container to the Google Cloud Kubernetes Cluster.
  # ============================================================================
  deploy_gke:
    name: Deploy on Google Kubernetes Engine
    if: github.event_name != 'pull_request' || needs.mappings.outputs.deploy_force == '1'
    needs: [mappings, lint, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Authenticate to Google Cloud SDK
        if: needs.mappings.outputs.skip_build != '1'
        id: auth
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCLOUD_AUTH }}
      - name: Deploy railgun service
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: railgun_new
          image: ${{ needs.mappings.outputs.image }}
          region: europe-west1
          env_vars: |
            ANGULAR_URL=https://mathrix.fr
            APP_DEBUG=true
            APP_ENV=production
            APP_FALLBACK_LOCALE=en
            APP_LOCALE=fr
            APP_NAME=railgun
            APP_TIMEZONE=Europe/Paris
            APP_URL=https://api.mathrix.fr
            CACHE_DRIVER=redis
            FILESYSTEM_DRIVER=cdn
            GOOGLE_CLOUD_PROJECT_ID=mathrix-education
            GOOGLE_CLOUD_STORAGE_BUCKET=cdn.mathrix.fr
            GRAPHQL_PLAYGROUND_ENDPOINT=https://api.mathrix.fr
            LOG_CHANNEL=google-cloud
            MAILJET_CALL=true
            PROMETHEUS_ADAPTER=redis
            PROMETHEUS_REDIS_HOST=10.221.92.35
            QUEUE_DRIVER=sync
            REDIS_CACHE_DB=1
            REDIS_DB=1
            REDIS_HOST=10.221.92.35
            SENTRY_DSN=https://df675efb69af4d2f8dc92b149db5c35a@o374006.ingest.sentry.io/5217542
          secrets: |
            APP_KEY=PROD_BACK_APP_KEY:latest
            BRAINTREE_ENVIRONMENT=PROD_BACK_BRAINTREE_ENVIRONMENT:latest
            BRAINTREE_MERCHANT_ACCOUNT=PROD_BACK_BRAINTREE_MERCHANT_ACCOUNT:latest
            BRAINTREE_MERCHANT_ID=PROD_BACK_BRAINTREE_MERCHANT_ID:latest
            BRAINTREE_PRIVATE_KEY=PROD_BACK_BRAINTREE_PRIVATE_KEY:latest
            BRAINTREE_PUBLIC_KEY=PROD_BACK_BRAINTREE_PUBLIC_KEY:latest
            DB_DATABASE=PROD_MYSQL_DATABASE:latest
            DB_HOST=PROD_MYSQL_HOST:latest
            DB_PASSWORD=PROD_MYSQL_PASSWORD:latest
            DB_USERNAME=PROD_MYSQL_USER:latest
            FACEBOOK_APP_ID=PROD_FACEBOOK_APP_ID:latest
            FACEBOOK_APP_SECRET=PROD_BACK_FACEBOOK_APP_SECRET:latest
            GOOGLE_CLIENT_ID=PROD_GOOGLE_CLIENT_ID:latest
            GOOGLE_CLIENT_SECRET=PROD_BACK_GOOGLE_CLIENT_SECRET:latest
            GOOGLE_CLOUD_PROJECT_ID=PROD_BACK_GOOGLE_CLOUD_PROJECT_ID:latest
            GOOGLE_CLOUD_STORAGE_BUCKET=PROD_BACK_GOOGLE_CLOUD_STORAGE_BUCKET:latest
            MAILJET_KEY=PROD_BACK_MAILJET_KEY:latest
            MAILJET_SECRET=PROD_BACK_MAILJET_SECRET:latest
            STRIPE_API_KEY=PROD_BACK_STRIPE_API_KEY:latest
            STRIPE_LEGACY_API_KEY=PROD_BACK_STRIPE_LEGACY_API_KEY:latest
            STRIPE_LEGACY_WEBHOOKS_SECRET=PROD_BACK_STRIPE_LEGACY_WEBHOOKS_SECRET:latest
            STRIPE_WEBHOOKS_SECRET=PROD_BACK_STRIPE_WEBHOOKS_SECRET:latest
          flags: >-
            --cpu=2
            --memory=2048Mi
            --concurrency=1
            --min-instances=1
            --no-cpu-throttling
            --service-account=railgun-${{ needs.mappings.outputs.environment }}@${{ env.GCP_PROJECT }}.iam.gserviceaccount.com
            --vpc-connector=internal-euw1
