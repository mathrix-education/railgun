name: Pipeline
on:
  push:
    branches: ['master', 'dev', 'v7']
jobs:
  lint:
    name: Lint with PHP_CodeSniffer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Install dependencies
        run: composer install --ignore-platform-reqs --no-progress --no-suggest --prefer-dist
      - name: Lint with PHP_CodeSniffer
        run: composer lint:details
  test:
    name: Test with PHPUnit
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_DATABASE: mathrix_education_testing
          MYSQL_ROOT_PASSWORD: '123456'
        ports:
          - 3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup Google Cloud Service Account Key
        run: echo "${{ secrets.GCLOUD_AUTH }}" | base64 -d > storage/keychain/service_account.json
      - name: Setup PHP
        uses: shivammathur/setup-php@1.7.4
        with:
          php-version: 7.4
          extensions: gd, gmp, mbstring, mysql, zip
          coverage: pcov
          tools: prestissimo
      - name: Install dependencies
        run: composer install --no-progress --no-suggest --prefer-dist --optimize-autoloader
      - name: Setup application (environment, JWT key and database seed)
        env:
          DB_PORT: ${{ job.services.mysql.ports['3306'] }}
          DB_PASSWORD: '123456'
        run: |
          cp environments/testing/.env .env
          bin/artisan jwt:key
          bin/artisan migrate --seed
      - name: Test with PHPUnit
        env:
          DB_PORT: ${{ job.services.mysql.ports['3306'] }}
          DB_PASSWORD: '123456'
          GOOGLE_CLOUD_KEY_FILE: keychain/service_account.json
          MAILGUN_SECRET: ${{ secrets.MAILGUN_SECRET }}
          STRIPE_SECRET: ${{ secrets.STRIPE_SECRET }}
          BRAINTREE_PRIVATE_KEY: ${{ secrets.BRAINTREE_PRIVATE_KEY }}
        run: composer test:cover
      - name: Upload artifacts (JUnit Report, Coverage report)
        uses: actions/upload-artifact@v1.0.0
        with:
          name: artifacts
          path: storage/artifacts
  static_analysis:
    name: Analyse with Sonar Scanner
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: '0'
      - name: Setup sonar.properties
        run: |
          echo "sonar.projectVersion=$(bin/version)" >> sonar-project.properties
          echo "sonar.branch.name=$(bin/current_branch)" >> sonar-project.properties

          if [[ "$(bin/parent_branch)" != "no-parent" ]]; then
            echo "sonar.branch.target=$(bin/parent_branch)" >> sonar-project.properties
          fi
      - name: Download artifacts (JUnit Report, Coverage report)
        uses: actions/download-artifact@v1.0.0
        with:
          name: artifacts
          path: storage/artifacts
      - name: Run Sonar Scanner
        uses: mathrix-education/sonar-scanner@master
        with:
          version: 4.2.0.1873 # required
          scan: true
          args: -Dsonar.login=${{ secrets.SONAR_TOKEN }}
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Extract context
        run: |
          echo "##[set-output name=current_branch;]$(bin/current_branch)"
      - name: Setup PHP
        uses: shivammathur/setup-php@1.7.4
        with:
          php-version: 7.4
          extensions: gd, gmp, mbstring, mysql, zip
          coverage: pcov
          tools: prestissimo
      - name: Install dependencies
        run: composer install --no-progress --no-suggest --prefer-dist --optimize-autoloader
      - name: Patch release
        run: sed -i "s/RELEASE_ALIAS/$(bin/release)/g" config/sentry.php
      - name: Build Docker image
        run: docker build -t "eu.gcr.io/${{ secrets.GCLOUD_PROJECT }}/education-api:$(bin/release)" .
      - name: Setup Google Cloud SDK
        uses: mathrix-education/setup-gcloud@0.1.2
        with:
          project: ${{ secrets.GCLOUD_PROJECT }}
          service-account-key: ${{ secrets.GCLOUD_AUTH }}
      - name: Push image to Google Cloud Container Registry
        run: docker push "eu.gcr.io/${{ secrets.GCLOUD_PROJECT }}/education-api:$(bin/release)"
      - name: Add branch tag if necessary
        if: contains('master,dev,v7', steps.git.outputs.current_branch)
        run: |
          gcloud container images add-tag \
            "eu.gcr.io/${{ secrets.GCLOUD_PROJECT }}/education-api:$(bin/release)" \
            "eu.gcr.io/${{ secrets.GCLOUD_PROJECT }}/education-api:latest-$(bin/current_branch)"
  deploy_gke:
    name: Deploy on Google Kubernetes Engine
    needs: [docker, test]
    runs-on: ubuntu-latest
    steps:
      # Required to use bin/release
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup Google Cloud SDK
        uses: mathrix-education/setup-gcloud@0.1.2
        with:
          project: ${{ secrets.GCLOUD_PROJECT }}
          service-account-key: ${{ secrets.GCLOUD_AUTH }}
      - name: Retrieve Kubernetes Cluster Credentials
        run: |
          gcloud container clusters get-credentials php-fpm-testing --zone=europe-west1-b
      - name: Change image version
        run: |
          kubectl set image -n education-graphql deployment/api \
            "php=eu.gcr.io/${{ secrets.GCLOUD_PROJECT }}/education-api:$(bin/release)"
  sentry_release:
    name: Create Sentry Release
    needs: [docker, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: '0'
      - name: Setup Sentry CLI
        uses: mathrix-education/setup-sentry-cli@0.1.0
        with:
          url: https://sentry.mathrix.tech
          token: ${{ SECRETS.SENTRY_TOKEN }}
          organization: mathrix-tech
          project: education-api
      - name: Create Sentry Release
        run: |
          sentry-cli releases new $(bin/release)
          sentry-cli releases set-commits $(bin/release) --auto
          sentry-cli releases finalize $(bin/release)
  sentry_deploy:
    name: Deploy Sentry Release
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/v7'
    needs: [deploy_gke]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup Sentry CLI
        uses: mathrix-education/setup-sentry-cli@0.1.0
        with:
          url: https://sentry.mathrix.tech
          token: ${{ SECRETS.SENTRY_TOKEN }}
          organization: mathrix-tech
          project: education-api
      - name: Create Sentry Release
        run: sentry-cli releases deploys $(bin/release) new -e $(bin/current_branch)
