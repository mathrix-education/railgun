name: Pipeline
on:
  push:
    branches:
      - '**'
      - master
      - stage
      - production
jobs:
  lint:
    name: Lint with PHP_CodeSniffer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: "!contains(github.event.head_commit.message, 'lint:skip')"
        uses: actions/checkout@v2
      - name: Setup PHP
        if: "!contains(github.event.head_commit.message, 'lint:skip')"
        uses: shivammathur/setup-php@2.2.2
        with:
          php-version: 7.4
          coverage: none
          tools: prestissimo
      - name: Install dependencies
        if: "!contains(github.event.head_commit.message, 'lint:skip')"
        run: composer install --ignore-platform-reqs --no-progress --no-suggest --prefer-dist
      - name: Lint with PHP_CodeSniffer
        if: "!contains(github.event.head_commit.message, 'lint:skip')"
        run: vendor/bin/phpcs
  tests:
    name: Test with PHPUnit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: "!contains(github.event.head_commit.message, 'tests:skip')"
        uses: actions/checkout@v2
      - name: Setup Google Cloud Service Account Key
        if: "!contains(github.event.head_commit.message, 'tests:skip')"
        run: echo "${{ secrets.GCLOUD_AUTH }}" | base64 -d > storage/keychain/service_account.json
      - name: Setup PHP
        if: "!contains(github.event.head_commit.message, 'tests:skip')"
        uses: shivammathur/setup-php@2.2.2
        with:
          php-version: 7.4
          extensions: gd, gmp, mbstring, mysql, zip
          coverage: pcov
          tools: prestissimo
      - name: Install dependencies
        if: "!contains(github.event.head_commit.message, 'tests:skip')"
        run: composer install --no-progress --no-suggest --prefer-dist --optimize-autoloader
      - name: Setup application (database, environment and database seed)
        if: "!contains(github.event.head_commit.message, 'tests:skip')"
        run: |
          sudo service mysql start
          mysql -u "root" -p"root" -Bse "CREATE DATABASE mathrix_education_testing;"
          cp tests/.env .env
          php artisan migrate --seed
      - name: Test with PHPUnit
        if: "!contains(github.event.head_commit.message, 'tests:skip')"
        env:
          GOOGLE_CLOUD_KEY_FILE: keychain/service_account.json
          MAILJET_SECRET: ${{ secrets.MAILJET_SECRET }}
          STRIPE_SECRET: ${{ secrets.STRIPE_SECRET }}
          BRAINTREE_PRIVATE_KEY: ${{ secrets.BRAINTREE_PRIVATE_KEY }}
        run: |
          vendor/bin/paratest -f \
            --log-junit=storage/artifacts/phpunit-junit.xml \
            --coverage-clover=storage/artifacts/phpunit-coverage.xml \
            --coverage-text
      - name: Upload artifacts (JUnit Report, Coverage report)
        if: "!contains(github.event.head_commit.message, 'tests:skip')"
        uses: actions/upload-artifact@v1.0.0
        with:
          name: artifacts
          path: storage/artifacts
  codecov:
    name: Send coverage reports to codecov
    if: "!contains(github.event.head_commit.message, 'tests:skip')"
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: '0'
      - name: Download artifacts (JUnit Report, Coverage report)
        uses: actions/download-artifact@v1.0.0
        with:
          name: artifacts
          path: storage/artifacts
      - uses: codecov/codecov-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: storage/artifacts/phpunit-coverage.xml
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Build Docker image
        run: |
          docker build \
            --build-arg "RELEASE=$(./mapping semver)" \
            --tag $(./mapping docker) \
            .
      - name: Setup Google Cloud SDK
        uses: mathrix-education/setup-gcloud@1.1.0
        with:
          service-account-key: ${{ secrets.GCLOUD_AUTH }}
          configure-docker: true
      - name: Push image to Google Cloud Container Registry
        run: docker push $(./mapping docker)
      - name: Add branch tag if necessary
        if: >-
          github.ref == 'refs/heads/master'
          || github.ref == 'refs/heads/stage'
          || github.ref == 'refs/heads/production'
          || contains(github.event.head_commit.message, 'deploy:force')
        run: gcloud container images add-tag $(./mapping docker) $(./mapping docker latest)
  deploy_gke:
    name: Deploy on Google Kubernetes Engine
    if: >-
      github.ref == 'refs/heads/master'
      || github.ref == 'refs/heads/stage'
      || github.ref == 'refs/heads/production'
      || contains(github.event.head_commit.message, 'deploy:force')
    needs: [lint, tests, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup Google Cloud SDK
        uses: mathrix-education/setup-gcloud@1.1.0
        with:
          service-account-key: ${{ secrets.GCLOUD_AUTH }}
      - name: Change image version
        run: |
          gcloud container clusters get-credentials teknoid --zone=europe-west1-b
          kubectl set image -n $(./mapping ns) deployment/railgun-server "server=$(./mapping docker)"
          kubectl set image -n $(./mapping ns) deployment/railgun-worker "worker=$(./mapping docker)"
  sentry_release:
    name: Create Sentry Release
    if: >-
      github.ref == 'refs/heads/master'
      || github.ref == 'refs/heads/stage'
      || github.ref == 'refs/heads/production'
      || contains(github.event.head_commit.message, 'deploy:force')
    needs: [lint, tests, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: '0'
      - name: Setup Sentry CLI
        uses: mathrix-education/setup-sentry-cli@0.1.1
        with:
          token: ${{ SECRETS.SENTRY_TOKEN }}
          organization: mathrix-tech
          project: railgun
      - name: Create Sentry Release
        run: |
          sentry-cli releases new $(./mapping semver)
          sentry-cli releases set-commits $(./mapping semver) --auto
          sentry-cli releases finalize $(./mapping semver)
  sentry_deploy:
    name: Deploy Sentry Release
    if: >-
      github.ref == 'refs/heads/master'
      || github.ref == 'refs/heads/stage'
      || github.ref == 'refs/heads/production'
      || contains(github.event.head_commit.message, 'deploy:force')
    needs: [deploy_gke]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup Sentry CLI
        uses: mathrix-education/setup-sentry-cli@0.1.1
        with:
          token: ${{ SECRETS.SENTRY_TOKEN }}
          organization: mathrix-tech
          project: railgun
      - name: Create Sentry Release
        run: sentry-cli releases deploys $(./mapping semver) new -e $(./mapping env)
