name: Pipeline
on:
  push:
    branches:
      - master
      - dev
      - v7**
jobs:
  lint:
    name: Lint with PHP_CodeSniffer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: "!contains(github.event.head_commit.message, 'lint:skip')"
        uses: actions/checkout@v2
      - name: Setup PHP
        if: "!contains(github.event.head_commit.message, 'lint:skip')"
        uses: shivammathur/setup-php@2.1.3
        with:
          php-version: 7.4
          coverage: none
          tools: prestissimo
      - name: Install dependencies
        if: "!contains(github.event.head_commit.message, 'lint:skip')"
        run: composer install --ignore-platform-reqs --no-progress --no-suggest --prefer-dist
      - name: Lint with PHP_CodeSniffer
        if: "!contains(github.event.head_commit.message, 'lint:skip')"
        run: vendor/bin/phpcs
  tests:
    name: Test with PHPUnit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: "!contains(github.event.head_commit.message, 'tests:skip')"
        uses: actions/checkout@v2
      - name: Setup Google Cloud Service Account Key
        if: "!contains(github.event.head_commit.message, 'tests:skip')"
        run: echo "${{ secrets.GCLOUD_AUTH }}" | base64 -d > storage/keychain/service_account.json
      - name: Setup PHP
        if: "!contains(github.event.head_commit.message, 'tests:skip')"
        uses: shivammathur/setup-php@2.1.3
        with:
          php-version: 7.4
          extensions: gd, gmp, mbstring, mysql, zip
          coverage: pcov
          tools: prestissimo
      - name: Install dependencies
        if: "!contains(github.event.head_commit.message, 'tests:skip')"
        run: composer install --no-progress --no-suggest --prefer-dist --optimize-autoloader
      - name: Setup application (database, environment, JWT key and database seed)
        if: "!contains(github.event.head_commit.message, 'tests:skip')"
        run: |
          sudo service mysql start
          mysql -u "root" -p"root" -Bse "CREATE DATABASE mathrix_education_testing;"
          cp tests/.env .env
          php artisan jwt:key
          php artisan migrate --seed
      - name: Test with PHPUnit
        if: "!contains(github.event.head_commit.message, 'tests:skip')"
        env:
          GOOGLE_CLOUD_KEY_FILE: keychain/service_account.json
          MAILJET_SECRET: ${{ secrets.MAILJET_SECRET }}
          STRIPE_SECRET: ${{ secrets.STRIPE_SECRET }}
          BRAINTREE_PRIVATE_KEY: ${{ secrets.BRAINTREE_PRIVATE_KEY }}
        run: |
          vendor/bin/paratest -f \
            --log-junit=storage/artifacts/phpunit-junit.xml \
            --coverage-clover=storage/artifacts/phpunit-coverage.xml \
            --coverage-text
      - name: Upload artifacts (JUnit Report, Coverage report)
        uses: actions/upload-artifact@v1.0.0
        with:
          name: artifacts
          path: storage/artifacts
  static_analysis:
    name: Analyse with Sonar Scanner
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: '0'
      - name: Standard versions
        id: standard-versions
        uses: mathrix-education/standard-versions@master
      - name: Pull the git reference
        run: |
          git pull origin v7
          git pull origin "${{ steps.standard-versions.outputs.branch }}"
      - name: Setup sonar.properties
        run: |
          echo "sonar.projectVersion=${{ steps.standard-versions.outputs.semver }}" >> sonar-project.properties
          echo "sonar.branch.name=${{ steps.standard-versions.outputs.branch }}" >> sonar-project.properties
          if [[ "${{ steps.standard-versions.outputs.branch }}" != "v7" ]]; then
            echo "sonar.branch.target=v7" >> sonar-project.properties
          fi
      - name: Download artifacts (JUnit Report, Coverage report)
        uses: actions/download-artifact@v1.0.0
        with:
          name: artifacts
          path: storage/artifacts
      - name: Run Sonar Scanner
        uses: mathrix-education/sonar-scanner@1.0.0
        with:
          version: 4.2.0.1873 # required
          scan: true
          args: -Dsonar.login=${{ secrets.SONAR_TOKEN }}
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Standard versions
        id: standard-versions
        uses: mathrix-education/standard-versions@master
      - name: Build Docker image
        run: |
          docker pull \
            "eu.gcr.io/mathrix-education/education-api:latest-${{ steps.standard-versions.outputs.branch }}" || true
          docker build \
            --build-arg "RELEASE=${{ steps.standard-versions.outputs.semver }}" \
            --cache-from "eu.gcr.io/mathrix-education/education-api:latest-${{ steps.standard-versions.outputs.branch }}" \
            --tag "eu.gcr.io/mathrix-education/education-api:${{ steps.standard-versions.outputs.docker }}" .
      - name: Setup Google Cloud SDK
        uses: mathrix-education/setup-gcloud@1.1.0
        with:
          service-account-key: ${{ secrets.GCLOUD_AUTH }}
          configure-docker: true
      - name: Push image to Google Cloud Container Registry
        run: |
          docker push "eu.gcr.io/mathrix-education/education-api:${{ steps.standard-versions.outputs.docker }}"
      - name: Add branch tag if necessary
        if: github.ref == 'refs/heads/v7'
        run: |
          gcloud container images add-tag \
            "eu.gcr.io/mathrix-education/education-api:${{ steps.standard-versions.outputs.docker }}" \
            "eu.gcr.io/mathrix-education/education-api:latest-${{ steps.standard-versions.outputs.branch }}"
  deploy_gke:
    name: Deploy on Google Kubernetes Engine
    if: "github.ref == 'refs/heads/v7' || contains(github.event.head_commit.message, 'deploy:force')"
    needs: [lint, tests, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Standard versions
        id: standard-versions
        uses: mathrix-education/standard-versions@master
      - name: Setup Google Cloud SDK
        uses: mathrix-education/setup-gcloud@1.1.0
        with:
          service-account-key: ${{ secrets.GCLOUD_AUTH }}
      - name: Retrieve Kubernetes Cluster Credentials
        run: gcloud container clusters get-credentials php-fpm-testing --zone=europe-west1-b
      - name: Change image version
        run: |
          IMAGE="eu.gcr.io/mathrix-education/education-api:${{ steps.standard-versions.outputs.docker }}"
          kubectl set image -n education-graphql deployment/api-server "php-server=$IMAGE"
          kubectl set image -n education-graphql deployment/api-worker "php-worker=$IMAGE"
  sentry_release:
    name: Create Sentry Release
    if: "github.ref == 'refs/heads/v7' || contains(github.event.head_commit.message, 'deploy:force')"
    needs: [lint, tests, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: '0'
      - name: Standard versions
        id: standard-versions
        uses: mathrix-education/standard-versions@master
      - name: Setup Sentry CLI
        uses: mathrix-education/setup-sentry-cli@0.1.0
        with:
          url: https://sentry.mathrix.tech
          token: ${{ SECRETS.SENTRY_TOKEN }}
          organization: mathrix-tech
          project: education-api
      - name: Create Sentry Release
        run: |
          sentry-cli releases new ${{ steps.standard-versions.outputs.semver }}
          sentry-cli releases set-commits ${{ steps.standard-versions.outputs.semver }} --auto
          sentry-cli releases finalize ${{ steps.standard-versions.outputs.semver }}
  sentry_deploy:
    name: Deploy Sentry Release
    if: "github.ref == 'refs/heads/v7' || contains(github.event.head_commit.message, 'deploy:force')"
    needs: [deploy_gke]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Standard versions
        id: standard-versions
        uses: mathrix-education/standard-versions@master
      - name: Setup Sentry CLI
        uses: mathrix-education/setup-sentry-cli@0.1.0
        with:
          url: https://sentry.mathrix.tech
          token: ${{ SECRETS.SENTRY_TOKEN }}
          organization: mathrix-tech
          project: education-api
      - name: Create Sentry Release
        run: |
          sentry-cli releases deploys \
            ${{ steps.standard-versions.outputs.semver }} \
            new -e v7
