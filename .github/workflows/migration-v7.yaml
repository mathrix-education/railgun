name: Migration V7
on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/migration-v7.yaml'
      - 'app/Buster/**'
      - 'database/migrations/**'
jobs:
  migrate_database:
    name: Migrate database to v7
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Install pv
        run: |
          sudo apt-get update
          sudo apt-get install -y pv
      - name: Setup PHP
        uses: shivammathur/setup-php@2.1.3
        with:
          php-version: 7.4
          extensions: gd, gmp, mbstring, mysql, zip
          coverage: none
          tools: prestissimo
      - name: Setup Google Cloud SDK
        uses: mathrix-education/setup-gcloud@1.1.0
        with:
          service-account-key: ${{ secrets.GCLOUD_AUTH }}
      - name: Download latest backup
        run: ./database/scripts/export.sh -t mathrix_education_testing
      - name: Install PHP dependencies
        run: composer install --no-progress --no-suggest --prefer-dist --optimize-autoloader
      - name: Migrate database
        run: |
          sudo service mysql start
          mysql -u "root" -p"root" -Bse "CREATE DATABASE mathrix_education_testing;"
          cp tests/.env .env
          php artisan buster
      - name: Restore generated database
        if: "github.ref == 'refs/heads/v7' || contains(github.event.head_commit.message, 'database:restore')"
        run: ./database/scripts/import.sh -u root -p root -s mathrix_education_testing -t mathrix_education_v7
