stages:
  - test
  - deploy

#--------------------------------------------------------------------------
# Run unit tests
#--------------------------------------------------------------------------
tests:
  image: edbizarro/gitlab-ci-pipeline-php:7.1
  stage: test
  services:
    - mysql:latest
  variables:
    MYSQL_DATABASE: mathrix_fr_pipelines
    MYSQL_ROOT_PASSWORD: 3AEzrLrSh8j8xJfyHAdB
  script:
    # Setup project files
    - cp config/env/.env.pipelines .env
    - composer install --prefer-dist -q -o
    - php artisan migrate:refresh --seed
    # PHPUnit
    - ./vendor/phpunit/phpunit/phpunit -v --coverage-text --colors=never --stderr
  artifacts:
    paths:
      - ./storage/logs # for debugging
    expire_in: 1 days
    when: always


#--------------------------------------------------------------------------
# Deploy dev to web00.mathrix.fr
#--------------------------------------------------------------------------
deploy_web00:
  image: toby1991/laravel-envoy
  stage: deploy
  environment:
    name: dev
    url: https://dev.api.mathrix.fr
  script:
    - scripts/deploy.sh dev
  only:
    - dev


#--------------------------------------------------------------------------
# Deploy master to web01.mathrix.fr
#--------------------------------------------------------------------------
deploy_web01:
  image: toby1991/laravel-envoy
  stage: deploy
  environment:
    name: master
    url: https://api.mathrix.fr
  script:
    - scripts/deploy.sh master
  when: manual
  only:
    - master
