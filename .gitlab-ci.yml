# Variables
variables:
  MYSQL_ROOT_PASSWORD: root
  MYSQL_USER: root
  MYSQL_PASSWORD: d3SnA4cBxckvHbyNXhAG
  MYSQL_DATABASE: mathrix_fr_pipelines
  DB_HOST: mysql

before_script:
  # Setup GitLab SSH
  - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
  - sudo chmod 600 storage/ssh/gitlab_mathrix_id_rsa
  - sudo mkdir -p ~/.ssh
  - sudo ssh-agent -s
  - sudo ssh-add -k storage/ssh/gitlab_mathrix_id_rsa
  - sudo ssh-keyscan gitlab.com >> ~/.ssh/known_hosts

test:
  stage: test
  services:
    - mysql:5.7
  image: edbizarro/gitlab-ci-pipeline-php:7.1-alpine
  script:
    # Setup project files
    - sudo cp storage/env/.env.pipelines .env
    - sudo composer install --prefer-dist --no-ansi --no-interaction --no-progress --no-scripts
    - sudo php artisan migrate:refresh --seed
    # Setup project database
    - sudo ./vendor/phpunit/phpunit/phpunit -v --coverage-text --colors=never --stderr