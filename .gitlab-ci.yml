image: php:7.1.1

before_script:
  # Initialize project environment
  - apt-get -yqq update
  - apt-get -yqq install libmcrypt-dev unzip git openssh-client php7.1-gd
  - docker-php-ext-install mcrypt && docker-php-ext-install pdo_mysql
  - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  # Setup GitLab SSH
  - chmod 600 storage/ssh/gitlab_mathrix_id_rsa
  - eval $(ssh-agent)
  - ssh-add -k storage/ssh/gitlab_mathrix_id_rsa
  - mkdir ~/.ssh
  - ssh-keyscan gitlab.com >> ~/.ssh/known_hosts
  # Setup project files
  - cp storage/env/.env.pipelines .env
  - composer install --no-scripts --no-interaction --no-ansi --no-progress --no-suggest
  # Setup project database
  - php artisan migrate:refresh --seed

test:app:
  services:
    - mysql:latest
  variables:
    MYSQL_DATABASE: mathrix_fr_pipelines
    MYSQL_ROOT_PASSWORD: d3SnA4cBxckvHbyNXhAG
  script:
    - vendor/bin/phpunit -v --configuration phpunit.xml --stderr