# Variables
variables:
  MYSQL_ROOT_PASSWORD: root
  MYSQL_USER: root
  MYSQL_PASSWORD: d3SnA4cBxckvHbyNXhAG
  MYSQL_DATABASE: mathrix_fr_pipelines
  DB_HOST: mysql

test:
  stage: test
  services:
    - mysql:5.7
  image: edbizarro/gitlab-ci-pipeline-php:7.1-alpine
  script:
    - yarn
    # Setup GitLab SSH
    - chmod 600 storage/ssh/gitlab_mathrix_id_rsa
    - eval $(ssh-agent)
    - ssh-add -k storage/ssh/gitlab_mathrix_id_rsa
    - mkdir ~/.ssh
    - ssh-keyscan gitlab.com >> ~/.ssh/known_hosts
    # Setup GitLab SSH
    #- chmod 0600 storage/ssh/gitlab_mathrix_id_rsa
    - eval $(ssh-agent)
    - ssh-add -k storage/ssh/gitlab_mathrix_id_rsa
    - mkdir ~/.ssh
    - ssh-keyscan gitlab.com >> ~/.ssh/known_hosts
    # Setup project files
    - cp storage/env/.env.pipelines .env
    - composer install --prefer-dist --no-ansi --no-interaction --no-progress --no-scripts
    - php artisan migrate:refresh --seed
    # Setup project database
    - ./vendor/phpunit/phpunit/phpunit -v --coverage-text --colors=never --stderr