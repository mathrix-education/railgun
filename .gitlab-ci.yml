# gitlab-ci.yml
# Define the GtLab Pipelines behaviour

stages:
  - test
  - build
  - deploy

image: registry.gitlab.com/mathrix/mathrix-api
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules
    - vendor/

before_script:
  - composer install
  - yarn install
  - cp config/env/.env.$CI_COMMIT_REF_NAME .env

tests:
  stage: test
  services:
    - mysql:5.7
  retry: 2
  variables:
    MYSQL_DATABASE: mathrix_fr_pipelines
    MYSQL_ROOT_PASSWORD: 3AEzrLrSh8j8xJfyHAdB
  script:
    - bash scripts/tasks/tests.sh $CI_COMMIT_REF_NAME
  artifacts:
    paths:
      - storage/logs/
    expire_in: 1 days
    when: always
  only:
    - next
    - master

build:
  stage: build
  script:
    - php artisan pipelines:build --environment $CI_COMMIT_REF_NAME --no-interaction
  artifacts:
    paths:
      - dist/
      - storage/logs/
    expire_in: 1 days
    when: always

deploy_web00_next:
  stage: deploy
  dependencies:
    - build
  environment:
    name: web00/next
    url: https://next.mathrix.fr/api
  script:
    - php artisan pipelines:deploy --server web00 --environment next --no-interaction
  artifacts:
    paths:
      - dist/
      - storage/logs/
    expire_in: 1 days
    when: always
  only:
    - next

deploy_web00_dev:
  stage: deploy
  dependencies:
    - build
  environment:
    name: web00/dev
    url: https://dev.mathrix.fr/api
  script:
    - php artisan pipelines:deploy --server web00 --environment dev --no-interaction -v
  artifacts:
    paths:
      - dist/
      - storage/logs/
    expire_in: 1 days
    when: always
  only:
    - dev

deploy_web01_master:
  stage: deploy
  dependencies:
    - build
  environment:
    name: web01/master
    url: https://mathrix.fr/api
  script:
    - php artisan pipelines:deploy --server web01 --environment master --no-interaction -v
  artifacts:
    paths:
      - dist/
      - storage/logs/
    expire_in: 1 days
    when: always
  when: manual
  only:
    - master
    - hotfix

