image: edbizarro/gitlab-ci-pipeline-php:7.1-alpine

stages:
  - test
  - deploy

tests:
  stage: test
  services:
    - mysql:latest
  variables:
    MYSQL_DATABASE: mathrix_fr_pipelines
    MYSQL_ROOT_PASSWORD: d3SnA4cBxckvHbyNXhAG
  script:
    # Setup project files
    - cp storage/env/.env.pipelines .env
    - composer install --prefer-dist --no-ansi --no-interaction --no-progress --no-scripts
    - php artisan migrate:refresh --seed
    # Setup project database
    - ./vendor/phpunit/phpunit/phpunit -v --stderr

deploy_dev:
  stage: deploy
  script:
    - composer global require laravel/envoy
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$DEV_SSH_PRIVATE_KEY")
    - mkdir -p ~/.ssh
    - ~/.composer/vendor/bin/envoy run deploy_dev
  only:
    - dev
