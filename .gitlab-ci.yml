# gitlab-ci.yml
# Define the GtLab Pipelines behaviour

stages:
- test
- build
- deploy

tests:
  image: edbizarro/gitlab-ci-pipeline-php:7.2
  stage: test
  services:
  - mysql:5.7
  retry: 2
  variables:
    MYSQL_DATABASE: mathrix_fr_pipelines
    MYSQL_ROOT_PASSWORD: 3AEzrLrSh8j8xJfyHAdB
  script:
  - sh scripts/tasks/tests.sh $CI_COMMIT_REF_NAME
  artifacts:
    paths:
    - storage/logs/
    expire_in: 1 days
    when: always

build:
  image: alpine
  stage: build
  script:
  - sh scripts/tasks/build.sh
  artifacts:
    path:
    - build.tar.gz
    expire_in: 1 days
    when: always

deploy:
  image: doomkin/ubuntu-ssh
  stage: deploy
  dependencies:
  - build
  script:
  - bash scripts/tasks/deploy.sh web00 next

