# gitlab-ci.yml
# Define the GtLab Pipelines behaviour

stages:
  - build
  - tests
  - push

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules
    - vendor/

before_script:
  - docker info
  - docker login registry.gitlab.com -u $REGISTRY_USERNAME -p $REGISTRY_PASSWORD

build:
  image: docker:stable
  stage: build
  script:
    - docker build -t registry.gitlab.com/mathrix/mathrix-api/lumen:$CI_COMMIT_REF_NAME .

tests:
  stage: tests
  image: registry.gitlab.com/mathrix/mathrix-api/lumen:$CI_COMMIT_REF_NAME
  services:
    - mysql:5.7
  retry: 2
  variables:
    MYSQL_DATABASE: mathrix_fr_pipelines
    MYSQL_ROOT_PASSWORD: 3AEzrLrSh8j8xJfyHAdB
  before_script:
    - cp configs/env/.env.pipelines .env
    - composer install
  script:
    - bash scripts/tasks/tests.sh $CI_COMMIT_REF_NAME
  artifacts:
    paths:
      - storage/logs/
    expire_in: 1 days
    when: always

push:
  image: docker:stable
  stage: push
  script:
    - docker push registry.gitlab.com/mathrix/mathrix-api/lumen:$CI_COMMIT_REF_NAME .

