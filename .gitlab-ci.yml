# gitlab-ci.yml
# Define the GtLab Pipelines behaviour
stages:
  - build
variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  REGISTRY: registry.gitlab.com/mathrix/mathrix-api
  ENGINE_IMAGE: $REGISTRY/engine:$CI_COMMIT_REF_SLUG
  API_IMAGE: $REGISTRY/api:$CI_COMMIT_REF_SLUG
  ENGINE_RELEASE_IMAGE: $REGISTRY/engine:latest
  API_RELEASE_IMAGE: $REGISTRY/api:latest
cache:
  key: ${CI_COMMIT_SHA}
  paths:
    - node_modules
    - vendor/
services:
  - docker:dind
before_script:
  - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY

# -------------------
# Build custom images
# -------------------
# Engine image, which contains php-fpm, composer, etc.
build-engine:
  stage: build
  script:
    - docker build -f docker/engine/Dockerfile -t $ENGINE_IMAGE .
    - docker push $ENGINE_IMAGE
build-api:
  stage: build
  script:
    - docker build -f docker/api/Dockerfile -t $API_IMAGE .
    - docker push $API_IMAGE
