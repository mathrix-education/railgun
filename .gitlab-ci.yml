# gitlab-ci.yml
# Define the GtLab Pipelines behaviour

stages:
- test
- build
- deploy

tests:
  image: edbizarro/gitlab-ci-pipeline-php:7.2
  stage: test
  services:
  - mysql:5.7
  retry: 2
  variables:
    MYSQL_DATABASE: mathrix_fr_pipelines
    MYSQL_ROOT_PASSWORD: 3AEzrLrSh8j8xJfyHAdB
  script:
  - bash scripts/tasks/tests.sh $CI_COMMIT_REF_NAME
  artifacts:
    paths:
    - storage/logs/
    expire_in: 1 days
    when: always
  only:
  - next
  - master

build:
  image: node:10-alpine
  stage: build
  script:
  - sh scripts/tasks/build.sh
  artifacts:
    paths:
    - build.tar.gz
    expire_in: 1 days
    when: always

deploy_web00_next:
  image: doomkin/ubuntu-ssh
  stage: deploy
  dependencies:
    - build
  environment:
    name: web00/next
    url: https://next.mathrix.fr/api
  script:
    - bash scripts/tasks/deploy.sh web00 next
  only:
    - next

deploy_web00_dev:
  image: doomkin/ubuntu-ssh
  stage: deploy
  dependencies:
  - build
  environment:
    name: web00/dev
    url: https://dev.mathrix.fr/api
  script:
  - bash scripts/tasks/deploy.sh web00 dev
  only:
  - dev

deploy_web01_master:
  image: doomkin/ubuntu-ssh
  stage: deploy
  dependencies:
  - build
  environment:
    name: web01/master
    url: https://mathrix.fr/api
  script:
  - bash scripts/tasks/deploy.sh web01 master
  when: manual
  only:
  - master
  - hotfix

