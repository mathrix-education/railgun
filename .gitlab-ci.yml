stages:
  - test
  - deploy

tests:
  image: edbizarro/gitlab-ci-pipeline-php:7.1
  stage: test
  services:
    - mysql:latest
  variables:
    MYSQL_DATABASE: mathrix_fr_pipelines
    MYSQL_ROOT_PASSWORD: 3AEzrLrSh8j8xJfyHAdB
  script:
    # Setup project files
    - cp config/env/.env.pipelines .env
    - composer install --prefer-dist -q -o
    - php artisan migrate:refresh --seed
    # Setup project database
    - ./vendor/phpunit/phpunit/phpunit -v --stderr

deploy_dev:
  image: toby1991/laravel-envoy
  stage: deploy
  environment:
    name: dev
    url: https://dev.api.mathrix.fr
  script:
    # Setup SSH key
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    #- chmod 0600 storage/ssh/*
    - eval $(ssh-agent -s)
    - chmod 0600 storage/ssh/dev_id_rsa
    - ssh-add storage/ssh/dev_id_rsa
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    # Run envoy task
    - ~/.composer/vendor/bin/envoy run deploy_dev
  only:
    - dev