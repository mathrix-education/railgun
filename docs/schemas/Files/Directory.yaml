description: Directory
type: object
properties:
  type:
    description: The object type.
    type: string
    enum: [dir]
  basename:
    description: The directory name.
    type: string
    example: favorites
  dirname:
    description: The parent directory name.
    type: string
    example: fruits
  path:
    description: The directory path on the CDN.
    type: string
    example: fruits\/favorites
  url:
    description: The directory public url.
    type: string
    example: 'https:\/\/dev.cdn.mathrix.fr\/fruits\/favorites'
