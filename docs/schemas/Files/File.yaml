description: File
type: object
properties:
  type:
    description: The object type.
    type: string
    enum: [file]
  basename:
    description: The file basename name.
    type: string
    example: flower.png
  dirname:
    description: The directory containing file.
    type: string
    example: test
  mimetype:
    description: The file mimetype.
    type: string
    enum:
      - application/pdf
      - image/gif
      - image/jpeg
      - image/svg+xml
      - image/png
      - video/mp4
    example: image/png
  path:
    description: The file path.
    type: string
    example: tests/flower.png
  size_kb:
    description: The file size in kilobytes.
    type: integer
    example: 130
  timestamp:
    description: The file last modification timestamp.
    type: integer
    example: 1567903211
  url:
    description: The file public url.
    type: string
    example: https://dev.cdn.mathrix.fr/tests/flower.png
