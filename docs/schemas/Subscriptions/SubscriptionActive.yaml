$extends:
  ../../fragments/schemas/Subscription.yaml:
description: Active subscription which has not triggered 3DS2.
properties:
  type:
    enum: [stripe]
  latest_invoice:
    allOf:
      - $ref: '#/components/schemas/InvoicePaid'
      - type: object
        properties:
          payment_intent:
            $ref: '#/components/schemas/PaymentIntentSucceeded'
  pending_setup_intent:
    type: object
    nullable: true
    example: null
  payment_method:
    $ref: '#/components/schemas/CreditCard'
  status:
    description: The subcription is `"active"`, no further action is required.
    enum: [active]
