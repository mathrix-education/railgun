$extends:
  SubscriptionBase.yaml:
description: Active subscription which has not triggered 3DS2.
properties:
  type:
    enum: [stripe]
  pending_setup_intent:
    type: object
    nullable: true
    example: null
  latest_invoice:
    allOf:
      - $ref: '#/components/schemas/Invoice'
      - type: object
        properties:
          payment_intent:
            $ref: '#/components/schemas/PaymentIntent'
  status:
    description: The subcription is `"active"`, no further action is required.
    enum: [active]
