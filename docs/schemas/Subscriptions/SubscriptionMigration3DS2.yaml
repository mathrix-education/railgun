$extends:
  SubscriptionBase.yaml:
description: Subscription which has triggered 3DS2. Additional action is required.
properties:
  type:
    enum: [stripe]
  pending_setup_intent:
    description: The subscription setup intent. Has to be fullfilled in order to charge the customer.
    type: object
    properties:
      id:
        description: The setup intent id.
        type: string
      client_secret:
        description: >-
          The setup intent client secret. Has to be used with the Stripe.js
          [handleCardSetup()](https://stripe.com/docs/stripe-js/reference#stripe-handle-card-setup) method.
        externalDocs:
          description: Stripe.js handleCardSetup() documentation
          url: https://stripe.com/docs/stripe-js/reference#stripe-handle-card-setup
      created_at:
        description: The setup intent creation date/time.
        type: string
        format: date-time
      status:
        description: >-
          The setup intent status. In the case, it can only be `"requires_confirmation"` or `"requires_action"`.
        type: string
        enum: [requires_confirmation, requires_action]
        externalDocs:
          description: Stripe SetupIntent statuses documentation
          url: https://stripe.com/docs/payments/intents#intent-statuses
  latest_invoice:
    type: object
    nullable: true
    example: null
  status:
    description: The subcription is `"active"`, 3DS2 process is required.
    enum: [active]
