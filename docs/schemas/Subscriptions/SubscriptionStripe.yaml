$extends:
  ../../fragments/schemas/Subscription.yaml:
properties:
  type:
    enum: [stripe]
  latest_invoice:
    allOf:
      - type: object
        nullable: true
      - $ref: '#/components/schemas/Invoice'
      - type: object
        properties:
          payment_intent:
            $ref: '#/components/schemas/PaymentIntent'
  payment_method:
    $ref: '#/components/schemas/CreditCard'
  status:
    description: The subscription status (the Braintree subscription statuses have been replaced by Stripe statuses).
    type: string
    enum:
      - incomplete
      - incomplete_expired
      - trialing
      - active
      - past_due
      - canceled
      - unpaid
