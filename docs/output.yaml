        settings:
          description: 'The user settings.'
          type: object
          properties:
            sound:
              description: 'If the sounds should be activated on the site for this user.'
              type: boolean
            last_session:
              description: "The user last session (key: discipline id, value: module id).\n"
              type: object
              example:
                1: 1475
                2: 754
                5: 156
            need_paypal_refresh:
              description: "If the user has an active PayPal subscription and subsequently need a payment method refresh.\n"
