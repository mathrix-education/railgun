  '/users/{userId}/subscriptions':
    get:
      summary: 'Get user subscriptions'
      description: 'Get the user subscriptions. Since we are currently using two payment processors - Stripe and Braintree, depending of the source of the subscription, the subscription schemas can be heterogeneous.'
      security:
        -
          bearer:
            - logged
      parameters:
        -
          name: userId
          in: path
          description: 'The targeted user id.'
          required: true
          schema:
            type: integer
            example: 1585
      responses:
        200:
          description: 'The user subscriptions.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    description: 'If the request succeeded.'
                    type: boolean
                    example: true
                  page:
                    description: 'The current page.'
                    type: integer
                    example: 0
                    readOnly: true
                  per_page:
                    description: 'The number of subscriptions per page'
                    type: integer
                    example: 100
                    readOnly: true
                  total:
                    description: 'The total number of subscriptions processed.'
                    type: integer
                    example: 3
                  data:
                    type: array
                    items:
                      oneOf:
                        - { $ref: '#/components/schemas/SubscriptionStripe' }
                        - { $ref: '#/components/schemas/SubscriptionBraintree' }
      tags:
        - Users
