paths:
  /activities:
    get:
      summary: 'Paginate activity'
      description: 'Retrieve all activity by ascending ids, paginated.'
      parameters:
        -
          name: page
          in: query
          description: 'The page **(starts at 0)**.'
          schema:
            type: integer
          example: '7'
          required: true
          style: form
        -
          name: perPage
          in: query
          description: 'The number of activity per page.'
          schema:
            type: integer
          example: 100
          required: true
          style: form
      responses:
        200:
          description: 'The activity in a paginator.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - page
                  - per_page
                  - total
                  - data
                properties:
                  page:
                    description: 'The current page.'
                    type: integer
                    example: '7'
                    readOnly: true
                  per_page:
                    description: 'The number of activity per page.'
                    type: integer
                    example: 100
                    readOnly: true
                  total:
                    description: 'The total number of activity processed.'
                    type: integer
                    example: '2489'
                    readOnly: true
                  data:
                    description: 'The activity as an array.'
                    type: array
                    items:
                      $ref: '#/components/schemas/Activity'
                    readOnly: true
      security:
        -
          bearer:
            - 'activities:read'
      tags:
        - Activities
    post:
      summary: 'Post activity'
      description: 'Create a new activity, and insert it in the database, then retrieve it.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Activity'
      responses:
        200:
          description: 'The newly created activity.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    description: 'If the request succeeded.'
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/Activity'
        422:
          $ref: '#/components/responses/422_ModelValidation'
      security:
        -
          bearer:
            - 'activities:write'
      tags:
        - Activities
  '/activities/{activityId}':
    get:
      summary: 'Get activity'
      parameters:
        -
          name: activityId
          in: path
          description: 'The activity id.'
          required: true
          schema:
            type: integer
            example: '130'
      responses:
        200:
          description: 'The requested activity.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    description: 'If the request succeeded.'
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/Activity'
        404:
          $ref: '#/components/responses/404_ModelNotFound'
      tags:
        - Activities
    patch:
      summary: 'Patch activity'
      parameters:
        -
          name: activityId
          in: path
          description: 'The activity id.'
          required: true
          schema:
            type: integer
            example: '556'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Activity'
      responses:
        200:
          description: 'The patched activity.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    description: 'If the request succeeded.'
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/Activity'
        404:
          $ref: '#/components/responses/404_ModelNotFound'
        422:
          $ref: '#/components/responses/422_ModelValidation'
      security:
        -
          bearer:
            - 'activities:write'
      tags:
        - Activities
    delete:
      summary: 'Delete activity'
      parameters:
        -
          name: activityId
          in: path
          description: 'The activity id.'
          required: true
          schema:
            type: integer
            example: '411'
      responses:
        200:
          description: 'The deletion result.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    description: 'If the deletion was sucessful.'
                    type: boolean
                    default: true
                  message:
                    description: 'The deletion message.'
                    type: string
                    example: 'Activity id 411 was successfully deleted.'
        404:
          $ref: '#/components/responses/404_ModelNotFound'
      security:
        -
          bearer:
            - 'activities:delete'
      tags:
        - Activities
  '/activities/{activityId}/mark':
    patch:
      summary: 'Mark an activity'
      description: 'Mark a activity as `completed`, `view`, `to-revise`...'
      security:
        -
          bearer:
            - logged
      parameters:
        -
          name: activityId
          in: path
          description: 'The activity id.'
          required: true
          schema:
            type: int
            example: 5745
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  description: 'The mark status.'
                  type: string
                  enum:
                    - completed
                    - view
                    - to-revise
      responses:
        200:
          description: 'The marked activity.'
          content:
            application/json:
              schema:
                $ref: '../../index.yaml#/components/schemas/Activity'
        404:
          $ref: '../../index.yaml#/components/responses/404_ModelNotFound'
      tags:
        - Activities
  '/activities/{activityId}/modules':
    get:
      summary: 'Get related module'
      description: 'Retrieve all module linked to a given activity id, paginated.'
      parameters:
        -
          name: activityId
          in: path
          description: 'The activity id'
          schema:
            type: integer
          example: '133'
          required: true
        -
          name: page
          in: query
          description: 'The page **(starts at 0)**.'
          schema:
            type: integer
          example: '9'
          required: true
        -
          name: perPage
          in: query
          description: 'The number of module per page.'
          schema:
            type: integer
          example: 100
          required: true
      responses:
        200:
          description: 'The module in a paginator.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - page
                  - per_page
                  - total
                  - data
                properties:
                  page:
                    description: 'The current page.'
                    type: integer
                    example: 4
                    readOnly: true
                  per_page:
                    description: 'The number of module per page.'
                    type: integer
                    example: 100
                    readOnly: true
                  total:
                    description: 'The total number of module processed.'
                    type: integer
                    example: 1845
                    readOnly: true
                  data:
                    description: 'The module as an array.'
                    type: array
                    items:
                      $ref: '#/components/schemas/Module'
                    readOnly: true
      tags:
        - Activities
  '/activities/{activityId}/unmark':
    patch:
      summary: 'Unmark an activity'
      description: 'Unmark an activity.'
      security:
        -
          bearer:
            - logged
      parameters:
        -
          name: activityId
          in: path
          description: 'The activity id.'
          required: true
          schema:
            type: int
            example: 5745
      responses:
        200:
          description: 'The un-marked activity.'
          content:
            application/json:
              schema:
                $ref: '../../index.yaml#/components/schemas/Activity'
        404:
          $ref: '../../index.yaml#/components/responses/404_ModelNotFound'
      tags:
        - Activities
  /auth/forgot:
    post:
      summary: 'Forgot password'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  description: 'The user email.'
                  type: string
                  example: john.doe@example.org
      responses:
        200:
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    description: 'The error standardized name.'
                    type: boolean
                    enum:
                      - true
                  message:
                    description: 'The message.'
                    type: string
                    example: 'Reset email sent successfully'
        400:
          description: 'Bad request.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    description: 'The error message.'
                    type: string
                    enum:
                      - bad_request
                  message:
                    description: 'The error detailed message.'
                    type: string
                    enum:
                      - 'Cannot reset password of a facebook account'
      tags:
        - Auth
  /auth/login:
    post:
      summary: Login
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  description: 'The user email.'
                  type: string
                  example: john.doe@example.com
                password:
                  description: 'The user password.'
                  type: string
                  example: MyExtreme$Pwd
      responses:
        200:
          $ref: '../../index.yaml#/components/responses/200_Token'
        401:
          description: 'Invalid credentials.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    description: 'The error message.'
                    type: string
                    enum:
                      - invalid_credentials
                  message:
                    description: 'The error detailed message.'
                    type: string
                    enum:
                      - 'The given credentials were invalid.'
      tags:
        - Auth
