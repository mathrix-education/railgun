    Subscription:
      description: 'A Subscription (Stripe **or** Braintree)'
      type: object
      properties:
        type:
          description: 'The subscription type.'
          type: string
          enum:
            - stripe
            - braintree
        id:
          description: 'The subscription id.'
          type: string
          example: sub_FkgEkmuI3DFejK
        cancel_at:
          description: 'The subscription cancel **future** date.'
          type: string
          format: date-time
          nullable: true
        cancel_at_period_end:
          description: 'If the subscription will cancel at the end of the current billing period.'
          type: boolean
        canceled_at:
          description: 'The subscription cancel **past** date.'
          type: string
          format: date-time
          nullable: true
        created_at:
          description: 'The date/time the subscription was created.'
          type: string
          format: date-time
        current_period_start:
          description: 'The date/time of the beginning of the current period.'
          type: string
          format: date-time
        current_period_end:
          description: 'The date/time of the end of the current period.'
          type: string
          format: date-time
        customer:
          description: 'The customer id who own the subscription. Refers to `stripe_id` or `braintree_id` on users.'
          type: string
          example: cus_FkgEYnEbkQZF6G
        plan:
          description: 'The subscription plan.'
          type: object
          properties:
            id:
              description: 'The plan id.'
              type: string
              example: v5_monthly
            amount:
              description: 'The plan amount **in cents**.'
              type: integer
              example: 1790
        payment_method:
          oneOf:
            -
              description: 'The credit card attached to the subscription.'
              type: object
              properties:
                type:
                  description: 'The subscription payment method type.'
                  type: string
                  enum:
                    - card
                brand:
                  description: 'The credit card brand.'
                  type: string
                  enum:
                    - american-express
                    - carte-blanche
                    - china-unionpay
                    - diners-club
                    - discover
                    - elo
                    - jcb
                    - laser
                    - maestro
                    - mastercard
                    - solo
                    - switch
                    - unionpay
                    - visa
                    - unknown
                last4:
                  description: 'The scredit card last four digits.'
                  type: string
                  min: 4
                  max: 4
                  example: 1234
                expiration:
                  description: 'The credit card expiration date/time.'
                  type: string
                  format: date-time
            -
              description: 'The PayPal account linked to the subscription.'
              type: object
              properties:
                type:
                  description: 'The payment method type.'
                  type: string
                  enum:
                    - paypal
                email:
                  description: 'The PayPal account email address.'
                  type: string
                  format: email
                  example: john.doe@gmail.com
        status:
          description: 'The subscription status (the Braintree subscription statuses have been tropsed to Stripe statuses).'
          type: string
          enum:
            - incomplete
            - incomplete_expired
            - trialing
            - active
            - past_due
            - canceled
            - unpaid
          externalDocs:
            description: 'Stripe Status'
            url: 'https://stripe.com/docs/api/subscriptions/object#subscription_object-status'
        trial_end:
          description: 'The subscription trial end date, if necessary. `null` otherwise.'
          type: string
          format: date-time
          nullable: true
    User:
      description: User
      type: object
      required:
        - id
        - username
        - email
        - firstname
        - lastname
        - scopes
        - points
        - level
        - daily
        - daily_achievements
