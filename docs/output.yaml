openapi: 3.0.2
info:
  title: 'Mathrix Education SA API'
  description: 'This is the official documentation of Mathrix Education SA API.'
  contact:
    name: 'Mathieu Bour'
    email: mathieu@mathrix.fr
  x-logo:
    url: 'https://cdn.mathrix.fr/img/logo-redoc.png'
    href: 'https://mathrix.fr'
    altText: 'Mathrix Education Logo'
  version: 6.0.0
servers:
  -
    url: 'https://mathrix.fr/api'
    description: 'The production API.'
  -
    url: 'https://dev.mathrix.fr/api'
    description: 'The development API.'
components:
  securitySchemes:
    bearer:
      description: 'The standard user authorizations.'
      type: http
      scheme: bearer
      bearerFormat: JWT
  requestBodies:
    Search:
      description: Search
      type: object
      properties:
        field(s):
          description: 'The field where the associated query will be applied. Use `%` as wildcard. Multiple fields are allowed.'
          type: string
          example: '%lorem%'
        order:
          description: 'The order object descriptor.'
          type: object
          properties:
            dir:
              description: 'The order direction.'
              type: string
              enum:
                - asc
                - desc
            column:
              description: 'The order column.'
              type: string
              example: id
        having:
          description: 'Query relationships of the targeted model.'
          field(s):
            description: 'The field where the associated query will be applied. Use `%` as wildcard. Multiple fields are allowed.'
            type: string
            example: '%lorem%'
  responses:
    200_Success:
      description: Success.
      type: object
      properties:
        success:
          description: 'If the request succeeded.'
          type: boolean
          example: true
    200_SuccessMessage:
      description: Success.
      content:
        application/json:
          schema:
            type: object
            required:
              - success
              - message
            properties:
              success:
                description: 'The error standardized name.'
                type: boolean
                enum:
                  - true
              message:
                description: 'The message.'
                type: string
    200_Token:
      description: 'The JWT token.'
      content:
        application/json:
          schema:
            type: object
            properties:
              token:
                description: "The token, JWT-serialized. Check [jwt.io](jwt.io) for more details about JSON Web Tokens.\n"
                type: string
                example: "eyJ0eXAiOiJKV1QiLCJhbGciOiJFUzUxMiJ9.eyJpc3MiOiJNYXRocml4IEVkd WNhdGlvbiBBUEkiLCJzdWIiOjE4LCJhdWQiOiJNYXRocml4IEVkdWNhdGlvbiB BUEkiLCJleHAiOjE1NjQ3Nzg2MzEsIm5iZiI6MTU1NjgyOTgzMSwiaWF0IjoxN TU2ODI5ODMxLCJqdGkiOiI2NWFkYmU3Ny1kYmE0LTRmN2EtODMyMC1hZTEwOTI 0YmM2NDQifQ.Ae5bU6JaTDQnwNeTOqGNd_S_Tz7xjT6vMGjByVOhsI4dmrxpom 5054QDIhMiGKGfE0epQEAabU3os_KmMWw3__1hAWODFBwYOrm27Kt4oV3OfKie 7NrPbig4RvuxBgYAn8derTwj43vR5psyn-x4tyurj_nY3_zz13Qela5f0sjf1w M3\n"
    401_Unauthorized:
      description: Unauthorized.
      content:
        application/json:
          schema:
            type: object
            required:
              - error
              - message
            properties:
              error:
                description: 'The error standardized name.'
                type: string
                enum:
                  - unauthorized
              message:
                description: 'The error message.'
                type: string
                example: 'lorem ipsum'
    404_FileNotFound:
      description: 'File not found.'
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                description: 'The error message.'
                type: string
                example: file_not_found
              message:
                description: 'The error detailed message.'
                type: string
                example: 'The file test/foo.jpg does not exist.'
    404_ModelNotFound:
      description: 'Model not found.'
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                description: 'The error message.'
                type: string
                example: model_not_found
    422_ModelValidation:
      description: 'Model failed to pass validation.'
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                description: 'The error description.'
                type: string
                example: model_validation
    422_Validation:
      description: 'Model failed to pass validation.'
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                description: 'The error description.'
                type: string
                example: validation
              errors:
                description: 'The validation errors'
                type: object
                properties:
                  field:
                    type: string
                    example: 'value is not...'
  schemas:
    Activity:
      description: Activity
      type: object
      properties:
        id:
          description: 'The activity id.'
          type: integer
          example: 22
          readOnly: true
        name:
          description: 'The activity name.'
          type: string
          example: 'lorem ipsum'
        type:
          description: 'The activity type.'
          type: string
          enum:
            - video
            - course
            - test
            - exercise
            - summary
            - flashcard
        visible:
          description: 'The activity visibility.'
          type: boolean
        order:
          description: 'The activity order.'
          type: integer
        premium:
          description: 'The activity premium state.'
          type: boolean
          example: true
        reviewed:
          description: 'If the activty has been reviewed.'
          type: boolean
          example: false
        notion_id:
          description: 'The activition aprent notion id.'
          type: integer
          example: 44
        module_count:
          description: 'The number of **visible** modules linked with the activity.'
          type: integer
          example: 5
        created_at:
          description: 'The activity creation date-time.'
          type: string
          format: date-time
          nullable: true
          readOnly: true
        updated_at:
          description: 'The activity last update date-time.'
          type: string
          format: date-time
          nullable: true
          readOnly: true
        mark:
          description: 'The activity status __per user__.'
          type: string
          enum:
            - view
            - to_revise
            - completed
            - null
          nullable: true
          readOnly: true
    Category:
      description: Category
      type: object
      properties:
        id:
          description: 'The category id.'
          type: integer
          example: 22
          readOnly: true
        name:
          description: 'The category name.'
          type: string
          example: 'lorem ipsum'
        slug:
          description: 'The category slug.'
          type: string
          example: lorem-ipsum
        image:
          description: 'The category image url.'
          type: string
          example: 'https://cdn.mathrix.fr/categories/lorem-ipsum.png'
          nullable: true
        created_at:
          description: 'The activity creation date-time.'
          type: string
          format: date-time
          nullable: true
        updated_at:
          description: 'The activity last update date-time.'
          type: string
          format: date-time
          nullable: true
    Chapter:
      description: Chapter
      type: object
      properties:
        id:
          description: 'The chapter id.'
          type: integer
          readOnly: true
          example: 22
        name:
          description: 'The chapter name.'
          type: string
          example: 'lorem ipsum'
        slug:
          description: 'The chapter slug.'
          type: string
          example: lorem-ipsum
        order:
          description: 'The chapter order.'
          type: integer
          example: 2
        visible:
          description: 'The chapter visibility.'
          type: boolean
          example: true
        grade_id:
          description: 'The chapter grade id.'
          type: integer
          example: 5
        discipline_id:
          description: 'The chapter discipline id.'
          type: integer
          example: 3
        created_at:
          description: 'The chapter creation date-time.'
          type: string
          format: date-time
          nullable: true
        updated_at:
          description: 'The chapter last update date-time.'
          type: string
          format: date-time
          nullable: true
        notion_count:
          description: 'The number of **visible** notions linked with the chapter.'
          type: integer
          example: 10
        activity_count:
          description: 'The number of **visible** activities linked with the chapter.'
          type: integer
          example: 12
        activity_to_revise:
          description: 'The chapter activities `to_revise` count. `null` for not-logged users.'
          type: integer
          nullable: true
          example: 7
        activity_completed:
          description: 'The chapter activities `completed` count. `null` for not-logged users.'
          type: integer
          nullable: true
          example: 2
    Comment:
      description: Comment.
      type: object
      required:
        - id
        - content
        - parent_id
        - user_id
        - module_id
        - created_at
        - updated_at
        - score
        - user_vote
      properties:
        id:
          description: 'The comment id.'
          type: integer
          readOnly: true
          example: 22
        content:
          description: 'The comment content.'
          type: string
          example: 'lorem ipsum quae dolores.'
        parent_id:
          description: 'The parent comment id if the comment is a response.'
          type: integer
          example: 12
          nullable: true
        user_id:
          description: 'The comment user_id.'
          type: integer
          readOnly: true
          example: 10
        module_id:
          description: 'The module id which belongs to the comment.'
          type: integer
        created_at:
          description: 'The Date/time when the comment was created.'
          type: string
          format: date-time
          readOnly: true
        updated_at:
          description: 'The Date/time when the comment was updated.'
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          description: 'The Date/time when the comment was deleted.'
          type: string
          format: date-time
          nullable: true
          readOnly: true
        score:
          description: 'The comment total score.'
          type: integer
          example: 17
          readOnly: true
        user_vote:
          description: 'The user vote value, can be +/-1. `0` if the user has not voted for this comment.'
          type: integer
          enum:
            - 1
            - 0
            - -1
          readOnly: true
        user:
          description: 'The user who posted the comment.'
          type: object
          readOnly: true
          required:
            - id
            - username
            - firstname
            - level
            - grade_id
          properties:
            id:
              description: 'The user id.'
              type: integer
              example: 12
            username:
              description: 'The user username.'
              type: string
              example: john.doe
              nullable: true
            firstname:
              description: 'The user first name.'
              type: string
              example: John
              nullable: true
            level:
              description: 'The user level based on its points amount.'
              type: integer
              example: 17
            grade_id:
              description: 'The class id which belongs to the user.'
              type: integer
              nullable: true
        children:
          type: array
          items:
            $ref: '#/components/schemas/CommentChild'
          readOnly: true
    CommentChild:
      description: Comment.
      type: object
      required:
        - id
        - content
        - parent_id
        - user_id
        - module_id
        - created_at
        - updated_at
        - score
        - user_vote
      properties:
        id:
          description: 'The comment id.'
          type: integer
          readOnly: true
          example: 22
        content:
          description: 'The comment content.'
          type: string
          example: 'lorem ipsum quae dolores.'
        parent_id:
          description: 'The parent comment id if the comment is a response.'
          type: integer
          example: 12
          nullable: true
        user_id:
          description: 'The comment user_id.'
          type: integer
          readOnly: true
          example: 10
        module_id:
          description: 'The module id which belongs to the comment.'
          type: integer
        created_at:
          description: 'The Date/time when the comment was created.'
          type: string
          format: date-time
          readOnly: true
        updated_at:
          description: 'The Date/time when the comment was updated.'
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          description: 'The Date/time when the comment was deleted.'
          type: string
          format: date-time
          nullable: true
          readOnly: true
        score:
          description: 'The comment total score.'
          type: integer
          example: 17
          readOnly: true
        user_vote:
          description: 'The user vote value, can be +/-1. `0` if the user has not voted for this comment.'
          type: integer
          enum:
            - 1
            - 0
            - -1
          readOnly: true
        user:
          description: 'The user who posted the comment.'
          type: object
          readOnly: true
          required:
            - id
            - username
            - firstname
            - level
            - grade_id
          properties:
            id:
              description: 'The user id.'
              type: integer
              example: 12
            username:
              description: 'The user username.'
              type: string
              example: john.doe
              nullable: true
            firstname:
              description: 'The user first name.'
              type: string
              example: John
              nullable: true
            level:
              description: 'The user level based on its points amount.'
              type: integer
              example: 17
            grade_id:
              description: 'The class id which belongs to the user.'
              type: integer
              nullable: true
    Country:
      description: Country.
      type: object
      properties:
        id:
          description: 'The country id.'
          type: integer
          readOnly: true
          example: 33
        name:
          description: 'The country name.'
          type: string
          example: France
        slug:
          description: 'The country slug.'
          type: string
          example: france
        visible:
          description: 'The country visibility.'
          type: boolean
          example: true
        created_at:
          description: 'The country creation date-time.'
          type: string
          format: date-time
          readOnly: true
          nullable: true
        updated_at:
          description: 'The country last update date-time.'
          type: string
          format: date-time
          readOnly: true
          nullable: true
    Directory:
      description: Directory
      type: object
      required:
        - type
        - path
        - dirname
        - basename
        - filename
        - url
      properties:
        path:
          description: 'The directory path.'
          type: string
          example: test
        dirname:
          description: 'The the parent directory of the directory .'
          type: string
          example: ''
        basename:
          description: 'The basename of the directory.'
          type: string
          example: test
        filename:
          description: 'The filename of the directory (without extension).'
          type: string
          example: test
        type:
          description: 'The directory type.'
          type: string
          enum:
            - dir
        url:
          description: 'The directory public URL, starting with the CDN root.'
          type: string
          example: 'https://cdn.mathrix.fr/test/'
    Discipline:
      description: Discipline
      type: object
      properties:
        id:
          description: 'The discipline id.'
          type: integer
          example: 22
        name:
          description: 'The discipline name.'
          type: string
          example: Maths
        slug:
          description: 'The discipline slug.'
          type: string
          example: maths
        beta:
          description: 'The discipline beta state.'
          type: boolean
        created_at:
          description: 'The discipline creation date-time.'
          type: string
          format: date-time
          nullable: true
        updated_at:
          description: 'The discipline last update date-time.'
          type: string
          format: date-time
          nullable: true
    Discount:
      description: Discount.
      type: object
      properties:
        id:
          description: 'The discount id.'
          type: integer
          example: 33
        code:
          description: 'The discount code.'
          type: string
          example: MODEMACHINE2018
        type:
          description: 'The discount type.'
          type: string
          enum:
            - percentage
            - absolute
        value:
          description: 'The discount value is euro (€).'
          type: integer
          example: 20.5
        counter:
          description: 'The discount counter (e.g. the number of time the discount can be used). `-1` means unlimited times.'
          type: integer
          example: 93
        expire_at:
          description: 'The discount expiration date/time. After this date, the discount is considered as expired and cannot be used anymore'
          type: string
          format: date-time
          nullable: true
        created_at:
          description: 'The country creation date-time.'
          type: string
          format: date-time
          nullable: true
        updated_at:
          description: 'The country last update date-time.'
          type: string
          format: date-time
          nullable: true
    File:
      description: File
      type: object
      required:
        - type
        - path
        - dirname
        - basename
        - filename
        - extension
        - size
        - mimetype
        - timestamp
        - url
      properties:
        type:
          description: 'The file type.'
          type: string
          enum:
            - file
        path:
          description: 'The file path on the CDN.'
          type: string
          example: test/Mao.jpg
        dirname:
          description: 'The parent directory of the file.'
          type: string
          example: test
        basename:
          description: 'The basename of the file.'
          type: string
          example: Mao.jpg
        filename:
          description: 'The filename of the file (without extension).'
          type: string
          example: test
        extension:
          description: 'The extension of the file.'
          type: string
          example: jpg
        mimetype:
          description: 'The file mime/type.'
          type: string
          example: image/jpeg
        size:
          description: 'The file size in bytes.'
          type: integer
          example: 4096
        timestamp:
          description: 'The file last-modified timestamp.'
          type: integer
          example: 1540371288
        url:
          description: 'The file public URL, starting with the CDN root.'
          type: string
          example: 'https://cdn.mathrix.fr/test/foo.jpg'
    Grade:
      description: Grade
      type: object
      required:
        - id
        - name
        - slug
        - order
        - visible
        - parent_id
        - country_id
        - created_at
        - updated_at
      properties:
        id:
          description: 'The grade id.'
          readOnly: true
          type: integer
          example: 22
        name:
          description: 'The grade name.'
          type: string
          example: 'Terminale S'
        slug:
          description: 'The grade slug.'
          type: string
          example: terminale-s
          pattern: '^[a-z0-9\-]+$'
        order:
          description: 'The grade order.'
          type: integer
          example: 3
        visible:
          description: 'The grade order.'
          type: boolean
        parent_id:
          description: 'The grade order.'
          type: integer
          nullable: true
          example: 1
        country_id:
          description: 'The grade country id.'
          type: integer
          example: 2
        created_at:
          description: 'The grade creation date-time.'
          type: string
          format: date-time
        updated_at:
          description: 'The grade last update date-time.'
          type: string
          format: date-time
    Invoice:
      description: Invoice
      type: object
      properties:
        id:
          description: 'The invoice id.'
          type: string
          example: in_1FFRv2J3KapFDTUEAg7bqbxt
        amount_due:
          description: 'The invoice amount due (**in cents**).'
          type: integer
          example: 1790
        amount_paid:
          description: 'The invoice amount paid (**in cents**).'
          type: integer
          example: 0
        hosted_invoice_url:
          description: 'The invoice payment page hosted by Stripe.'
          type: string
          example: 'https://pay.stripe.com/invoice/invst_JyuaGOzhuskhxfMgqkG3q9uWDV'
        invoice_pdf:
          description: 'The invoice PDF document.'
          type: string
          example: 'https://pay.stripe.com/invoice/invst_JyuaGOzhuskhxfMgqkG3q9uWDV/pdf'
        period_end:
          description: 'The invoice related period end date/time.'
          type: string
          format: date-time
        period_start:
          description: 'The invoice related period start date/time.'
          type: string
          format: date-time
        status:
          description: 'The invoice status.'
          type: string
          enum:
            - draft
            - open
            - paid
            - uncollectible
            - void
          externalDocs:
            description: 'Stripe Invoices overview'
            url: 'https://stripe.com/docs/billing/invoices/workflow#workflow-overview'
        subscription:
          description: 'The related subscription id.'
          type: string
          example: sub_FkxqSe4WQfbU0D
    Level:
      description: File
      type: object
      properties:
        id:
          description: 'The discipline id.'
          readOnly: true
          type: integer
          example: 22
        level:
          description: 'The level number.'
          type: integer
          example: 17
        objective:
          description: 'The number of points required to pass this level.'
          type: integer
          example: 180
        youtube_id:
          description: 'The level video YouTube ID.'
          type: string
          example: 9yZKLSUr2U9
          nullable: true
    Mark:
      description: Mark
      type: object
      required:
        - country
        - discipline
        - grade
        - chapter
        - notion
        - activity
      properties:
        country:
          $ref: '#/components/schemas/Country'
        discipline:
          $ref: '#/components/schemas/Discipline'
        grade:
          $ref: '#/components/schemas/Grade'
        chapter:
          $ref: '#/components/schemas/Chapter'
        notion:
          $ref: '#/components/schemas/Notion'
        activity:
          $ref: '#/components/schemas/Activity'
    Module:
      anyOf:
        -
          $ref: '#/components/schemas/ModuleCourse'
        -
          $ref: '#/components/schemas/ModuleMCQ'
        -
          $ref: '#/components/schemas/ModuleFlashcard'
        -
          $ref: '#/components/schemas/ModuleTest'
        -
          $ref: '#/components/schemas/ModuleStriped'
    Notion:
      description: Notion
      type: object
      properties:
        id:
          description: 'The notion id.'
          type: integer
          example: 14
          readOnly: true
        name:
          description: 'The notion name.'
          type: string
          example: 'My super nice notion'
        type:
          description: 'The notion type.'
          type: string
          enum:
            - normal
            - premium
            - reminder
            - further
        visible:
          description: 'The notion visibility.'
          type: boolean
        order:
          description: 'The notion order.'
          type: integer
          example: 2
        chapter_id:
          description: 'The notion linked chapter id.'
          type: integer
          example: 39
        activity_count:
          description: 'The number of **visible** activities linked with the notion.'
          type: integer
          example: 12
        created_at:
          description: 'The notion creation date-time.'
          type: string
          format: date-time
          nullable: true
          readOnly: true
        updated_at:
          description: 'The notion last update date-time.'
          type: string
          format: date-time
          nullable: true
          readOnly: true
    Paginator:
      type: object
      required:
        - page
        - per_page
        - total
        - data
      properties:
        page:
          description: 'The current page.'
          type: integer
          example: 4
          readOnly: true
        per_page:
          description: 'The number of models per page.'
          type: integer
          example: 100
          readOnly: true
        total:
          description: 'The total number of models processed.'
          type: integer
          example: 1845
          readOnly: true
        data:
          description: 'The models as an array.'
          type: array
          items:
            type: object
          readOnly: true
    PaymentIntent:
      description: 'The subscription latest invoice payment intent.'
      type: object
      additionalProperties: false
      properties:
        id:
          description: 'The payment intent id.'
          type: string
          example: pi_1FFRv2J3KapFDTUE5r8hFcIL
        amount:
          description: 'The payment intent amount (**in cents**).'
          type: integer
          example: 1790
        client_secret:
          description: 'If subscription requires 3D Secure 2 Authentication, use the `client_secret` to authenticate the used card via the Stripe.js `handleCardPayment()` function.'
          externalDocs:
            description: 'Stripe.js `handleCardPayment()`'
            url: 'https://stripe.com/docs/stripe-js/reference#stripe-handle-card-payment'
          type: string
          example: pi_1FDZZPJ3KapFDTUE7ACor7QN_secret_Z1j93AE03EzhWB0nsCLYZlCm7
        created_at:
          description: 'The date/time the payment intent was created.'
          type: string
          format: date-time
        status:
          description: 'The payment intent status.'
          type: string
          enum:
            - requires_payment_method
            - requires_confirmation
            - requires_action
            - processing
            - canceled
            - succeeded
          externalDocs:
            description: 'Payment Intent statuses on Stripe'
            url: 'https://stripe.com/docs/payments/intents#intent-statuses'
    Plan:
      description: Plan
      type: object
      required:
        - id
        - prorated
        - period
        - price_per_period
