                  example: fake-valid-visa-nonce
                make_default:
                  description: "Make the new payment method the default customer payment method. Must be used with `payment_method_nonce`.\n"
                  type: boolean
                  example: true
                  default: false
      responses:
        200:
          description: 'The patched subscription.'
          content:
            application/json:
              schema:
                $ref: '../../index.yaml#/components/schemas/Braintree_Subscription'
        400:
          description: 'Bad request.'
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '../../index.yaml#/components/schemas/GatewayRejection'
        404:
          $ref: '../../index.yaml#/components/responses/404_ModelNotFound'
        422:
          $ref: '../../index.yaml#/components/responses/422_ModelValidation'
      tags:
        - Subscriptions
  '/subscriptions/{subscriptionId}/cancel':
    post:
      summary: 'Cancel subscription'
      parameters:
        -
          name: subscriptionId
          in: path
          description: 'The subscription id.'
          required: true
          schema:
            type: string
            pattern: 'sub_[0-9a-f]{32}'
            example: sub_2a06527b38e20836c307c32e3a257736
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                now:
                  description: 'If the subscription should be cancelled now.'
                  type: boolean
                  default: false
      responses:
        200:
          description: 'The cancelled subscription.'
          content:
            application/json:
              schema:
                $ref: '../../index.yaml#/components/schemas/Braintree_Subscription'
        422:
          $ref: '../../index.yaml#/components/responses/422_ModelValidation'
      tags:
        - Subscriptions
  /users:
    get:
      summary: 'Paginate user'
      description: 'Retrieve all user by ascending ids, paginated.'
      parameters:
        -
          name: page
          in: query
          description: 'The page **(starts at 0)**.'
          schema:
            type: integer
          example: '6'
          required: true
          style: form
        -
          name: perPage
          in: query
          description: 'The number of user per page.'
          schema:
            type: integer
          example: 100
          required: true
          style: form
      responses:
        200:
          description: 'The user in a paginator.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - page
                  - per_page
                  - total
                  - data
                properties:
                  page:
                    description: 'The current page.'
                    type: integer
                    example: '6'
                    readOnly: true
                  per_page:
                    description: 'The number of user per page.'
                    type: integer
                    example: 100
                    readOnly: true
                  total:
                    description: 'The total number of user processed.'
                    type: integer
                    example: '325'
                    readOnly: true
                  data:
                    description: 'The user as an array.'
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                    readOnly: true
      security:
        -
          bearer:
            - 'users:read'
      tags:
        - Users
    post:
      summary: Register
      description: 'Create a new user. This action may be used by non-logged user.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  description: 'The user email.'
                  type: string
                  format: email
                  example: john.doe@example.com
                password:
                  description: 'The user password.'
                  type: string
                  format: password
                  example: mysupermagepassword
      responses:
        200:
          description: 'The newly created user.'
          content:
            application/json:
              schema:
                $ref: '../../index.yaml#/components/schemas/User'
      tags:
        - Users
  '/users/{userId}':
    get:
      summary: 'Get user'
      parameters:
        -
          name: userId
          in: path
          description: 'The user id.'
          required: true
          schema:
            type: integer
            example: '954'
      responses:
        200:
          description: 'The requested user.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    description: 'If the request succeeded.'
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/User'
        404:
          $ref: '#/components/responses/404_ModelNotFound'
        401:
          $ref: '../../index.yaml#/components/responses/401_Unauthorized'
      description: "Get a user by its id. Note that the scope `admin` is required in order to get a profile which is **not** the current user.\n"
      security:
        -
          bearer:
            - logged
      tags:
        - Users
    patch:
      summary: 'Patch user'
      parameters:
        -
          name: userId
          in: path
          description: 'The user id.'
          required: true
          schema:
            type: integer
            example: '520'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        200:
          description: 'The patched user.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    description: 'If the request succeeded.'
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/User'
        404:
          $ref: '#/components/responses/404_ModelNotFound'
        422:
          $ref: '#/components/responses/422_ModelValidation'
      description: "Patch a user by its id. Note that the scope `admin` is required in order to patch a profile which is **not** the current user.\n"
      security:
        -
          bearer:
            - logged
      tags:
        - Users
    delete:
      summary: 'Delete user'
      parameters:
        -
          name: userId
          in: path
          description: 'The user id.'
          required: true
          schema:
            type: integer
            example: '556'
      responses:
        200:
          description: 'The deletion result.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    description: 'If the deletion was sucessful.'
                    type: boolean
                    default: true
                  message:
                    description: 'The deletion message.'
                    type: string
                    example: 'User id 556 was successfully deleted.'
        404:
          $ref: '#/components/responses/404_ModelNotFound'
      security:
        -
          bearer:
            - 'users:write'
      tags:
        - Users
  '/users/{userId}/cache':
    delete:
      summary: 'Clear cache'
      security:
        -
          bearer:
            - 'users:write'
      parameters:
        -
          name: userId
          in: path
          description: 'The targeted user id.'
          required: true
          schema:
            type: integer
            example: 1585
      responses:
        200:
          description: 'The cache clear result.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    description: 'If the user cache was successfully cleared.'
                    type: boolean
                    example: true
                  message:
                    description: 'The message.'
                    type: string
                    example: 'User with id `1585` cache was successfully cleared.'
        404:
          $ref: '../../index.yaml#/components/responses/404_ModelNotFound'
      tags:
        - Users
  '/users/{userId}/points':
    post:
      summary: 'Add points'
      description: "Add an arbitrary amount of points to the target user. Passing a loggable model prevents multiple points addition for the same resource. **This limitation everyday, at midnight (Paris time)**.\n"
      security:
        -
          bearer:
            - logged
      parameters:
        -
          name: userId
          in: path
          description: 'The targeted user id.'
          required: true
          schema:
            type: integer
            example: 1585
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - points
              properties:
                points:
                  description: 'The number of points to be added.'
                  type: integer
                  example: 100
                loggable_type:
                  description: "The model type to associated with the request. Currently, only `\"module\"` is supported.\n"
                  type: string
                  enum:
                    - module
                loggable_id:
                  description: 'The model id associated with the request.'
                  type: integer
                  example: 165
      responses:
        200:
          description: 'The user with his updated points counter.'
          content:
            application/json:
              schema:
                $ref: '../../index.yaml#/components/schemas/User'
        404:
          $ref: '../../index.yaml#/components/responses/404_ModelNotFound'
      tags:
        - Users
  '/votes/comment/{commentId}':
    post:
      summary: 'Post vote'
      security:
        -
          bearer:
            - logged
      parameters:
        -
          name: commentId
          in: path
          descrption: 'The comment id.'
          required: true
          schema:
            type: integer
            example: 1585
      requestBody:
        content:
          application/json:
            schema:
              $ref: '../../index.yaml#/components/schemas/Vote'
      responses:
        200:
          description: 'The newly created vote.'
          content:
            application/json:
              schema:
                $ref: '../../index.yaml#/components/schemas/Vote'
      tags:
        - Votes
    delete:
      summary: 'Delete vote'
      security:
        -
          bearer:
            - logged
      parameters:
        -
          name: commentId
          in: path
          descrption: 'The comment id.'
          required: true
          schema:
            type: integer
            example: 1585
      responses:
        200:
          description: 'The newly created vote.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    description: 'If the deletion was sucessful.'
                    type: boolean
                    default: true
                  message:
                    description: 'The deletion message.'
                    type: string
                    example: 'Vote associated to comment id 1585 was successfully deleted.'
      tags:
        - Votes
