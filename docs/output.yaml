          description: 'The setting key.'
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9\-\_]+$'
            example: super-setting-key
      responses:
        200:
          description: 'The deletion result.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    description: 'If the deletion was sucessful.'
                    type: boolean
                    default: true
                  message:
                    description: 'The deletion message.'
                    type: string
                    example: 'Setting key super-setting-key was successfully deleted.'
      tags:
        - Settings
  /subscriptions:
    post:
      summary: 'Create subscription'
      description: "Create new subscription for the current logged user. If the user is not a Stripe customer, his profile will be automatically created.\n### Using new payment method\nIf the user is not a Stripe customer or want to use a new payment method, Stripe Elements should be used to safely collect the user credit card details. Then, the **tokenized** credit card can be passed in the `card.token` field.\nSample payload:\n<pre>{\n  \"plan\": \"v4_monthly\",\n  \"card\": {\n    \"token\": \"tok_fr\"\n  }\n}</pre>\n### Using an existing payment method\nIf the user is already a Stripe customer **and** wants to use a saved payment method, the credit card id can be passed int the `card.id` field.\nSample payload:\n<pre>{\n  \"plan\": \"v4_monthly\",\n  \"card\": {\n    \"id\": \"tok_fr\"\n  }\n}</pre>\n### 3D Secure 2 process\n3D Secure 2 may be triggered by this request. If this occurs, it means that the customer has to agree to be debited by Stripe.<br> In this case, the `data.status` will be equal to `\"incomplete\"` and the related payment intent secret will be located in the `data.latest_invoice.payment_intent.client_secret` field.<br> To confirm the payment, the Stripe.js [handleCardPayment()](https://stripe.com/docs/stripe-js/reference#stripe-handle-card-payment) has to be used to display the 3D Secure modal.<br> After a successful payment confirmation, the subscription status will be equal to `\"active\"` and the user will have his `premium` field equal to `true`."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - plan
                - card
              properties:
                plan:
                  description: 'The plan.'
                  type: string
                  enum:
                    - v5_monthly
                    - v5_annually
                card:
                  description: 'The user credit card token **OR** id, see above for details.'
                  type: object
                  properties:
                    token:
                      description: 'The payment method token associated with the subscription. It can be retrieved using the Stripe.js `createToken()` function.'
                      externalDocs:
                        description: 'Stripe.js `createToken()`'
                        url: 'https://stripe.com/docs/stripe-js/reference#stripe-create-token'
                      type: string
                      example: tok_fr
      responses:
        200:
          description: 'Subscription was created and is active.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                additionalProperties: false
                properties:
                  success:
                    description: 'The response success.'
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/SubscriptionActive'
        202:
          description: 'Subscription was created but 3D Secure 2 was triggered.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                additionalProperties: false
                properties:
                  success:
                    description: 'The response success.'
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/SubscriptionCreationIncomplete'
        422:
          description: 'Card token has been refused.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    description: 'The error code.'
                    type: string
                    enum:
                      - incorrect_cvc
                      - card_declined
                  message:
                    description: 'The error message.'
                    type: string
                  data:
                    description: 'The error data.'
      tags:
        - Subscriptions
  '/subscriptions/{subscriptionId}/migrate':
    post:
      summary: 'Migrate a Braintree subscription'
      description: "Migrate an old Braintree subscription to a new Stripe subscription. Since the user has paid for the current Braintree billing period, we will not try to debit him until the next billing date.<br> **Note 1:** Currently, only the `v4_monthly` and `v4_annually` are supported.<br> **Note 2:** The old Braintree subscription will be immediately canceled.<br>\n### Using new payment method\nIf the user is not a Stripe customer or want to use a new payment method, Stripe Elements should be used to safely collect the user credit card details. Then, the **tokenized** credit card can be passed in the `card.token` field.\nSample payload:\n<pre>{\n  \"card\": {\n    \"token\": \"tok_fr\"\n  }\n}</pre>\n### Using an existing payment method\nIf the user is already a Stripe customer **and** wants to use a saved payment method, the credit card id can be passed int the `card.id` field.\nSample payload:\n<pre>{\n  \"card\": {\n    \"id\": \"tok_fr\"\n  }\n}</pre>\n### 3D Secure 2 process\n3D Secure 2 may be triggered by this request. If this occurs, it means that the customer has to agree to be debited by Stripe.<br> In this case, the `data.status` will be equal to `\"incomplete\"` and the related setup intent secret will be located in the `data.pending_setup_intent.client_secret` field.<br> To confirm the setup intent, the Stripe.js [handleCardSetup()](https://stripe.com/docs/stripe-js/reference#stripe-handle-card-setup) has to be used to display the 3D Secure modal.<br> After a successful payment confirmation, the subscription status will be equal to `\"active\"` and the user will have his `premium` field equal to `true`."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - card
              properties:
                card:
                  description: 'The user credit card token **OR** id, see above for details.'
                  type: object
                  properties:
                    token:
                      description: 'The payment method token associated with the subscription. It can be retrieved using the Stripe.js `createToken()` function.'
                      externalDocs:
                        description: 'Stripe.js `createToken()`'
                        url: 'https://stripe.com/docs/stripe-js/reference#stripe-create-token'
                      type: string
                      example: tok_fr
      responses:
        200:
          description: 'Subscription was created and is active.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                additionalProperties: false
                properties:
                  success:
                    description: 'The response success.'
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/SubscriptionActive'
        202:
          description: 'Subscription was created but 3D Secure 2 was triggered.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                additionalProperties: false
                properties:
                  success:
                    description: 'The response success.'
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/SubscriptionMigration3DS2'
        422:
          description: 'Card token has been refused.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    description: 'The error code.'
                    type: string
                    enum:
                      - incorrect_cvc
                      - card_declined
                  message:
                    description: 'The error message.'
                    type: string
                  data:
                    description: 'The error data.'
      tags:
        - Subscriptions
  /users:
    get:
      summary: 'Paginate user'
      description: 'Retrieve all user by ascending ids, paginated.'
      parameters:
        -
          name: page
          in: query
          description: 'The page **(starts at 0)**.'
          schema:
            type: integer
          example: '2'
          required: true
          style: form
        -
          name: perPage
          in: query
          description: 'The number of user per page.'
          schema:
            type: integer
          example: 100
          required: true
          style: form
      responses:
        200:
          description: 'The user in a paginator.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - page
                  - per_page
                  - total
                  - data
                properties:
                  page:
                    description: 'The current page.'
                    type: integer
                    example: '2'
                    readOnly: true
                  per_page:
                    description: 'The number of user per page.'
                    type: integer
                    example: 100
                    readOnly: true
                  total:
                    description: 'The total number of user processed.'
                    type: integer
                    example: '710'
                    readOnly: true
                  data:
                    description: 'The user as an array.'
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                    readOnly: true
      security:
        -
          bearer:
            - 'users:read'
      tags:
        - Users
    post:
      summary: Register
      description: 'Create a new user. This action may be used by non-logged user.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  description: 'The user email.'
                  type: string
                  format: email
                  example: john.doe@example.com
                password:
                  description: 'The user password.'
                  type: string
                  format: password
                  example: mysupermagepassword
      responses:
        200:
          description: 'The newly created user.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/User'
      tags:
        - Users
