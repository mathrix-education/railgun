get:
  tags:
    - Comments
  summary: Index comments
  description: Retrive all comments by ascending ids, paginated.
  operationId: commentsIndexPagination
  parameters:
    - name: page
      in: path
      description: The page of comments.
      schema:
        type: int
        default: 1
    - name: perPage
      in: path
      description: The number of comments per page.
      schema:
        type: int
        default: 100
  responses:
    200:
      description: An array of comments.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../index.yaml#/components/schemas/Comment'
