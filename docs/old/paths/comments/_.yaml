post:
  tags:
  - Comments
  operationId: commentsPost
  summary: Add a comment
  description: >-
    A comment in the database. Comment author is determined from the Bearer authentication token.
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../../index.yaml#/components/requestBodies/Comment'
  responses:
    200:
      description: The newly created comment.
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/CommentChild'
