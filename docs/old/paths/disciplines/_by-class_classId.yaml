get:
  tags:
  - Disciplines
  description: Get disciplines link with a given class `id`.
  summary: By class
  operationId: disciplinesByClass
  parameters:
  - name: classId
    in: path
    description: The class id.
    required: true
    schema:
      type: int
      example: 11
  responses:
    200:
      description: The disciplines.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../index.yaml#/components/schemas/DisciplineWithPivot'
