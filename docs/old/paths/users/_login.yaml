post:
  tags:
  - Users
  summary: Login
  description: Login a user by retrieving its `access_token`.
  requestBody:
    application/json:
      schema:
        type: object
        properties:
          grant_type:
            descriptipn: The grant method. Will always be `grant_type`.
          client_id:
            description: The client id.
            type: integer
            example: 1
          client_secret:
            description: The client secret key.
            type: string
            example: ezyfcoemlsjqsdmzepzezk
          username:
            description: The user __email__.
            type: string
            example: john.doe@example.com
          password:
            description: The user password.
            type: string
            example: MyExtreme$Pwd
  responses:
    200:
      $ref: ../../responses/Bearer.yaml
