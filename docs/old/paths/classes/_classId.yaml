get:
  tags:
    - Classes
  summary: Get a class
  operationId: classesGet
  parameters:
    - name: classId
      in: path
      description: The class id.
      required: true
      schema:
        type: int
        example: 22
  responses:
    200:
      description: The requested class.
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/Class'
    404:
      $ref: '../../index.yaml#/components/responses/404_ModelNotFound'
patch:
  tags:
    - Classes
  summary: Edit a class
  operationId: classesPatch
  security:
    - admin: []
  parameters:
    - name: classId
      in: path
      description: The class id.
      required: true
      schema:
        type: int
        example: 15
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../../index.yaml#/components/schemas/Class'
  responses:
    200:
      description: The edited class.
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/Class'
    404:
      $ref: '../../index.yaml#/components/responses/404_ModelNotFound'
    422:
      $ref: '../../index.yaml#/components/responses/422_ModelValidation'
delete:
  tags:
    - Classes
  summary: Delete a class (not implemented)
  operationId: classesDelete
  security:
    - admin: []
  parameters:
    - name: classId
      in: path
      description: The class id.
      required: true
      schema:
        type: int
        example: 15
  responses:
    200:
      description: The deletion result.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                description: If the deletion was sucessful.
                type: boolean
                default: true
              message:
                description: The deletion message.
                type: string
                example: Class id 15 was successfully deleted.
    404:
      $ref: '../../index.yaml#/components/responses/404_ModelNotFound'
