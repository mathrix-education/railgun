patch:
  tags:
    - Notifications
  summary: Mark all notifications as read
  description: Mark all notifications as read.
  operationId: notificationsMarkAllRead
  security:
    - registered: []
  responses:
    200:
      description: An array of notifications.
      content:
        application/json:
          schema:
            type: object
            properties:
              page:
                description: The current page.
                type: integer
                example: 2
              per_page:
                description: The number of notifications per page.
                type: integer
                example: 100
              total:
                description: The total number of notifications matching the request criteria.
                type: integer
                example: 245
              data:
                description: An array of __read__ notifications.
                type: array
                items:
                  $ref: '../../index.yaml#/components/schemas/Notification'
