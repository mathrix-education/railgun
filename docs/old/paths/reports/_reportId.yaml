get:
  tags:
    - Reports
  summary: Get a report
  operationId: reportsGet
  parameters:
    - name: reportId
      in: path
      description: The report id.
      required: true
      schema:
        type: int
        example: 3
  responses:
    200:
      description: The requested report.
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/Report'
    404:
      $ref: '../../index.yaml#/components/responses/404_ModelNotFound'
patch:
  tags:
    - Reports
  summary: Edit an report
  operationId: reportsPatch
  security:
    - moderator: []
  parameters:
    - name: reportId
      in: path
      description: The report id.
      required: true
      schema:
        type: int
        example: 42
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../../index.yaml#/components/requestBodies/Report'
  responses:
    200:
      description: The edited report.
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/Report'
    404:
      $ref: '../../index.yaml#/components/responses/404_ModelNotFound'
    422:
      $ref: '../../index.yaml#/components/responses/422_ModelValidation'
delete:
  tags:
    - Reports
  summary: Delete a report
  operationId: reportsDelete
  security:
    - moderator: []
  parameters:
    - name: reportId
      in: path
      description: The report id.
      required: true
      schema:
        type: int
        example: 42
  responses:
    200:
      description: The deletion result.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                description: If the deletion was sucessful.
                type: boolean
                default: true
              message:
                description: The deletion message.
                type: string
                example: Report id 42 was successfully deleted.
    404:
      $ref: '../../index.yaml#/components/responses/404_ModelNotFound'
