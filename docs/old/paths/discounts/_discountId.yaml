get:
  tags:
    - Discounts
  summary: Get a discount
  operationId: discountsGet
  parameters:
    - name: discountId
      in: path
      description: The discount id.
      required: true
      schema:
        type: int
        example: 8
  responses:
    200:
      description: The requested discount.
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/Discount'
    404:
      $ref: '../../index.yaml#/components/responses/404_ModelNotFound'
patch:
  tags:
    - Discounts
  summary: Edit a discount
  operationId: discountsPatch
  security:
    - admin: []
  parameters:
    - name: discountId
      in: path
      description: The discount id.
      required: true
      schema:
        type: int
        example: 45
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../../index.yaml#/components/schemas/Discount'
  responses:
    200:
      description: The edited discount.
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/Discount'
    404:
      $ref: '../../index.yaml#/components/responses/404_ModelNotFound'
    422:
      $ref: '../../index.yaml#/components/responses/422_ModelValidation'
delete:
  tags:
    - Discounts
  summary: Delete a discount
  operationId: discountsDelete
  security:
    - admin: []
  parameters:
    - name: discountId
      in: path
      description: The discount id.
      required: true
      schema:
        type: int
        example: 45
  responses:
    200:
      description: The deletion result.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                description: If the deletion was sucessful.
                type: boolean
                default: true
              message:
                description: The deletion message.
                type: string
                example: Discount id 45 was successfully deleted.
    404:
      $ref: '../../index.yaml#/components/responses/404_ModelNotFound'
