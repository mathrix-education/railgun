get:
  tags:
    - Discounts
  summary: Get a discount by property
  description: Get the first discount which matches with the couple property, value.
  operationId: discountsGetKey
  parameters:
    - name: key
      in: path
      description: The property used.
      required: true
      schema:
        type: string
        example: code
    - name: value
      in: path
      description: The value of the property.
      required: true
      schema:
        type: int, string
        example: MODEMACHINE2018
  responses:
    200:
      description: The requested discount.
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/Discount'
    404:
      $ref: '../../index.yaml#/components/responses/404_ModelNotFound'
