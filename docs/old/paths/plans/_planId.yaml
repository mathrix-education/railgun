get:
  tags:
    - Braintree Plans
  summary: Get a plan
  operationId: plansGet
  parameters:
    - name: planId
      in: path
      description: The plan id.
      required: true
      schema:
        type: int
        example: 4
  responses:
    200:
      description: The requested plan.
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/Braintree_Plan'
    404:
      $ref: '../../index.yaml#/components/responses/404_ModelNotFound'
