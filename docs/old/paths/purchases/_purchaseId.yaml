get:
  tags:
    - Purchases
  summary: Get a purchase
  operationId: purchasesGet
  parameters:
    - name: purchaseId
      in: path
      description: The purchase id.
      required: true
      schema:
        type: int
        example: 23
  responses:
    200:
      description: The requested purchase.
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/Purchase'
    404:
      $ref: '../../index.yaml#/components/responses/404_ModelNotFound'
patch:
  tags:
    - Purchases
  summary: Edit a purchase
  operationId: purchasesPatch
  security:
    - moderator: []
  parameters:
    - name: purchaseId
      in: path
      description: The purchase id.
      required: true
      schema:
        type: int
        example: 36
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../../index.yaml#/components/requestBodies/Purchase'
  responses:
    200:
      description: The edited purchase.
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/Activity'
    404:
      $ref: '../../index.yaml#/components/responses/404_ModelNotFound'
    422:
      $ref: '../../index.yaml#/components/responses/422_ModelValidation'
delete:
  tags:
    - Purchases
  summary: Delete a purchase
  operationId: purchasesDelete
  security:
    - moderator: []
  parameters:
    - name: purchaseId
      in: path
      description: The purchase id.
      required: true
      schema:
        type: int
        example: 36
  responses:
    200:
      description: The deletion result.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                description: If the deletion was sucessful.
                type: boolean
                default: true
              message:
                description: The deletion message.
                type: string
                example: Purchase id 36 was successfully deleted.
    404:
      $ref: '../../index.yaml#/components/responses/404_ModelNotFound'
