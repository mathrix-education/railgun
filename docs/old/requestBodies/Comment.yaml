description: Comment.
type: object
properties:
  content:
    description: The comment content.
    type: string
    example: lorem ipsum quae dolores.
  parent_id:
    description: The parent comment id if the comment is a response.
    type: integer
    nullable: true
    example: 12
  module_id:
    description: The module id which belongs to the comment.
    type: integer
    example: 1722
  path:
    description: The comment path.
    type: object
    properties:
      country_id:
        description: The country id.
        type: integer
        example: 1
      class_id:
        description: The class id.
        type: integer
        example: 12
      discpline_id:
        description: The discipline id.
        type: integer
        example: 3
      chapter_id:
        description: The chapter id.
        type: integer
        example: 314
      notion_id:
        description: The notion id.
        type: integer
        example: 164
      activity_id:
        description: The activty id.
        type: integer
        example: 1422
      module_id:
        description: The module id.
        type: integer
        example: 1745
required:
  - content
  - parent_id
  - module_id
  - path
