get:
  summary: Paginate chapters by grade/discipline
  parameters:
  - name: gradeId
    in: path
    description: The grade id.
    required: true
    schema:
      type: int
      example: 11
  - name: disciplineId
    in: path
    description: The discipline id.
    required: true
    schema:
      type: int
      example: 14
  - name: scope
    in: path
    description: The scope (used to bypass chapters visibility).
    required: true
    schema:
      type: string
      enum:
      - all
      example: all
  responses:
    200:
      description: The chapters
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../index.yaml#/components/schemas/Chapter'
