get:
  summary: Paginate disciplines by grade
  description: Retrieve all disciplines linked to a given grade id, paginated.
  parameters:
    - name: gradeId
      in: path
      description: The grade id
      schema:
        type: int
      example: 72
      required: true
    - name: page
      in: path
      description: The page (starts at 0).
      schema:
        type: int
      example: 4
      required: true
    - name: perPage
      in: path
      description: The number of models per page.
      schema:
        type: int
      example: 100
      required: true
  responses:
    200:
      description: The disciplines in a paginator.
      content:
        application/json:
          schema:
            type: object
            required: [page, per_page, total, data]
            properties:
              page:
                description: The current page.
                type: integer
                example: 4
                readOnly: true
              per_page:
                description: The number of disciplines per page.
                type: integer
                example: 100
                readOnly: true
              total:
                description: The total number of disciplines processed.
                type: integer
                example: 1845
                readOnly: true
              data:
                description: The disciplines as an array.
                type: array
                items:
                  $ref: '../../index.yaml#/components/schemas/Discipline'
                readOnly: true
