get:
  summary: Paginate activities
  description: Retrive all activities by ascending ids, paginated.
  $extends: ../../fragments/pagination_params.yaml
  responses:
    200:
      description: The activities in a paginator.
      content:
        application/json:
          schema:
            type: object
            required: [page, per_page, total, data]
            properties:
              page:
                description: The current page.
                type: integer
                example: 4
                readOnly: true
              per_page:
                description: The number of activities per page.
                type: integer
                example: 100
                readOnly: true
              total:
                description: The total number of activities processed.
                type: integer
                example: 1845
                readOnly: true
              data:
                description: The activities as an array.
                type: array
                items:
                  $ref: '../../index.yaml#/components/schemas/Activity'
                readOnly: true
