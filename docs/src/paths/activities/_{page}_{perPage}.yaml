get:
  summary: Paginate activities
  description: Retrive all activities by ascending ids, paginated.
  parameters:
  - name: page
    in: path
    description: The page of activities.
    schema:
      type: int
    example: 4
    required: true
  - name: perPage
    in: path
    description: The number of activities per page.
    schema:
      type: int
    example: 100
    required: true
  responses:
    200:
      description: The activities in a paginator.
      content:
        application/json:
          schema:
            type: object
            required: [page, per_page, total, data]
            properties:
              page:
                description: The current page.
                type: integer
                example: 4
                readOnly: true
              per_page:
                description: The number of activties per page.
                type: integer
                example: 100
                readOnly: true
              total:
                description: The total number of activties processed.
                type: integer
                example: 1845
                readOnly: true
              data:
                description: The activities as an array.
                type: array
                items:
                  $ref: '../../spec.yaml#/components/schemas/Activity'
                readOnly: true
