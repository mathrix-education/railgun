get:
  tags:
  - Activities
  summary: Get an activity
  operationId: GET/activities/{activityId}
  parameters:
  - name: activityId
    in: path
    description: The activity id.
    required: true
    schema:
      type: int
      example: 34
  responses:
    200:
      description: The requested activity.
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/Activity'
    404:
      $ref: '../../index.yaml#/components/responses/404_ModelNotFound'
patch:
  tags:
    - Activities
  summary: Edit an activity
  operationId: PATCH/activities/{activityId}
  security:
    - moderator: []
  parameters:
    - name: activityId
      in: path
      description: The activity id.
      required: true
      schema:
        type: int
        example: 45
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../../index.yaml#/components/schemas/Activity'
  responses:
    200:
      description: The edited activity.
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/Activity'
    404:
      $ref: '../../index.yaml#/components/responses/404_ModelNotFound'
    422:
      $ref: '../../index.yaml#/components/responses/422_ModelValidation'
delete:
  tags:
    - Activities
  summary: Delete an activity
  operationId: DELETE/activities/{activityId}
  security:
    - moderator: []
  parameters:
    - name: activityId
      in: path
      description: The activity id.
      required: true
      schema:
        type: int
        example: 45
  responses:
    200:
      description: The deletion result.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                description: If the deletion was sucessful.
                type: boolean
                default: true
              message:
                description: The deletion message.
                type: string
                example: Activity id 45 was successfully deleted.
    404:
      $ref: '../../index.yaml#/components/responses/404_ModelNotFound'
