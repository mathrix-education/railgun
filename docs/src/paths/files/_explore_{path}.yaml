get:
  summary: Explore
  description: Display the content of a directory on the CDN.
  security:
  - bearer: [moderator]
  parameters:
  - name: directory
    in: path
    description: The directory path on the CDN.
    required: true
    schema:
      type: string
      example: test
  responses:
    200:
      description: Array of file and directory metadata.
      content:
        application/json:
          schema:
            type: array
            items:
              anyOf:
                - $ref: '../../index.yaml#/components/schemas/Directory'
                - $ref: '../../index.yaml#/components/schemas/File'
    404:
      $ref: '../../index.yaml#/components/responses/404_FileNotFound'
