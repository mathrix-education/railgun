get:
  $extends: ../../fragments/pagination_params.yaml
  summary: Paginate categories
  responses:
    200:
      description: The categories in a paginator.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../schemas/Paginator.yaml
              - properties:
                  data:
                    type: array
                    items:
                      $ref: ../../schemas/Category.yaml
