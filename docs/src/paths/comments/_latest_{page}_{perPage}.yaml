get:
  summary: Paginate latest
  description: Retrive all comments by ascending ids, paginated.
  parameters:
    - name: page
      in: path
      description: The page of comments.
      schema:
        type: int
        default: 1
    - name: perPage
      in: path
      description: The number of comments per page.
      schema:
        type: int
        default: 100
  responses:
    200:
      description: The comments in a paginator.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../schemas/Paginator.yaml
              - properties:
                  data:
                    type: array
                    items:
                      $ref: '../../index.yaml#/components/schemas/Comment'
