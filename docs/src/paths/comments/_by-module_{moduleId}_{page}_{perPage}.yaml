get:
  summary: Paginate comments by module
  description: Retrive all comments linked to a given module, ordered by creation date.
  parameters:
    - name: moduleId
      in: path
      description: The module id.
      schema:
        type: int
        example: 17
      required: true
    - name: page
      in: path
      description: The page of comments.
      schema:
        type: int
        default: 1
      required: true
    - name: perPage
      in: path
      description: The number of comments per page.
      schema:
        type: int
        default: 100
      required: true
  responses:
    200:
      description: The comments in a paginator.
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../schemas/Paginator.yaml
              - properties:
                  data:
                    type: array
                    items:
                      $ref: '../../index.yaml#/components/schemas/Comment'
