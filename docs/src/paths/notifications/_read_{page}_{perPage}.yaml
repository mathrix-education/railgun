get:
  $extends: ../../fragments/pagination_params.yaml
  summary: Read notifications
  description: Retrieve read notifications by descending creation date, paginated.
  security:
    - bearer: [registered]
  responses:
    200:
      description: The notifications in a paginator.
      content:
        application/json:
          schema:
            schema:
              allOf:
                - $ref: ../../schemas/Paginator.yaml
                - properties:
                    data:
                      type: array
                      items:
                        $ref: '../../index.yaml#/components/schemas/Notification'
