description: Notion
type: object
additionalProperties: false
properties:
  id:
    description: The notion id.
    type: integer
    example: 14
  name:
    description: The notion name.
    type: string
    example: My super nice notion
  slug:
    description: The notion slug.
    type: string
    example: my-super-nice-notion
  type:
    description: The notion type.
    type: string
    enum:
    - normal
    - premium
    - reminder
    - further
  visible:
    description: The notion visibility.
    type: boolean
  order:
    description: The notion order.
    type: integer
    example: 2
  chapter_id:
    description: The notion linked chapter id.
    type: integer
    example: 39
  created_at:
    description: The activity creation date-time.
    type: string
    format: date-time
    nullable: true
    readOnly: true
  updated_at:
    description: The activity last update date-time.
    type: string
    format: date-time
    nullable: true
    readOnly: true
