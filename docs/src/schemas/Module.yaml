description: Module
type: object
additionalProperties: false
properties:
  id:
    description: The module id.
    type: integer
    example: 14
  type:
    description: The module type.
    type: string
    enum:
      - id
      - course
      - test
      - mcq
      - mcq-table
      - match
      - fill
      - flashcard
  content:
    description: The module content.
    type: string
    example: Epic module content
  questions:
    description: The module questions.
    type: array
    items:
      type: string
  choices:
    description: The module choices.
    type: array
    items:
      type: string
  corrections:
    description: The module questions.
    type: array
    items:
      type: integer
  solutions:
    description: The module solutions.
    type: array
    items:
      type: any
  options:
    description: The module options.
    type: any
  visible:
    description: The module visibility.
    type: boolean
  status:
    description: The module status __per user__.
    type: string
    enum:
      - view
      - to_revise
      - completed
