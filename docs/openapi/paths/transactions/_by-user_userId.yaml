get:
  tags:
  - subscriptions
  summary: Get transactions associated with an user
  operationId: transactionsByUser
  parameters:
  - name: userId
    in: path
    description: The user id
    required: true
    schema:
      type: int
      example: 12
  responses:
    200:
      description: The user Braintree transactions
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../index.yaml#/components/schemas/Braintree_Transaction'
