post:
  tags:
  - transactions
  summary: Refund a transaction
  operationId: transactionRefund
  parameters:
  - name: transactionId
    in: path
    description: The transaction id
    required: true
    schema:
      type: integer
      format: string
      example: 024df54z
  responses:
    200:
      description: The Braintree transaction
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/Braintree_Transaction'
