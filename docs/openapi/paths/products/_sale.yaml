post:
  tags:
  - Products
  summary: Sale products
  operationId: productsSale
  requestBody:
    content:
      application/json:
        schema:
          description: Cart
          type: object
          properties:
            cart:
              description: An array of product ids.
              type: array
              items:
                description: A product id
                type: integer
              example: [14, 15, 16]
            user_id:
              description: The customer user id.
              type: integer
              example: 17
            discount:
              description: A discount code.
              type: string
              example: MODEMACHINE2018
          required:
          - cart
          - user_id
  responses:
    200:
      description: The cart Braintree transaction.
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/Braintree_Transaction'
