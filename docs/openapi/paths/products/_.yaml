get:
  tags:
  - Products
  summary: Get all products
  operationId: productsIndex
  responses:
    200:
      description: Array of products
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../index.yaml#/components/schemas/Product'
post:
  tags:
  - Products
  summary: Create a new product
  operationId: productsPost
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../../index.yaml#/components/requestBodies/Product'
  responses:
    200:
      description: The newly created product
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/Product'
