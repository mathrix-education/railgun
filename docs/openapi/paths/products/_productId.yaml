get:
  tags:
  - Products
  summary: Get a product
  operationId: productsGet
  parameters:
  - name: productId
    in: path
    description: The product id.
    required: true
    schema:
      type: int
      example: 34
  responses:
    200:
      description: The product.
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/Product'
patch:
  tags:
  - Products
  summary: Edit a product
  operationId: productsPatch
  parameters:
  - name: productId
    in: path
    description: The product id
    required: true
    schema:
      type: int
      example: 34
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../../index.yaml#/components/requestBodies/Product'
  responses:
    200:
      description: The edited product
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/Product'
delete:
  tags:
  - Products
  summary: Delete a product
  operationId: productsDelete
  parameters:
  - name: productId
    in: path
    description: The product id
    required: true
    schema:
      type: int
      example: 45
  responses:
    200:
      description: The deletion result
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                description: If the deletion was sucessful.
                type: boolean
                default: true
              message:
                description: The deletetion message.
                type: string
                example: Product id 45 was successfully deleted.
