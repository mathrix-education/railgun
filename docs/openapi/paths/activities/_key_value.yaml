get:
  tags:
    - Activities
  summary: Get an activiy by property
  descritpion: Get the first activiy which matches with the couple property, value.
  operationId: activitiesGetKey
  parameters:
    - name: key
      in: path
      description: The property used.
      required: true
      schema:
        type: string
        example: slug
    - name: value
      in: path
      description: The value of the property.
      schema:
        type: [int, boolean, string]
        example: lorem-ipsum
  responses:
    200:
      description: The requested activity.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../index.yaml#/components/schemas/Activity'
    404:
      $ref: '../../index.yaml#/components/responses/404_ModelNotFound'
