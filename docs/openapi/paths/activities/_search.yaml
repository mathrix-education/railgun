post:
  tags:
  - Activities
  summary: Search activities
  operationId: activitiesSearch
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../../index.yaml#/components/requestBodies/Search'
  responses:
    200:
      description: Search results
      content:
        application/json:
          schema:
            type: object
            properties:
              perPage:
                description: The total activities per page
                type: integer
                example: 100
              page:
                description: The page number
                type: integer
                example: 1
              count:
                description: The total activities found
                type: integer
                example: 53
              data:
                type: array
                items:
                  $ref: '../../index.yaml#/components/schemas/Activity'

