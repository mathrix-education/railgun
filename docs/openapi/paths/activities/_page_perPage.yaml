get:
  tags:
  - Activities
  summary: Index activities
  description: Retrive all activities by ascending ids, paginated.
  operationId: activitiesIndexPagination
  parameters:
  - name: page
    in: path
    description: The page of activities.
    schema:
      type: int
      default: 1
  - name: perPage
    in: path
    description: The number of activities per page.
    schema:
      type: int
      default: 100
  responses:
    200:
      description: An array of activities.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../index.yaml#/components/schemas/Activity'
