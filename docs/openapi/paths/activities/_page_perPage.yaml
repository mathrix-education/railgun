get:
  tags:
  - Activities
  summary: Get all activities (pagination)
  operationId: activitiesIndexPagination
  parameters:
  - name: page
    in: path
    description: The page of activities
    required: true
    schema:
      type: int
      default: 1
  - name: perPage
    in: path
    description: The number of activities per page
    required: true
    schema:
      type: int
      default: 100
  responses:
    200:
      description: An array of activities.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../index.yaml#/components/schemas/Activity'
