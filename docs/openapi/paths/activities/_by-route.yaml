get:
  tags:
  - Activities
  summary: Get an activity by route for SEO index
  operationId: activitiesByRoute
  security:
  - moderator: []
  parameters:
    - name: countryId
      in: path
      description: The country id.
      required: true
      schema:
        type: int
        example: 2
    - name: classId
      in: path
      description: The class id.
      required: true
      schema:
        type: int
        example: 12
    - name: disciplineId
      in: path
      description: The discipline id.
      required: true
      schema:
        type: int
        example: 24
    - name: chapterId
      in: path
      description: The chapter id.
      required: true
      schema:
        type: int
        example: 182
    - name: notionId
      in: path
      description: The activity id.
      required: true
      schema:
        type: int
        example: 164
  responses:
    200:
      description: The activities with __seo_index__.
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/ActivityWithSeoIndex'
