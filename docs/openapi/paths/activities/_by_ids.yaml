get:
  tags:
  - Activities
  summary: Get models ids by relation
  description: Get the models ids which satisfy a given relation.
  operationId: activitiesIds
  parameters:
  - name: what
    in: path
    description: The name of the linked model.
    required: true
    schema:
      type: string
      example: lorem-ipsum
  - name: id
    in: path
    description: The id of the linked model.
    required: true
    schema:
      type: int
      example: 5
  - name: page
    description: The query page.
    schema:
      type: int
      default: 1
  - name: perPage
    description: The number of query per page.
    schema:
      type: int
      default: 100
  responses:
    200:
      description: An array of models.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../index.yaml#/components/schemas/Class'
    404:
      $ref: '../../index.yaml#/components/responses/404_ModelNotFound'
