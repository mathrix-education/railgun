post:
  tags:
    - Settings
  summary: Write a setting
  operationId: settingsPost
  security:
    - admin: []
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../../index.yaml#/components/requestBodies/Setting'
  responses:
    200:
      description: The newly created setting.
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/Setting'
    422:
      $ref: '../../index.yaml#/components/responses/422_ModelValidation'
get:
  tags:
    - Settings
  summary: Get all settings
  operationId: settingsGet
  responses:
    200:
      description: The settings.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../index.yaml#/components/schemas/Setting'
