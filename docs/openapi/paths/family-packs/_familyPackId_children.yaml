post:
  tags:
  - Family Packs
  operationId: familyPackChildrenAdd
  summary: Add child
  description: Add a child to a family pack
  parameters:
  - name: familyPackId
    in: path
    description: The family pack id.
    required: true
    schema:
      type: int
      example: 34
  requestBody:
    content:
      application/json:
        schema:
          email:
            description: The child email
            type: string
            example: child@example.com
  responses:
    200:
      description: The family pack.
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/FamilyPack'
delete:
  tags:
  - Family Packs
  operationId: familyPackChildrenRemove
  summary: Remove child
  description: emove a child from a family pack
  parameters:
  - name: familyPackId
    in: path
    description: The family pack id.
    required: true
    schema:
      type: int
      example: 34
  requestBody:
    content:
      application/json:
        schema:
          email:
            description: The child email
            type: string
            example: child@example.com
  responses:
    200:
      description: The family pack.
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/FamilyPack'
