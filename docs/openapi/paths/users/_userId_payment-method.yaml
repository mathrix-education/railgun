patch:
  tags:
  - Users
  summary: Update payment method
  description: >-
    Update user's Braintree payment method using a payment method nonce. Any old Stripe subscriptions will be
    canceled then migrated to Braintree.
  operationId: usersUpdatePaymentMethod
  security:
  - registered: []
  parameters:
  - name: userId
    in: path
    description: The user id
    required: true
    schema:
      type: integer
      example: 94
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            paymentMethodNonce:
              description: The new Braintree payment method nonce.
              type: string
              example: ds52zaq
  responses:
    200:
      description: The updated user.
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/User'
    400:
      description: Invalid request (Braintree Error).
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: invalid_request
              message:
                description: >-
                  The error message. For all Braintree Validation Errors, see the [official documentation](https://developers.braintreepayments.com/reference/general/validation-errors/all/php).
                type: string
                example: Braintree Error
              errors:
                description: The validation errors
                type: object
                properties:
                  field:
                    type: string
                    example: value is not...

