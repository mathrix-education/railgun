get:
  tags:
    - Users
  summary: Get a user by property
  description: Get the first user which matches with the couple property, value.
  operationId: usersGetKey
  parameters:
    - name: key
      in: path
      description: The property used.
      required: true
      schema:
        type: string
        example: lastname
    - name: value
      in: path
      description: The value of the property.
      required: true
      schema:
        type: int, boolean, string, object
        example: Doe
  responses:
    200:
      description: The requested user.
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/User'
    404:
      $ref: '../../index.yaml#/components/responses/404_ModelNotFound'
