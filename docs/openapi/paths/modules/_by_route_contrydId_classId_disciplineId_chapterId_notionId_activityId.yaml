post:
  tags:
  - Modules
  summary: By route
  operationId: modulesByRoutes
  description: Get the modules in an activty with the `seo_index` field.
  parameters:
  - name: countryId
    in: path
    description: The country id.
    required: true
    schema:
      type: int
      example: 1
  - name: classId
    in: path
    description: The class id.
    required: true
    schema:
      type: int
      example: 12
  - name: disciplineId
    in: path
    description: The discipline id.
    required: true
    schema:
      type: int
      example: 1
  - name: chapterId
    in: path
    description: The chapter id.
    required: true
    schema:
      type: int
      example: 153
  - name: notionId
    in: path
    description: The notion id.
    required: true
    schema:
      type: int
      example: 1423
  - name: activityId
    in: path
    description: The activty id.
    required: true
    schema:
      type: int
      example: 17513
  responses:
    200:
      description: The modules with the `seo_index` field.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../index.yaml#/components/schemas/ModuleWithSeoIndex'

