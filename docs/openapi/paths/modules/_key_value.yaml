get:
  tags:
    - Modules
  summary: Get a module by property
  description: Get the first module which matches with the couple property, value.
  operationId: modulesGetKey
  parameters:
    - name: key
      in: path
      description: The property used.
      required: true
      schema:
        type: string
        example: content
    - name: value
      in: path
      description: The value of the property.
      required: true
      schema:
        type: int, string, array, any
        example: Epic module content
  responses:
    200:
      description: The requested module.
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/Module'
    404:
      $ref: '../../index.yaml#/components/responses/404_ModelNotFound'
