get:
  tags:
  - Modules
  description: Get module front-end routes.
  summary: Routes
  operationId: modulesRoutes
  parameters:
  - name: moduleId
    in: path
    description: The module id.
    required: true
    schema:
      type: int
      example: 1655
  responses:
    200:
      description: The module front-end routes.
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                url:
                  description: The module front-end URL.
                  type: string
                  example: /fr/5eme/maths/calcul-litteral/interrogations/factoriser-avec-le-facteur-commun/interro/1655
                no_index:
                  description: The module `no-index` value
                  type: boolean

