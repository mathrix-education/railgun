post:
  tags:
  - subscriptions
  summary: Cancel a subscription
  operationId: subscriptionCancel
  parameters:
  - name: subscriptionId
    in: path
    description: The subscription id
    required: true
    schema:
      type: string
      example: sub_acff87bba51130f5b995b41fb8b4ce74
  responses:
    200:
      description: The Braintree subscription
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/Braintree_Subscription'
