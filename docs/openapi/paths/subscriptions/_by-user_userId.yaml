get:
  tags:
  - Braintree Subscriptions
  summary: Get subcriptions associated with an user
  operationId: subscriptionsByUser
  parameters:
  - name: userId
    in: path
    description: The user id
    required: true
    schema:
      type: int
      example: 12
  responses:
    200:
      description: The user Braintree subscriptions
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../index.yaml#/components/schemas/Braintree_Subscription'
