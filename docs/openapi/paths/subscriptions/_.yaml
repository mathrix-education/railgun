post:
  tags:
  - Braintree Subscriptions
  summary: Subscribe user to plan
  operationId: subscriptionsAdd
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            planId:
              type: string
              enum:
              - v4_monthly
              - v4_annually
              - v4_biannually
            paymentMethodNonce:
              type: string
              description: The payment method method nonce from the Braintree Client SDK
              example: 7acb98s
            children_count:
              description: The user family emails. `2` is for two additionnal child account.
              type: integer
              example: 2
          required:
          - planId
  responses:
    200:
      description: The new Braintree subscription
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/Braintree_Subscription'
    400:
      description: Invalid request.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: invalid_request
              message:
                description: >-
                  The error message. For all Braintree Validation Errors, see the [official documentation](https://developers.braintreepayments.com/reference/general/validation-errors/all/php).
                type: string
                enum:
                - User is already premium
                - Braintree Error
              errors:
                description: The validation errors
                type: object
                properties:
                  field:
                    type: string
                    example: value is not...
    422:
      $ref: '../../index.yaml#/components/responses/422_Validation'


