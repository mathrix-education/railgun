get:
  tags:
    - Countries
  summary: Get a country
  operationId: countriesGet
  parameters:
    - name: countryId
      in: path
      description: The country id.
      required: true
      schema:
        type: int
        example: 17
  responses:
    200:
      description: The requested country.
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/Country'
    404:
      $ref: '../../index.yaml#/components/responses/404_ModelNotFound'
patch:
  tags:
    - Countries
  summary: Edit a country
  operationId: countriesPatch
  parameters:
    - name: countryId
      in: path
      description: The country id.
      required: true
      schema:
        type: int
        example: 13
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../../index.yaml#/components/requestBodies/Country'
  responses:
    200:
      description: The patched country.
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/Class'
delete:
  tags:
    - Countries
  summary: Delete a country (not implemented)
  operationId: countriesDelete
  parameters:
    - name: countryId
      in: path
      description: The country id.
      required: true
      schema:
        type: int
        example: 13
  responses:
    200:
      description: The deletion result.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                description: If the deletion was sucessful.
                type: boolean
                default: true
              message:
                description: The deletion message.
                type: string
                example: Country id 13 was successfully deleted.
