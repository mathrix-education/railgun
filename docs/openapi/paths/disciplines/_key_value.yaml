get:
  tags:
    - Disciplines
  summary: Get a discipline by property
  description: Get the first discipline which matches with the couple property, value.
  operationId: disciplinesGetKey
  parameters:
    - name: key
      in: path
      description: The property used.
      required: true
      schema:
        type: string
        example: slug
    - name: value
      in: path
      description: The value of the property.
      required: true
      schema:
        type: int, string, boolean
        example: maths
  responses:
    200:
      description: The requested discipline.
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/Discipline'
    404:
      $ref: '../../index.yaml#/components/responses/404_ModelNotFound'
