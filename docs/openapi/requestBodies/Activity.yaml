description: Activity
type: object
properties:
  name:
    description: The activity name.
    type: string
    example: lorem ipsum
  slug:
    description: The activity slug.
    type: string
    example: lorem-ipsum
  name_seo:
    description: ___Deprecated___. The activity name_seo.
    type: string
    example: lorem_ipsum
  type:
    description: The activity type.
    type: string
    enum:
    - video
    - course
    - test
    - exercise
    - summary
    - flashcard
  visible:
    description: The activity visibility.
    type: boolean
    example: true




