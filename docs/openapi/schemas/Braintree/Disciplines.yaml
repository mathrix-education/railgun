description: Disciplines
type: object
properties:
  id:
    description: The discipline id.
    type: integer
    example: 33
  name:
    description: The discipline name.
    type: string
    example: France
  slug:
    description: The discipline slug.
    type: string
    example: france
  beta:
    description: The discipline beta state.
    type: boolean
    example: true
  visible:
    description: The discipline visibility.
    type: boolean
    example: true
