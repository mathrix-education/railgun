description: Family Pack
type: object
properties:
  id:
    description: The family pack id.
    type: integer
    example: 22
  children_count:
    description: The family pack children count. `2` is for two children + the parent account.
    type: integer
    example: 2
  parent_id:
    description: The family pack parent id.
    type: integer
    example: 14
  created_at:
    description: The date/time when the object was created.
    type: string
    format: date-time
  updated_at:
    description: The date/time when the object was updated.
    type: string
    format: date-time
  parent:
    $ref: '../index.yaml#/components/schemas/User'
  children:
    description: The family pack children.
    type: array
    items:
      $ref: '../index.yaml#/components/schemas/User'

