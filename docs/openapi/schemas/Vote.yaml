description: Vote
type: object
properties:
  id:
    description: The vote id.
    type: integer
    example: 14
  value:
    description: The vote value (+1 for thumb up, -1 for thumb down).
    type: integer
  user_id:
    description: The user id who belongs to the vote.
    type: integer
  votable_id:
    description: The model id which belongs to the vote.
    type: integer
  votable_type:
    description: The model type which belongs to the vote.
    type: string
    enum:
      - comment
      - post
  created_at:
    description: The date/time when the object was created.
    type: string
    format: date-time
  updated_at:
    description: The date/time when the object was updated.
    type: string
    format: date-time

