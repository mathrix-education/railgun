description: Chapter
type: object
properties:
  id:
    description: The chapter id.
    type: integer
    example: 22
  name:
    description: The chapter name.
    type: string
    example: lorem ipsum
  slug:
    description: The chapter slug.
    type: string
    example: lorem-ipsum
  order:
    description: The chapter order.
    type: integer
    example: 2
  visible:
    description: The chapter visibility.
    type: boolean
    example: true
  activity_count:
    description: The chapter activities count.
    type: integer
    example: 10
  activity_to_revise:
    description: The chapter activities `to_revise` count. `null` for not-logged users.
    type: integer
    nullable: true
    example: 7
  activity_completed:
    description: The chapter activities `completed` count. `null` for not-logged users.
    type: integer
    nullable: true
    example: 2
