description: Notification.
type: object
properties:
  id:
    description: The notification id.
    type: string
    format: uuid
    example: 22
  type:
    description: The notification type.
    type: string
    enum:
      - comment_answer
  notifiable_type:
    description: The notification notifiable model type. Will always be `user`.
    type: string
    example: user
  notifiable_id:
    description: The notification notifiable model id. Will always be thse user id.
    type: integer
    example: 2254
  data:
    description: >-
      The notification data. May vary, depending on the notification's `type`. The currently defined payloads are
      the following :

      - `comment_answer`: a standard Comment payload, including the comment author (`user`) and its `path`.
    type: object
  read_at:
    description: The date/time when the notification was read. `null` means that the notification is not read.
    type: string
    nullable: true
    format: date-time
  created_at:
    description: The date/time when the notification was created.
    type: string
    format: date-time
  updated_at:
    description: The date/time when the notification was updated.
    type: string
    format: date-time

