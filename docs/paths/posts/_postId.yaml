get:
  tags:
    - Posts
  summary: Get a post
  operationId: postsGet
  parameters:
    - name: postId
      in: path
      description: The post id.
      required: true
      schema:
        type: int
        example: 19
  responses:
    200:
      description: The requested post.
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/Post'
    404:
      $ref: '../../index.yaml#/components/responses/404_ModelNotFound'
patch:
  tags:
    - Posts
  summary: Edit a post
  operationId: postsPatch
  security:
    - admin: []
  parameters:
    - name: postId
      in: path
      description: The post id.
      required: true
      schema:
        type: int
        example: 2
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../../index.yaml#/components/requestBodies/Post'
  responses:
    200:
      description: The edited post.
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/Post'
    404:
      $ref: '../../index.yaml#/components/responses/404_ModelNotFound'
    422:
      $ref: '../../index.yaml#/components/responses/422_ModelValidation'
delete:
  tags:
    - Posts
  summary: Delete a post
  operationId: postsDelete
  security:
    - admin: []
  parameters:
    - name: postId
      in: path
      description: The post id.
      required: true
      schema:
        type: int
        example: 2
  responses:
    200:
      description: The deletion result.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                description: If the deletion was sucessful.
                type: boolean
                default: true
              message:
                description: The deletion message.
                type: string
                example: Post id 2 was successfully deleted.
    404:
      $ref: '../../index.yaml#/components/responses/404_ModelNotFound'
