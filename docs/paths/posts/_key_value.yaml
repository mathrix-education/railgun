get:
  tags:
    - Posts
  summary: Get a post by property
  description: Get the first post which matches with the couple property, value.
  operationId: postsGetKey
  parameters:
    - name: key
      in: path
      description: The property used.
      required: true
      schema:
        type: string
        example: title
    - name: value
      in: path
      description: The value of the property.
      required: true
      schema:
        type: int, string
        example: My super nice post
  responses:
    200:
      description: The requested post.
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/Post'
    404:
      $ref: '../../index.yaml#/components/responses/404_ModelNotFound'
