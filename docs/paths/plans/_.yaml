get:
  summary: Get all plans
  responses:
    200:
      description: The plans.
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            additionalProperties: false
            properties:
              success:
                description: The response success.
                type: boolean
                enum: [true]
              data:
                description: The response data.
                type: array
                items:
                  $ref: '#/components/schemas/Plan'
