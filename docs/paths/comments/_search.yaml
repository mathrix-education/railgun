post:
  tags:
    - Comments
  summary: Search comments
  description: Search comments by query and relations.
  operationId: commentsSearch
  requestBody:
    content:
      application/json:
        schema:
          $ref: '../../index.yaml#/components/requestBodies/Search'
  responses:
    200:
      description: The comments search results.
      content:
        application/json:
          schema:
            type: object
            properties:
              perPage:
                description: The total comments per page.
                type: integer
                example: 100
              page:
                description: The page number.
                type: integer
                example: 1
              count:
                description: The total comments found.
                type: integer
                example: 53
              data:
                type: array
                items:
                  $ref: '../../index.yaml#/components/schemas/Comment'

