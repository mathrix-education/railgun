get:
  tags:
  - Files
  summary: Explore
  operationId: filesExplore
  description: Display the content of a directory on the CDN.
  security:
  - moderator: []
  parameters:
  - name: directory
    in: path
    description: The directory path on the CDN.
    required: true
    schema:
      type: string
      example: test
  responses:
    200:
      description: The directory content.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../index.yaml#/components/schemas/File'
    404:
      $ref: '../../index.yaml#/components/responses/404_FileNotFound'
