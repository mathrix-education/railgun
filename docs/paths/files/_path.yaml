get:
  tags:
  - Files
  summary: Info
  operationId: filesInfo
  description: Display the metadata of a file on the CDN.
  security:
  - moderator: []
  parameters:
  - name: path
    in: path
    description: The file path on the CDN.
    required: true
    schema:
      type: string
      example: test/foo.jpg
  responses:
    200:
      description: The uploaded file metadata
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/File'
    404:
      $ref: '../../index.yaml#/components/responses/404_FileNotFound'
patch:
  tags:
  - Files
  summary: Rename/Move
  operationId: filesRename
  description: Rename or move a file on the CDN.
  security:
  - moderator: []
  - admin: []
  parameters:
  - name: path
    in: path
    description: The file path on the CDN.
    required: true
    schema:
      type: string
      example: test/foo.jpg
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            destination:
              description: >-
                The file destination folder on the CDN. Cannot starts with `trash`, see
                [Files API Delete](#operation/filesDelete) instead.
              type: string
              example: test/foo2.jpg
            force:
              description: Force override if destination file already exist (`admin` only).
              type: boolean
              example: false
  responses:
    200:
      description: The renamed file metadata
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/File'
    404:
      $ref: '../../index.yaml#/components/responses/404_FileNotFound'
delete:
  tags:
  - Files
  summary: Delete
  operationId: filesDelete
  description: Delete a file on the CDN by puting in on the directory `trash`.
  security:
  - moderator: []
  - admin: []
  parameters:
  - name: path
    in: path
    description: The file path on the CDN.
    required: true
    schema:
      type: string
      example: test/foo.jpg
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            force:
              description: Force delete instead of puting the file in the trash (`admin` only).
              type: boolean
              example: false
  responses:
    200:
      description: The trashed file metadata
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/File'
    404:
      $ref: '../../index.yaml#/components/responses/404_FileNotFound'
