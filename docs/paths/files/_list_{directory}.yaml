get:
  summary: List files
  description: >-
    Display the content of a **directory** on the CDN.<br>
    Note: on Google Cloud Storage, an empty directory is automatically deleted.
  security:
    - bearer: [files:read]
  parameters:
    - name: directory
      in: path
      description: The directory path on the CDN.
      schema:
        type: string
        example: tests
  responses:
    200:
      description: The directory content.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                description: If the request succeeded.
                type: boolean
                enum: [true]
              data:
                description: The directory content (directories then files).
                type: array
                items:
                  oneOf:
                    - $ref: '#/components/schemas/Directory'
                    - $ref: '#/components/schemas/File'
    404:
      description: Directory does not exist.
      content:
        application/json:
          schema:
            type: object
            required: [error, message]
            properties:
              error:
                description: The error.
                type: string
                enum: [directory_not_found]
              message:
                description: The error description.
                type: string
                example: The directory idontexist does not exists.
              data:
                description: The error data.
                type: object
                properties:
                  directory:
                    description: The requested directory.
                    type: string
                    example: idontexist
