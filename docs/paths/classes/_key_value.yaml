get:
  tags:
    - Classes
  summary: Get a class by property
  description: Get the first class which matches with the couple property, value.
  operationId: classesGetKey
  parameters:
    - name: key
      in: path
      description: The property used.
      required: true
      schema:
        type: string
        example: slug
    - name: value
      in: path
      description: The value of the property.
      required: true
      schema:
        type: int, string
        example: terminale-s
  responses:
    200:
      description: The requested class.
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/Class'
    404:
      $ref: '../../index.yaml#/components/responses/404_ModelNotFound'
