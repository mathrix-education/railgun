get:
  summary: Get user products
  description: Get the user owned products. Sub-products (i.e. child of bought products) will not be included.
  security:
    - bearer: [logged]
  parameters:
    - name: userId
      in: path
      description: The targeted user id.
      required: true
      schema:
        type: integer
        example: 1585
  responses:
    200:
      description: The user products.
      content:
        application/json:
          schema:
            $extends:
              ../../fragments/responses/200_Pagination.yaml:
                model: product
