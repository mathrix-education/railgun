get:
  summary: Get user purchases
  description: Get the user purchases.
  security:
    - bearer: [logged]
  parameters:
    - name: userId
      in: path
      description: The targeted user id.
      required: true
      schema:
        type: integer
        example: 1585
  responses:
    200:
      description: The user purchases.
      content:
        application/json:
          schema:
            $extends:
              ../../fragments/responses/200_Pagination.yaml:
                model: purchase
