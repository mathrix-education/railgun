$extends:
  ../../fragments/paths/index.yaml:
    model: user
get:
  summary: Search users
  params:
    - name: query
      in: path
      description: The search query.
      required: true
      schema:
        type: string
        example: lorem
    - name: page
      in: query
      description: The page **(starts at 0)**.
      schema:
        type: integer
      example: 1
      required: true
      style: form
    - name: perPage
      in: query
      description: The number of users per page.
      schema:
        type: integer
      example: 100
      required: true
      style: form
    - name: order
      in: query
      description: The column reference for ordering.
      schema:
        type: string
      example: 'username'
      style: form
    - name: dir
      in: query
      description: The order direction.
      schema:
        type: string
        enum: [asc, desc]
      example: asc
      style: form
  security:
    - bearer: [users:read]
