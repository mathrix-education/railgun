get:
  summary: 'Get user grade'
  parameters:
    - name: 'userId'
      in: path
      description: 'The user id.'
      required: true
      schema:
        type: integer
        example: 1452
  responses:
    200:
      description: 'The requested user grade.'
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                description: If the request succeeded.
                type: boolean
                enum: [true]
              data:
                $ref: '#/components/schemas/Grade'
    404:
      $ref: '#/components/responses/404_ModelNotFound'
