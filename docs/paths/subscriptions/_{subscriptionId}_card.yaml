patch:
  summary: Update subscription card
  description: >-
    ### If the subscription managed by Braintree

    Migrate an old Braintree subscription to a new Stripe subscription. Since the user has paid for the current
    Braintree billing period, we will not try to debit him until the next billing date.<br>
    **Note 1:** Currently, only the `v4_monthly` and `v4_annually` are supported.<br>
    **Note 2:** The old Braintree subscription will be immediately canceled.<br>


    ### Using new payment method

    If the user is not a Stripe customer or want to use a new payment method, Stripe Elements should be used to safely
    collect the user credit card details.
    Then, the **tokenized** credit card can be passed in the `card.token` field.

    Sample payload:

    <pre>{
      "card": {
        "token": "tok_fr"
      }
    }</pre>


    ### Using an existing payment method

    If the user is already a Stripe customer **and** wants to use a saved payment method, the credit card id can be
    passed int the `card.id` field.

    Sample payload:

    <pre>{
      "card": {
        "id": "tok_fr"
      }
    }</pre>


    ### 3D Secure 2 process

    3D Secure 2 may be triggered by this request. If this occurs, it means that the customer has to agree to be debited
    by Stripe.<br>
    In this case, the `data.pending_setup_intent` will not `null` and the related setup intent secret will be located
    in the `data.pending_setup_intent.client_secret` field.<br>
    To confirm the setup intent, the Stripe.js
    [handleCardSetup()](https://stripe.com/docs/stripe-js/reference#stripe-handle-card-setup) has to be used to
    display the 3D Secure modal.<br>
    After a successful payment confirmation, the subscription status will be equal to `"active"` and the user will have
    his `premium` field equal to `true`.
  requestBody:
    content:
      application/json:
        schema:
          type: object
          required: [card]
          properties:
            card:
              description: The user credit card token **OR** id, see above for details.
              type: object
              properties:
                token:
                  description: >-
                    The payment method token associated with the subscription. It can
                    be retrieved using the Stripe.js `createToken()` function.
                  externalDocs:
                    description: Stripe.js `createToken()`
                    url: 'https://stripe.com/docs/stripe-js/reference#stripe-create-token'
                  type: string
                  example: tok_fr
  responses:
    200:
      description: Subscription was created and is active.
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            additionalProperties: false
            properties:
              success:
                description: The response success.
                type: boolean
                enum: [true]
              data:
                anyOf:
                  - $ref: '#/components/schemas/SubscriptionActive'
                  - $ref: '#/components/schemas/SubscriptionActiveMigrated'
    202:
      description: Subscription was created but 3D Secure 2 was triggered.
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            additionalProperties: false
            properties:
              success:
                description: The response success.
                type: boolean
                enum: [true]
              data:
                $ref: '#/components/schemas/SubscriptionMigration3DS2'
    422:
      description: Card token has been refused.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                description: The error code.
                type: string
                enum: [card_incorrect_cvc, card_declined]
              message:
                description: The error message.
                type: string
              data:
                description: The error data.
