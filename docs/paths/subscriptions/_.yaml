post:
  summary: Create subscription
  requestBody:
    content:
      application/json:
        schema:
          type: object
          required: [plan, token_id]
          properties:
            plan:
              description: The plan.
              type: string
              enum: [v5_monthly, v5_annually, v5_biannually]
            token_id:
              description: >-
                The payment method token associated with the subscription. It can
                be retrieved using the Stripe.js `createToken()` function.
              externalDocs:
                description: Stripe.js `createToken()`
                url: 'https://stripe.com/docs/stripe-js/reference#stripe-create-token'
              type: string
              example: tok_fr
  responses:
    200:
      description: Subscription was created and is active.
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            additionalProperties: false
            properties:
              success:
                description: The response success.
                type: boolean
                enum: [true]
              data:
                allOf:
                  - $ref: '#/components/schemas/Subscription'
                  - type: object
                    properties:
                      latest_invoice:
                        allOf:
                          - $ref: '#/components/schemas/Invoice'
                          - type: object
                            properties:
                              payment_intent:
                                $ref: '#/components/schemas/PaymentIntent'
    422:
      description: Card token has been refused.
      content:
        application/json:
          schema:
            oneOf:
              - description: Incorrect CVC
                type: object
                properties:
                  error:
                    description: The Incorrect CVC error code.
                    type: string
                    enum: [incorrect_cvc]
                  message:
                    description: The Incorrect CVC error message.
                    type: string
                    enum: [Incorrect CVC]
                  data:
                    description: The Incorrect CVC error data.
                    type: array
