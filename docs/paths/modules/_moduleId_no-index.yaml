post:
  tags:
    - Modules
  summary: Seo Index
  operationId: modulesSeoIndex
  parameters:
    - name: moduleId
      in: path
      description: The module id.
      required: true
      schema:
        type: int
        example: 1655
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            country_id:
              description: The country id.
              type: integer
              example: 1
            class_id:
              description: The class id.
              type: integer
              example: 5
            discipline_id:
              description: The discipline id.
              type: integer
              example: 7
            chapter_id:
              description: The chapter id.
              type: integer
              example: 16
            notion_id:
              description: The notion id.
              type: integer
              example: 125
            activity_id:
              description: The activity id.
              type: integer
              example: 352
            module_id:
              description: The module id.
              type: integer
              example: 1655
            cancel:
              description: If the existing no-index should be canceled.
              type: boolean
              example: false
          required:
            - country_id
            - class_id
            - discipline_id
            - chapter_id
            - notion_id
            - activity_id
            - module_id
  responses:
    200:
      description: The module with the `seo_index` field.
      content:
        application/json:
          schema:
            $ref: '../../index.yaml#/components/schemas/ModuleWithSeoIndex'

