type: object
properties:
  type:
    description: The subscription type.
    type: string
  id:
    description: The subscription id.
    type: string
    example: sub_FkgEkmuI3DFejK
  cancel_at:
    description: The subscription cancel **future** date.
    type: string
    format: date-time
    nullable: true
  cancel_at_period_end:
    description: If the subscription will cancel at the end of the current billing period.
    type: boolean
  canceled_at:
    description: The subscription cancel **past** date.
    type: string
    format: date-time
    nullable: true
  created_at:
    description: The date/time the subscription was created.
    type: string
    format: date-time
  current_period_start:
    description: The date/time of the beginning of the current period.
    type: string
    format: date-time
  current_period_end:
    description: The date/time of the end of the current period.
    type: string
    format: date-time
  customer:
    description: The customer id who own the subscription. Refers to `stripe_id` or `braintree_id` on users.
    type: string
    example: cus_FkgEYnEbkQZF6G
  plan:
    description: The subscription plan.
    type: object
    properties:
      id:
        description: The plan id.
        type: string
        example: v5_monthly
      amount:
        description: The plan amount **in cents**.
        type: integer
        example: 1790
  status:
    description: The subscription status.
    type: string
    externalDocs:
      description: Stripe subscription statuses documentation
      url: https://stripe.com/docs/api/subscriptions/object#subscription_object-status
  trial_end:
    description: The subscription trial end date, if necessary. `null` otherwise.
    type: string
    format: date-time
    nullable: true
