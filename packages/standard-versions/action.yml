name: Standard Versions
author: Mathrix Education SA
description: Generate standard versions and releases.
branding:
  color: blue
  icon: upload-cloud
runs:
  using: 'node12'
  main: 'dist/index.js'
inputs:
  version:
    description: Override the version.
    required: false
  from:
    description: The file to read the version from.
    required: false
    default: 'auto'
