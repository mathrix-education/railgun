version: '3'
services:
  redis:
    image: library/redis:5-alpine
    volumes:
      - railgun_redis_data:/data
    ports:
      - 16379:6379
  mysql:
    image: library/mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: salome3004
      MYSQL_DATABASE: education_local
    ports:
      - 13306:3306
    volumes:
      - railgun_mysql_data:/var/lib/mysql
volumes:
  railgun_redis_data:
  railgun_mysql_data:
