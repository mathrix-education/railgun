# Mathrix Education API
# =====================
# Cloud Build Recipe
# Author: Mathieu Bour
# ====================
substitutions:
  _IMAGE: 'education-api'
  _SONARQUBE_HOST_URL: 'https://sonarqube.mathrix.fr'
  _SONARQUBE_TOKEN: 'a030445727da3c9dc5513a8f1c76223def619a5f'
  _SONARQUBE_PROJECT_KEY: 'mathrix-education-api'
  _GKE_COMPUTE_ZONE: 'europe-west1-b'
  _GKE_CLUSTER: 'mathrix-education-cluster'
#options:
#  machineType: 'N1_HIGHCPU_32'
steps:
  # Decrypt the SSH private key for composer git clone
  # --------------------------------------------------
  - id: 'gcloud:kms:decrypt'
    name: 'gcr.io/cloud-builders/gcloud'
    args:
      - kms
      - decrypt
      - --ciphertext-file=deploy/id_rsa.enc
      - --plaintext-file=/root/.ssh/id_rsa
      - --location=global
      - --keyring=mathrix-education-keyring
      - --key=github-key
    volumes:
      - name: 'ssh'
        path: /root/.ssh

  # Install composer
  # ----------------
  - id: 'composer:install'
    waitFor: ['gcloud:kms:decrypt']
    name: 'eu.gcr.io/$PROJECT_ID/runner-composer-prestissimo'
    entrypoint: 'ash'
    args:
      - '-c'
      - |
        chmod 600 /root/.ssh/id_rsa
        cat <<EOF >/root/.ssh/config
        Hostname github.com
        IdentityFile /root/.ssh/id_rsa
        EOF
        cp deploy/known_hosts /root/.ssh/known_hosts
        composer install \
          --optimize-autoloader
          --no-interaction
          --no-suggest
          --no-progress
          --no-ansi
    volumes:
      - name: 'ssh'
        path: '/root/.ssh'

  # Run paratest in coverage mode
  # Hack to allow step to fail: https://github.com/GoogleCloudPlatform/cloud-builders/issues/253
  # --------------------------------------------------------------------------------------------
#  - id: 'docker-compose:tests'
#    waitFor: ['composer:install']
#    name: 'eu.gcr.io/$PROJECT_ID/runner-docker-compose'
#    entrypoint: 'sh'
#    args:
#      - '-c'
#      - |
#        docker-compose up --abort-on-container-exit || exit 0

  # Send cover results to SonarQube
  # ------------------------------
#  - id: 'sonar-scanner'
#    waitFor: ['docker-compose:tests']
#    name: 'eu.gcr.io/$PROJECT_ID/runner-sonar-scanner:php'
#    args:
#      - '-Dsonar.projectVersion=$SHORT_SHA'
#      - '-Dsonar.branch.name=$BRANCH_NAME'


  # Meanwhile, begin the image build
  # --------------------------------
  - id: 'docker:build'
    waitFor: ['composer:install']
    name: 'gcr.io/cloud-builders/docker'
    args: ['build',
           '--build-arg', 'COMMIT_SHORT_SHA=$SHORT_SHA',
           '-t', 'eu.gcr.io/$PROJECT_ID/$_IMAGE:$SHORT_SHA',
           '-t', 'eu.gcr.io/$PROJECT_ID/$_IMAGE:latest-$BRANCH_NAME',
           '.']


  # Push the image to the registry with commit tag
  # ----------------------------------------------
  - id: 'docker:push:short-sha'
#    waitFor: ['docker:build', 'docker-compose:tests']
    waitFor: ['docker:build']
    name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'eu.gcr.io/$PROJECT_ID/$_IMAGE:$SHORT_SHA']


  # Also tag add the branch latest tag
  # ----------------------------------
  - id: 'gcloud:add-tag:latest'
    waitFor: ['docker:push:short-sha']
    name: 'gcr.io/cloud-builders/gcloud'
    args: ['container', 'images', 'add-tag',
           'eu.gcr.io/$PROJECT_ID/$_IMAGE:$SHORT_SHA',
           'eu.gcr.io/$PROJECT_ID/$_IMAGE:latest-$BRANCH_NAME']


  # Deploy to the dev environment
  # ------------------------------
  - id: 'kubectl:deploy'
    waitFor: ['docker:push:short-sha']
    name: 'gcr.io/cloud-builders/kubectl'
    args: ['set', 'image', 'deployment', '$_GKE_DEPLOYMENT',
           '$_GKE_CONTAINER=eu.gcr.io/$PROJECT_ID/$_IMAGE:$SHORT_SHA']
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=$_GKE_COMPUTE_ZONE'
      - 'CLOUDSDK_CONTAINER_CLUSTER=$_GKE_CLUSTER'
