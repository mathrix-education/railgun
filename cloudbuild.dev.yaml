# Mathrix Education API
# =====================
# Cloud Build Recipe
# Author: Mathieu Bour
# ====================
substitutions:
  # SonarQube
  _SONARQUBE_PARENT_BRANCH:
  # Docs
  _DOCS_IMAGE: 'education-api-docs'
  _DOCS_DEPLOYMENT:
  _DOCS_CONTAINER:
  # CLOUDSDK
  _CLOUDSDK_COMPUTE_ZONE: 'europe-west1-b'
  _CLOUDSDK_CONTAINER_CLUSTER: 'mathrix-education-cluster'
options:
  machineType: 'N1_HIGHCPU_8'
steps:
  # Decrypt the SSH private key for composer git clone
  # --------------------------------------------------
  - id: 'gcloud:kms:decrypt'
    waitFor: ['-']
    name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: '/bin/bash'
    args:
      - '-c'
      - |
        function decrypt() {
          gcloud kms decrypt \
            --location global \
            --keyring mathrix-education-keyring \
            --key education-api-key \
            --ciphertext-file ${1}.enc \
            --plaintext-file ${1}
        }

        decrypt storage/keychain/github-oauth.github.com
        decrypt storage/keychain/google-cloud.json


  # Install PHP dependencies using composer
  # ---------------------------------------
  - id: 'composer:install'
    waitFor: ['gcloud:kms:decrypt']
    name: 'eu.gcr.io/$PROJECT_ID/runner-composer-prestissimo'
    entrypoint: 'ash'
    args:
      - '-c'
      - |
        composer config -g github-oauth.github.com \
          $(cat storage/keychain/github-oauth.github.com)
        composer install \
          --optimize-autoloader \
          --ignore-platform-reqs \
          --no-interaction \
          --no-suggest \
          --no-progress \
          --no-ansi


  # Install Node dependencies using yarn
  # ------------------------------------
  - id: 'node:compile'
    waitFor: ['-']
    name: 'node:11-alpine'
    entrypoint: 'ash'
    args:
      - '-c'
      - |
        sed -i -e 's/git\+ssh\:\/\/git\@github.com\/mathrix-education/git\+https\:\/\/azerazer\:x-oauth-basic\@github.com\/mathrix-education/g'
        yarn install
        yarn run docs:compile
        yarn run mails:compile


  # Run paratest in coverage mode
  # Hack to allow step to fail: https://github.com/GoogleCloudPlatform/cloud-builders/issues/253
  # --------------------------------------------------------------------------------------------
  - id: 'docker-compose:tests'
    waitFor: ['composer:install', 'node:compile']
    name: 'eu.gcr.io/$PROJECT_ID/runner-docker-compose'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        docker-compose up --abort-on-container-exit || exit 0


  # Send cover results to SonarQube
  # ------------------------------
  - id: 'sonar-scanner'
    waitFor: ['docker-compose:tests']
    name: 'eu.gcr.io/$PROJECT_ID/runner-sonar-scanner:angular'
    args:
      - '-Dsonar.projectVersion=$SHORT_SHA'
      - '-Dsonar.branch.name=$BRANCH_NAME'


  # Build, push and deploy API image
  # --------------------------------
  - id: 'docker:build:api'
    waitFor: ['docker-compose:tests']
    name: 'gcr.io/cloud-builders/docker'
    args: ['build',
           '--build-arg', 'COMMIT_SHORT_SHA=$SHORT_SHA',
           '-t', 'eu.gcr.io/$PROJECT_ID/education-api:$SHORT_SHA',
           '.']
  - id: 'docker:push:api'
    waitFor: ['docker:build:api']
    name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'eu.gcr.io/$PROJECT_ID/education-api:$SHORT_SHA']
  - id: 'kubectl:deploy:server,scheduler,worker'
    waitFor: ['docker:push:api']
    name: 'gcr.io/cloud-builders/kubectl'
    args: ['set', 'image', 'deployments',
           '*=eu.gcr.io/$PROJECT_ID/education-api:$SHORT_SHA',
           '-l', 'app=education-api,environment=dev,tier=backend']
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=$_CLOUDSDK_COMPUTE_ZONE'
      - 'CLOUDSDK_CONTAINER_CLUSTER=$_CLOUDSDK_CONTAINER_CLUSTER'
  - id: 'gcloud:tag:api'
    waitFor: ['docker:push:api']
    name: 'gcr.io/cloud-builders/gcloud'
    args: ['container', 'images', 'add-tag',
           'eu.gcr.io/$PROJECT_ID/education-api:$SHORT_SHA',
           'eu.gcr.io/$PROJECT_ID/education-api:latest-$BRANCH_NAME']


  # Build, push and deploy docs image
  # ---------------------------------
  - id: 'docker:build:docs'
    waitFor: ['docker-compose:tests']
    name: 'gcr.io/cloud-builders/docker'
    args: ['build',
           '-f', 'docs/Dockerfile',
           '--build-arg', 'COMMIT_SHORT_SHA=$SHORT_SHA',
           '-t', 'eu.gcr.io/$PROJECT_ID/$_DOCS_IMAGE:$SHORT_SHA',
           '.']
  - id: 'docker:push:docs'
    waitFor: ['docker:build:docs']
    name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'eu.gcr.io/$PROJECT_ID/$_DOCS_IMAGE:$SHORT_SHA']
  - id: 'kubectl:deploy:docs'
    waitFor: ['docker:push:docs']
    name: 'gcr.io/cloud-builders/kubectl'
    args: ['set', 'image', 'deployment', '$_DOCS_DEPLOYMENT',
           '$_DOCS_CONTAINER=eu.gcr.io/$PROJECT_ID/$_DOCS_IMAGE:$SHORT_SHA']
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=$_CLOUDSDK_COMPUTE_ZONE'
      - 'CLOUDSDK_CONTAINER_CLUSTER=$_CLOUDSDK_CONTAINER_CLUSTER'
  - id: 'gcloud:tag:docs'
    waitFor: ['docker:push:docs']
    name: 'gcr.io/cloud-builders/gcloud'
    args: ['container', 'images', 'add-tag',
           'eu.gcr.io/$PROJECT_ID/$_DOCS_IMAGE:$SHORT_SHA',
           'eu.gcr.io/$PROJECT_ID/$_DOCS_IMAGE:latest-$BRANCH_NAME']
