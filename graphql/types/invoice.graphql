enum InvoiceStatus {
    STATUS_DELETED @enum(value: "deleted")
    STATUS_DRAFT @enum(value: "draft")
    STATUS_OPEN @enum(value: "open")
    STATUS_PAID @enum(value: "paid")
    STATUS_UNCOLLECTIBLE @enum(value: "uncollectible")
    STATUS_VOID @enum(value: "void")
}

type Invoice {
    id: ID!
    amount_paid: Int!
    hosted_invoice_url: String!
    invoice_pdf: String!
    payment_intent: PaymentIntent
    number: String!
    status: InvoiceStatus!
}
