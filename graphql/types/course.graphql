type Course {
    id: ID!
    name: String!
    slug: String!
    content: Silicate!
    order: Int!
    visible: Boolean!
    seo_index: Boolean!
    seo_title: String
    seo_slug: String
    seo_keywords: String
    seo_description: String
    created_at: DateTime!
    updated_at: DateTime!
    notion: Notion! @belongsTo
    comments: [Comment!] @morphMany
    """
    The course administrative notes. Requires the "notes:read" scope.
    """
    notes: [Note!] @morphMany @permission(scope: "notes:read")
    interaction: Interaction @belongsTo
}
