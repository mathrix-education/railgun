type Course {
    id: ID!
    name: String!
    slug: String!
    content: Silicate! @premium(stripped: "[]")
    order: Int!
    """
    If the flashcard is premium-locked.
    """
    premium: Boolean!
    """
    If the course is frozen. Requires the "courses:freeze" to override.
    """
    frozen_at: DateTime
    visible: Boolean!
    seo_index: Boolean!
    seo_title: String
    seo_keywords: String
    seo_description: String
    created_at: DateTime!
    updated_at: DateTime!
    notion: Notion! @belongsTo
    comments: [Comment!] @morphMany
    """
    The course administrative labels. Requires the "labels:read" permission.
    """
    labels: [Label!] @morphMany @permission(name: "labels:read")
    """
    The course administrative notes. Requires the "notes:read" permission.
    """
    notes: [Note!] @morphMany @permission(name: "notes:read")
    interaction: Interaction @belongsTo
}
