type Course {
    id: ID!
    name: String!
    slug: String!
    content: Silicate!
    order: Int!
    visible: Boolean!
    seo_index: Boolean!
    seo_title: String
    seo_slug: String
    seo_keywords: String
    seo_description: String
    created_at: DateTime!
    updated_at: DateTime!
    comments: [Comment!] @morphMany
    notion: Notion! @belongsTo
    interaction: Interaction @belongsTo
}
