enum NotificationType {
    COMMENT_REPLY @enum(value: "Railgun\\Notifications\\CommentReplyNotification")
}

union NotificationPayload = CommentReplyNotificationPayload

type Notification {
    "The notification id, which is an UUID4."
    id: ID!
    "The notification type."
    type: NotificationType!
    "The notification payload, which shape depends of the notification type"
    data: NotificationPayload!
    "When the notification was read by the user"
    read_at: DateTime!
    "When the notification was created"
    created_at: DateTime!
    "When the notification was last updated"
    updated_at: DateTime!
}

"Payload if the COMMENT_REPLY notification"
type CommentReplyNotificationPayload {
    user_comment: Comment
    new_comment: Comment
}
