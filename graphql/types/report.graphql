union Reportable = Course | Exercise | Flashcard | Exam

enum ReportType {
    course @enum(value: "course")
    exercise @enum(value: "exercise")
    flashcard @enum(value: "flashcard")
    exam @enum(value: "exam")
}

type Report {
    id: ID!
    type: String
    content: String
    status: String
    created_at: DateTime!
    updated_at: DateTime!
    reportable: Reportable! @morphTo
}
