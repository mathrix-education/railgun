enum NotionType {
    COURSE @enum(value: "course")
    SUBJECT @enum(value: "subject")
}

type Notion {
    id: ID!
    name: String!
    type: NotionType!
    order: Int!
    visible: Boolean!
    created_at: DateTime!
    updated_at: DateTime!
    chapter: Chapter! @belongsTo
    courses: [Course!]! @hasMany
    subjects: [Subject!]! @hasMany
}
