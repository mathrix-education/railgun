enum NotionType {
    standard @enum(value: "standard")
    summary @enum(value: "summary")
}

type Notion implements Ownable {
    id: ID!
    type: NotionType!
    name: String!
    order: Int!
    visible: Boolean!
    created_at: DateTime!
    updated_at: DateTime!
    owned: Boolean!
    chapter: Chapter! @belongsTo
    courses: [Course!]! @hasMany
    subjects: [Subject!]! @hasMany
    problems: [Problem!]! @hasMany
    clones: [Notion!]! @belongsToMany @permission(name: "notions:read")
}
