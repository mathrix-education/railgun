type Problem implements Ownable {
    id: ID!
    name: String!
    slug: String!
    duration: Int
    content: Silicate @censor(value: "[]")
    order: Int!
    """
    If the problem is premium-locked.
    """
    premium: Boolean!
    """
    If the problem is protected (is part of a sellable Chapter and is not free).
    """
    protected: Boolean!
    """
    If the problem is frozen. Requires the "problems:freeze" to override.
    """
    frozen_at: DateTime
    visible: Boolean!
    created_at: DateTime!
    updated_at: DateTime!
    owned: Boolean!
    notion: Notion! @belongsTo
    comments: [Comment!] @morphMany
    """
    The problem administrative labels. Requires the "labels:read" permission.
    """
    labels: [Label!] @morphMany @permission(name: "labels:read")
    """
    The problem administrative notes. Requires the "notes:read" permission.
    """
    notes: [Note!] @morphMany @permission(name: "notes:read")
    interaction: Interaction @belongsTo
    clones: [Problem!]! @belongsToMany @permission(name: "problems:read")
}
