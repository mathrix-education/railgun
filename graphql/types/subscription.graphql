enum SubscriptionStatus {
    active @enum(value: "active")
    canceled @enum(value: "canceled")
    incomplete @enum(value: "incomplete")
    incomplete_expired @enum(value: "incomplete_expired")
    past_due @enum(value: "past_due")
    trialing @enum(value: "trialing")
    unpaid @enum(value: "unpaid")
}

type Subscription_ {
    id: ID!
    plan: ID!
    customer_id: String!
    status: SubscriptionStatus!
    current_period_start: DateTime
    current_period_end: DateTime
    created_at: DateTime
    updated_at: DateTime
    canceled_at: DateTime
    "The subscription latest ince, might be null if the subscription belongs to Braintree."
    latest_invoice: Invoice
    "The subscription card, might be null if the subscription belongs to Braintree."
    card: Card
}
