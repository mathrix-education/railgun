type Lesson {
    id: ID!
    name: String!
    slug: String!
    content: Silicate!
    order: Int!
    visible: Boolean!
    created_at: DateTime!
    updated_at: DateTime!
    section: Section! @belongsTo
    comments: [Comment!] @morphMany
    """
    The lesson administrative labels. Requires the "labels:read" scope.
    """
    labels: [Label!] @morphMany @permission(name: "labels:read")
    """
    The lesson administrative notes. Requires the "notes:read" scope.
    """
    notes: [Note!] @morphMany @permission(name: "notes:read")
}
