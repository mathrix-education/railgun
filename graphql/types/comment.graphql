union Commentable = Course | Exam | Exercise | Flashcard

enum CommentableType {
    course @enum(value: "course")
    exam @enum(value: "exam")
    exercise @enum(value: "exercise")
    flashcard @enum(value: "flashcard")
}

type Comment {
    id: ID!
    content: String!
    score: Int!
    created_at: DateTime!
    updated_at: DateTime!
    parent: Comment @belongsTo
    children: [Comment!]! @hasMany
    commentable: Commentable! @morphTo
    user: User! @belongsTo
    vote: Vote @hasOne
    votes: [Vote!]! @hasMany
}
