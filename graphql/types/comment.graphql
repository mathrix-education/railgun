union Commentable = Course | Exercise | Flashcard | Exam

type Comment {
    id: ID!
    content: String!
    score: Int!
    created_at: DateTime!
    updated_at: DateTime!
    parent: Comment @belongsTo
    children: [Comment!]! @hasMany
    commentable: Commentable!
    user: User! @belongsTo
    vote: Vote @hasOne
    votes: [Vote!]! @hasMany
}
