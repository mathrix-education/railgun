type Cart {
    packs: [Pack!]!
    trainings: [Training!]!
    coupon: Coupon
    subTotal: Int!
    total: Int!
}

input CartInput {
    packIds: [ID!]
    trainingIds: [ID!]
    premium: Boolean
    coupon: ID
}

input Checkout {
    packs: [ID!]
    trainings: [ID!]
    plans: [ID!]
    coupon: ID
}
