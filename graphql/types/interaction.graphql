enum InteractionType {
    course @enum(value: "course")
    exam @enum(value: "exam")
    exercise @enum(value: "exercise")
    flashcard @enum(value: "flashcard")
    subject @enum(value: "subject")
}

enum InteractionComprehension {
    blur @enum(value: "blur")
    clear @enum(value: "clear")
}

type Interaction {
    user_id: Int!
    interactable_type: InteractionType!
    interactable_id: Int!
    comprehension: InteractionComprehension
    score: Int
    total: Int
    watchtime: Int
    created_at: DateTime!
    updated_at: DateTime!
}
