type Exam {
    id: ID!
    name: String!
    slug: String!
    duration: Int
    content: Silicate
    order: Int!
    """
    If the flashcard is premium-locked.
    """
    premium: Boolean!
    visible: Boolean!
    created_at: DateTime!
    updated_at: DateTime!
    chapter: Chapter! @belongsTo
    comments: [Comment!] @morphMany
    """
    The exam administrative notes. Requires the "notes:read" scope.
    """
    notes: [Note!] @morphMany @permission(scope: "notes:read")
    interaction: Interaction @belongsTo
}
