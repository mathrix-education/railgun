type Exam {
    id: ID!
    name: String!
    slug: String!
    duration: Int
    content: Silicate
    order: Int!
    """
    If the exam is premium-locked.
    """
    premium: Boolean!
    """
    If the exam is frozen. Requires the "exams:freeze" to override.
    """
    frozen_until: DateTime!
    visible: Boolean!
    created_at: DateTime!
    updated_at: DateTime!
    chapter: Chapter! @belongsTo
    comments: [Comment!] @morphMany
    """
    The exam administrative labels. Requires the "labels:read" scope.
    """
    labels: [Label!] @morphMany @permission(scope: "labels:read")
    """
    The exam administrative notes. Requires the "notes:read" scope.
    """
    notes: [Note!] @morphMany @permission(scope: "notes:read")
    interaction: Interaction @belongsTo
}
