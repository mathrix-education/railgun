type Exam implements Ownable {
    id: ID!
    name: String!
    slug: String!
    duration: Int
    content: Silicate @premium(stripped: "[]")
    order: Int!
    """
    If the exam is premium-locked.
    """
    premium: Boolean!
    """
    If the exam is frozen. Requires the "exams:freeze" to override.
    """
    frozen_at: DateTime
    visible: Boolean!
    created_at: DateTime!
    updated_at: DateTime!
    owned: Boolean!
    chapter: Chapter! @belongsTo
    comments: [Comment!] @morphMany
    """
    The exam administrative labels. Requires the "labels:read" permission.
    """
    labels: [Label!] @morphMany @permission(name: "labels:read")
    """
    The exam administrative notes. Requires the "notes:read" permission.
    """
    notes: [Note!] @morphMany @permission(name: "notes:read")
    interaction: Interaction @belongsTo
}
