enum PlanID {
    V5_MONTHLY @enum(value: "v5_monthly")
    V5_ANNUALLY @enum(value: "v5_annually")
    V5_BIANNUALLY @enum(value: "v5_biannually")
    V11_MONTHLY @enum(value: "v11_month")
    V11_QUARTERLY @enum(value: "v11_quarter")
    V11_SEMESTER @enum(value: "v11_semester")
    V11_YEAR @enum(value: "v11_year")
}

enum PlanPeriod {
    MONTH @enum(value: "month")
    QUARTER @enum(value: "quarter")
    SEMESTER @enum(value: "semester")
    YEAR @enum(value: "year")
}

type Plan {
    id: PlanID!
    "The period between payments."
    period: PlanPeriod!
    "The price, **in cents** per period."
    price_per_period: Int!
    "The price, **in cents** per month."
    price_per_month: Int!
}
