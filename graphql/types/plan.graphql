type Plan {
    "The plan identifier."
    id: ID! @rename(attribute: "lookup_key")
    "The plan human-readable name."
    name: String! @rename(attribute: "nickname")
    "The plan [ISO 4217](https://www.iso.org/iso-4217-currency-codes.html) currency code. In our case, always \"eur\"."
    currency: String!
    "The plan price per period **in cents.**"
    price: Int! @rename(attribute: "unit_amount")
    "The plan period details"
    period: PlanPeriod! @rename(attribute: "recurring")
}

enum PlanInterval {
    day @enum(value: "day")
    week @enum(value: "week")
    month @enum(value: "month")
    year @enum(value: "year")
}

type PlanPeriod {
    "The plan period unit."
    unit: PlanInterval! @rename(attribute: "interval")
    "The plan period length multiplier."
    length: Int! @rename(attribute: "interval_count")
}
