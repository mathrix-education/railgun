enum ExerciseType {
    MCQ @enum(value: "mcq")
}

type Exercise {
    id: ID!
    type: ExerciseType!
    questions: [Silicate!]!
    choices: [[Silicate!]!]!
    solutions: [[Int!]!]!
    explanations: [[Silicate!]!]!
    order: Int!
    """
    If the exercise is premium-locked.
    """
    premium: Boolean!
    """
    If the exercise is frozen. Requires the "exercises:freeze" to override.
    """
    frozen_at: DateTime!
    visible: Boolean!
    created_at: DateTime!
    updated_at: DateTime!
    subject: Subject! @belongsTo
    comments: [Comment!] @morphMany
    """
    The exercise administrative labels. Requires the "labels:read" scope.
    """
    labels: [Label!] @morphMany @permission(scope: "labels:read")
    """
    The exercise administrative notes. Requires the "notes:read" scope.
    """
    notes: [Note!] @morphMany @permission(scope: "notes:read")
    interaction: Interaction @belongsTo
}
