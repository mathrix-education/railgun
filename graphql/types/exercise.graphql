type Exercise {
    id: ID!
    type: String
    questions: [String!]!
    choices: [[String!]!]!
    solutions: [[Int!]!]!
    examplations: [SilicateWall!]!
    order: Int!
    created_at: DateTime!
    updated_at: DateTime!
    comments: [Comment!] @morphMany
    interaction: Interaction @belongsTo
    subject: Subject! @belongsTo
}
