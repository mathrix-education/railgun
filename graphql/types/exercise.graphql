enum ExerciseType {
    MCQ @enum(value: "mcq")
}

type Exercise {
    id: ID!
    type: ExerciseType!
    questions: [Silicate!]!
    choices: [SilicateList!]!
    solutions: [IntList!]!
    explanations: [SilicateList!]!
    order: Int!
    """
    If the flashcard is premium-locked.
    """
    premium: Boolean!
    visible: Boolean!
    created_at: DateTime!
    updated_at: DateTime!
    subject: Subject! @belongsTo
    comments: [Comment!] @morphMany
    """
    The exercise administrative labels. Requires the "labels:read" scope.
    """
    labels: [Label!] @morphMany @permission(scope: "labels:read")
    """
    The exercise administrative notes. Requires the "notes:read" scope.
    """
    notes: [Note!] @morphMany @permission(scope: "notes:read")
    interaction: Interaction @belongsTo
}
