type Exercise {
    id: ID!
    type: String
    content: Silicate!
    questions: [Silicate!]!
    choices: [[Silicate!]!]!
    solutions: [[Int!]!]!
    explanations: [Silicate!]!
    order: Int!
    created_at: DateTime!
    updated_at: DateTime!
    comments: [Comment!] @morphMany
    interaction: Interaction @belongsTo
    subject: Subject! @belongsTo
}
