type Grade {
    id: ID!
    name: String!
    slug: String!
    order: Int!
    visible: Boolean!
    parent: Grade @belongsTo
    country: Country! @belongsTo
    chapters: [Chapter!]! @hasMany
    disciplines: [Discipline!]! @belongsToMany
    themes: [Theme!]! @hasMany
    trainings: [Training!]! @belongsToMany
}
