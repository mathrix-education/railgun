union Notable = Course | Exam | Exercise | Flashcard

enum NotableType {
    course @enum(value: "course")
    exam @enum(value: "exam")
    exercise @enum(value: "exercise")
    flashcard @enum(value: "flashcard")
}

type Note {
    id: ID!
    content: Silicate!
    brick_id: String
    user: User! @belongsTo
    notable: Notable! @morphTo
    created_at: DateTime!
    updated_at: DateTime!
}
