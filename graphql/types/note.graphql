union Notable = Course | Exam | MCQExercise | ProofExercise | Flashcard

enum NotableType {
    COURSE @enum(value: "course")
    EXAM @enum(value: "exam")
    EXERCISE @enum(value: "exercise")
    FLASHCARD @enum(value: "flashcard")
}

type Note {
    id: ID!
    content: Silicate!
    brick_id: String
    user: User! @belongsTo
    notable: Notable! @morphTo
    created_at: DateTime!
    updated_at: DateTime!
}
