"See \\App\\Models\\Coupon:TYPES"
enum CouponType {
    percentage @enum(value: "percentage")
    absolute @enum(value: "absolute")
}

type Coupon {
    id: ID!
    type: CouponType!
    value: Int!
    counter: Int!
    expires_at: DateTime
    created_at: DateTime!
    updated_at: DateTime!
    expired: Boolean!
    exhausted: Boolean!
    valid: Boolean!
}
