type User {
    id: ID!
    username: String
    firstname: String @policy(ability: "read")
    lastname: String @policy(ability: "read")
    email: String!  @policy(ability: "read")
    scopes: [String!]! @policy(ability: "read")
    """
    If the user has access to premium content.
    Notice: **may cause an additional delay**.
    """
    premium: Boolean! @policy(ability: "read")
    premium_bypass: Boolean! @policy(ability: "read")
    premium_bypass_expires_at: DateTime @policy(ability: "read")
    stripe_id: String @permission(name: "users:read")
    braintree_id: String @permission(name: "users:read")
    created_at: DateTime!
    updated_at: DateTime!
    grade: Grade @belongsTo
    notifications: [Notification!]! @policy(ability: "read") @morphMany(type: "paginator")
    packs: [Pack!]! @policy(ability: "read") @morphMany
    trainings: [Training!]! @policy(ability: "read") @morphMany
    sessions: [Session!]! @policy(ability: "read") @hasMany
    statistics: UserStatistics! @policy(ability: "read")
    subscriptions: [Subscription_!]! @policy(ability: "read") @hasMany
}
