type Flashcard {
    id: ID!
    fronts: [Silicate!]!
    backs: [Silicate!]!
    order: Int!
    visible: Boolean!
    created_at: DateTime!
    updated_at: DateTime!
    chapter: Chapter! @belongsTo
    comments: [Comment!] @morphMany
    """
    The flashcard administrative notes. Requires the "notes:read" scope.
    """
    notes: [Note!] @morphMany @permission(scope: "notes:read")
    interaction: Interaction @belongsTo
}
