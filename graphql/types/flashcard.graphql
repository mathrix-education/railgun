type Flashcard {
    id: ID!
    name: String!
    content: [FlashcardContent!]! @premium(stripped: "[]")
    order: Int!
    """
    If the flashcard is premium-locked.
    """
    premium: Boolean!
    """
    If the flashcard is frozen. Requires the "flashcards:freeze" to override.
    """
    frozen_at: DateTime
    visible: Boolean!
    created_at: DateTime!
    updated_at: DateTime!
    chapter: Chapter! @belongsTo
    comments: [Comment!] @morphMany
    """
    The flashcard administrative labels. Requires the "labels:read" permission.
    """
    labels: [Label!] @morphMany @permission(name: "labels:read")
    """
    The flashcard administrative notes. Requires the "notes:read" permission.
    """
    notes: [Note!] @morphMany @permission(name: "notes:read")
    interaction: Interaction @belongsTo
}

type FlashcardContent {
    front: Silicate!
    back: Silicate!
}
