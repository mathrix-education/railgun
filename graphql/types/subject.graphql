type Subject implements Ownable {
    id: ID!
    name: String!
    slug: String!
    order: Int!
    """
    If the subject is premium-locked.
    """
    premium: Boolean!
    """
    If the subject is protected (is part of a sellable Chapter and is not free).
    """
    protected: Boolean!
    visible: Boolean!
    created_at: DateTime!
    updated_at: DateTime!
    owned: Boolean!
    notion: Notion! @belongsTo
    exercises: [Exercise!]! @hasMany
    interaction: Interaction @belongsTo
}
