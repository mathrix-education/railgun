type Subject implements Ownable {
    id: ID!
    name: String!
    slug: String!
    order: Int!
    premium: Boolean!
    visible: Boolean!
    created_at: DateTime!
    updated_at: DateTime!
    owned: Boolean!
    notion: Notion! @belongsTo
    exercises: [Exercise!]! @hasMany
    interaction: Interaction @belongsTo
}
