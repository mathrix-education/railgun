type Training implements Ownable {
    id: ID!
    name: String!
    slug: String!
    duration: Int!
    content: Silicate!
    image: String
    available: Boolean!
    price: Int!
    order: Int!
    visible: Boolean!
    created_at: DateTime!
    updated_at: DateTime!
    owned: Boolean!
    grades: [Grade!]! @belongsToMany
    sections: [Section!]! @hasMany
    packs: [Pack!]! @belongsToMany
}
