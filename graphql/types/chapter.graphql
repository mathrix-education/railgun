type Chapter implements Ownable {
    id: ID!
    name: String!
    slug: String!
    order: Int!
    visible: Boolean!
    created_at: DateTime!
    updated_at: DateTime!
    owned: Boolean!
    theme: Theme! @belongsTo
    notions: [Notion!]! @hasMany
    summary: Notion @belongsTo
    flashcards: [Flashcard!]! @hasMany
    exams: [Exam!]! @hasMany
    sessions: [Session!]! @hasMany
}
