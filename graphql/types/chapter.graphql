type Chapter implements Sellable & Ownable {
    id: ID!
    name: String!
    slug: String!
    "The chapter price **in cents**. May be null if the chapter is not sellable."
    price: Int
    visible: Boolean!
    created_at: DateTime!
    updated_at: DateTime!
    available: Boolean!
    owned: Boolean!
    order: Int
    themes: [Theme!]! @belongsToMany
    notions: [Notion!]! @hasMany
    summary: Notion @belongsTo
    flashcards: [Flashcard!]! @hasMany
    exams: [Exam!]! @hasMany
    sessions: [Session!]! @hasMany
}
