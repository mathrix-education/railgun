input CreateFlashcard {
    """
    The flashcard human-redable name.
    Maximum 150 caracters.
    """
    name: String! @rules(apply: ["string", "max:150"])
    """
    The flashcard content. Cannot be empty.
    """
    content: [FlashcardContentInput!]!
    """
    The flashcard order. If not set, the chapter will be placed in the last position of the group [chapter].
    Must be positive (i.e. >=0).
    """
    order: Int! @rules(apply: ["nullable", "min:0"])
    """
    If the flashcard is only accessible for premium users. Default value is `false`.
    Requires the permission `flashcards:write:premium`.
    """
    premium: Boolean @permission(name: "flashcards:write:premium") @rules(apply: ["boolean"])
    """
    If the flashcard is only accessible for users who bought the parent chapter. Default value is `false`.
    Requires the permission `exam:write:protected`.
    """
    protected: Boolean @permission(name: "exam:write:protected") @rules(apply: ["boolean"])
    """
    The flashcard frozen date. If set, only the users with the permission `flashcards:freeze` will be allowed to edit
    the flashcard. Set to `null` to disable.
    Requires the permission `flashcards:freeze`.
    """
    frozen_at: DateTime @permission(name: "flashcards:freeze")
    """
    If the flashcard should be displayed to the end users. Default value is `false`.
    Requires the permission `flashcards:write:visible`.
    """
    visible: Boolean @permission(name: "flashcards:write:visible") @rules(apply: ["boolean"])
    """
    The flashcard related chapter ID.
    """
    chapter_id: ID! @rules(apply: ["integer", "exists:chapters,id"])
    """
    The flashcard associated labels.
    """
    labels: CreateFlashcardLabels
}

input UpdateFlashcard {
    """
    The related flashcard ID.
    """
    id: ID! @rules(apply: ["integer", "exists:flashcards,id"])
    """
    The flashcard new human-redable name.
    Maximum 150 caracters.
    """
    name: String @rules(apply: ["string", "max:150"])
    """
    The flashcard new slug, which will be used in the URL generation.
    Requires the permission `flashcards:write:slug`.
    Maximum 150 caracters.
    """
    slug: String @permission(name: "flashcards:write:slug") @rules(apply: ["string", "max:150"])
    """
    The flashcard content. Cannot be empty.
    """
    content: [FlashcardContentInput!]
    """
    The flashcard new order.
    Must be positive (i.e. >=0).
    """
    order: Int @rules(apply: ["nullable", "integer", "min:0"])
    """
    If the flashcard is only accessible for premium users.
    Requires the permission `flashcards:write:premium`.
    """
    premium: Boolean @permission(name: "flashcards:write:premium") @rules(apply: ["boolean"])
    """
    If the flashcard is only accessible for users who bought the parent chapter. Default value is `false`.
    Requires the permission `exam:write:protected`.
    """
    protected: Boolean @permission(name: "exam:write:protected") @rules(apply: ["boolean"])
    """
    The flashcard frozen date. If set, only the users with the permission `flashcards:freeze` will be allowed to edit
    the flashcard. Set to `null` to disable.
    Requires the permission `exercises:freeze`.
    """
    frozen_at: DateTime @permission(name: "flashcards:freeze")
    """
    If the flashcard should be displayed to the end users.
    Requires the permission `flashcards:write:visible`.
    """
    visible: Boolean @permission(name: "flashcards:write:visible") @rules(apply: ["boolean"])
    """
    The flashcard new related chapter ID.
    """
    chapter_id: ID @rules(apply: ["integer", "exists:chapters,id"])
    """
    The flashcard associated labels.
    """
    labels: UpdateFlashcardLabels
}

input FlashcardContentInput {
    front: Silicate!
    back: Silicate!
}

input CreateFlashcardLabels {
    """
    Add the passed ids to the linked model.
    """
    add: [ID!] @rename(attribute: "syncWithoutDetaching")
}

input UpdateFlashcardLabels {
    """
    Replace the related labels. Any previously linked label which is not in the passed [ID] will be detached.
    """
    replace: [ID!] @rename(attribute: "sync")
    """
    Add the passed ids to the linked model.
    """
    add: [ID!] @rename(attribute: "syncWithoutDetaching")
}
