input CreateFlashcard {
    name: String!
    "The flashcard slug. If not specified, it will be generated from the Notion name."
    slug: String
    fronts: [Silicate!]!
    backs: [Silicate!]!
    order: Int!
    premium: Boolean!
    frozen_at: DateTime @permission(scope: "flashcards:freeze")
    visible: Boolean!
    chapter_id: ID!
    labels: BelongsToMany
}

input UpdateFlashcard {
    id: ID!
    name: String
    "The flashcard slug."
    slug: String
    fronts: [Silicate!]
    backs: [Silicate!]
    order: Int
    premium: Boolean
    frozen_at: DateTime @permission(scope: "flashcards:freeze")
    visible: Boolean
    chapter_id: ID
    labels: BelongsToMany
}
