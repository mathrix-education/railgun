input CreateExam {
    """
    The exam human-readable name.
    Maximum 150 caracters.
    """
    name: String! @rules(apply: ["string", "max:150"])
    """
    The exam slug, which will be used in the URL generation.
    Maximum 150 caracters.
    """
    slug: String! @rules(apply: ["string", "max:150"])
    """
    The exam duration in minutes. If set, must be greater than 0.
    """
    duration: Int @rules(apply: ["nullable", "min:0"])
    """
    The exam content.
    """
    content: Silicate!
    """
    The exam order. If not set, the chapter will be placed in the last position of the group [chapter].
    Must be positive (i.e. >=0).
    """
    order: Int @rules(apply: ["nullable", "integer", "min:0"])
    """
    If the exam is only accessible for premium users. Default value is `false`.
    Requires the permission `exams:write:premium`.
    """
    premium: Boolean @permission(name: "exams:write:premium") @rules(apply: ["boolean"])
    """
    If the exam is only accessible for users who bought the parent chapter. Default value is `null`.
    Requires the permission `exams:write:protected`.
    """
    protected: Boolean @permission(name: "exams:write:protected") @rules(apply: ["boolean"])
    """
    The exam frozen date. If set, only the users with the permission `exams:freeze` will be allowed to edit the exam.
    Set to `null` to disable.
    Requires the permission `exams:freeze`.
    """
    frozen_at: DateTime @permission(name: "exams:freeze")
    """
    If the exam should be displayed to the end users.
    Requires the permission `exams:write:visible`.
    """
    visible: Boolean @permission(name: "exams:write:visible")
    """
    The exam related chapter ID.
    """
    chapter_id: ID! @rules(apply: ["integer", "exists:chapters,id"])
    """
    The exam associated labels.
    """
    labels: BelongsToMany
}

input UpdateExam {
    """
    The targeted exam ID.
    """
    id: ID! @rules(apply: ["integer"])
    """
    The exam new human-readable name.
    Maximum 150 caracters.
    """
    name: String @rules(apply: ["string", "max:150"])
    """
    The exam new slug, which will be used in the URL generation.
    Requires the permission `exams:write:slug`.
    Maximum 150 caracters.
    """
    slug: String @permission(name: "exams:write:slug") @rules(apply: ["string", "max:150"])
    """
    The exam new duration in minutes. If set, must be greater than 0.
    """
    duration: Int @rules(apply: ["nullable", "min:0"])
    """
    The exam new content.
    """
    content: Silicate @rules(apply: ["array"])
    """
    The exam new order.
    Must be positive (i.e. >=0).
    """
    order: Int @rules(apply: ["nullable", "integer", "min:0"])
    """
    If the exam is only accessible for premium users.
    Requires the permission `exams:write:premium`.
    """
    premium: Boolean @permission(name: "exams:write:premium") @rules(apply: ["boolean"])
    """
    If the exam is only accessible for users who bought the parent chapter. Default value is `null`.
    Requires the permission `exam:write:protected`.
    """
    protected: Boolean @permission(name: "exam:write:protected") @rules(apply: ["boolean"])
    """
    The exam frozen date. If set, only the users with the permission `exams:freeze` will be allowed to edit the exam.
    Set to `null` to disable.
    Requires the permission `exams:freeze`.
    """
    frozen_at: DateTime @permission(name: "exams:freeze")
    """
    If the exam should be displayed to the end users.
    Requires the permission `exams:write:visible`.
    """
    visible: Boolean @permission(name: "exams:write:visible")
    """
    The exam new related chapter ID.
    """
    chapter_id: ID @rules(apply: ["integer", "exists:chapters,id"])
    """
    The exam associated labels.
    """
    labels: BelongsToMany
}
