"""
Manage the related models.
"""
input BelongsToMany {
    """
    Replace the related models. Any previously linked model which is not in the passed [ID] will be detached.
    """
    replace: [ID!] @rename(attribute: "sync")
    """
    Add the passed ids to the linked model.
    """
    add: [ID!] @rename(attribute: "syncWithoutDetaching")
}
