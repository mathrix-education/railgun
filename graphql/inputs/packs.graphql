input CreatePack {
    """
    The pack type.
    """
    type: NotionType! @rules(apply: ["string"])
    """
    The pack human-readable name.
    Maximum 150 caracters.
    """
    name: String! @rules(apply: ["string", "max:150"])
    """
    The pack slug, which will be used in the URL generation.
    Maximum 150 caracters.
    """
    slug: String! @rules(apply: ["string", "max:150"])
    """
    If the pack is available for sale.
    """
    available: Boolean! @rules(apply: ["boolean"])
    """
    The pack price in **cents**.
    Must be stricly positive.
    """
    price: Int! @rules(apply: ["integer", "min:1"])
    """
    The pack order. If not set, the chapter will be placed in the last position.
    Must be positive (i.e. >=0).
    """
    order: Int @rules(apply: ["nullable", "integer", "min:0"])
    """
    If the pack should be displayed to the end users.
    """
    visible: Boolean! @rules(apply: ["boolean"])
}

input UpdatePack {
    """
    The targeted pack ID.
    """
    id: ID! @rules(apply: ["integer", "exists:packs,id"])
    """
    The pack human-readable name.
    Maximum 150 caracters.
    """
    name: String @rules(apply: ["string", "max:150"])
    """
    The pack slug, which will be used in the URL generation.
    Maximum 150 caracters.
    """
    slug: String @rules(apply: ["string", "max:150"])
    """
    If the pack is available for sale.
    """
    available: Boolean @rules(apply: ["boolean"])
    """
    The pack price in **cents**.
    Must be stricly positive.
    """
    price: Int! @rules(apply: ["integer", "min:1"])
    """
    The pack order. If not set, the chapter will be placed in the last position.
    Must be positive (i.e. >=0).
    """
    order: Int @rules(apply: ["nullable", "integer", "min:0"])
    """
    If the pack should be displayed to the end users.
    """
    visible: Boolean @rules(apply: ["boolean"])
}
