input CreateLabel {
    """
    The label human readable name.
    Maximum 150 caracters.
    """
    name: String! @rules(apply: ["string", "max:150"])
    """
    The label hexadecimal color code, with the hash.
    """
    color: Color!
}

input UpdateLabel {
    """
    The target label ID.
    """
    id: ID!
    """
    The label human readable name.
    Maximum 150 caracters.
    """
    name: String @rules(apply: ["string", "max:150"])
    """
    The label hexadecimal color code, with the hash.
    """
    color: Color
}

