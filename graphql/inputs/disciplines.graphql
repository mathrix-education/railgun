input CreateDiscipline {
    """
    The discipline human-readable name.
    Maximum 150 characters.
    """
    name: String! @rules(apply: ["string", "max:150"])
    """
    The discipline slug, which will be used in the URL generation.
    Maximum 150 caracters.
    """
    slug: String! @rules(apply: ["string", "max:150"])
    """
    If the discipline is in beta access.
    """
    beta: Boolean! @rules(apply: ["boolean"])
}

input UpdateDiscipline {
    """
    The targeted discipline ID.
    """
    id: ID! @rules(apply: ["integer"])
    """
    The discipline human-readable name.
    Maximum 150 characters.
    """
    name: String @rules(apply: ["string", "max:150"])
    """
    The discipline slug, which will be used in the URL generation.
    Maximum 150 caracters.
    """
    slug: String @rules(apply: ["string", "max:150"])
    """
    If the discipline is in beta access.
    """
    beta: Boolean @rules(apply: ["boolean"])
}
