input CreateNotion {
    """
    The notion type.
    """
    type: NotionType! @rules(apply: ["string"])
    """
    The notion human-readable name.
    Maximum 150 caracters.
    """
    name: String! @rules(apply: ["string", "max:150"])
    """
    The notion slug, which will be used in the URL generation.
    Maximum 150 caracters.
    """
    slug: String! @rules(apply: ["string", "max:150"])
    """
    The notion order. If not set, the chapter will be placed in the last position of the group [chapter].
    Must be positive (i.e. >=0).
    """
    order: Int @rules(apply: ["nullable", "integer", "min:0"])
    """
    If the notion should be displayed to the end users.
    Requires the permission `notions:write:visible`.
    """
    visible: Boolean! @permission(name: "notions:write:visible") @rules(apply: ["boolean"])
    """
    The notion related chapter ID.
    """
    chapter_id: ID! @rules(apply: ["integer", "exists:chapters,id"])
}

input UpdateNotion {
    """
    The targeted notion ID.
    """
    id: ID! @rules(apply: ["integer", "exists:notions,id"])
    """
    The notion new human-readable name.
    Maximum 150 caracters.
    """
    type: NotionType @rules(apply: ["string"])
    """
    The notion new human-readable name.
    Maximum 150 caracters.
    """
    name: String @rules(apply: ["string", "max:150"])
    """
    The notion new slug, which will be used in the URL generation.
    Requires the permission `notions:write:slug`.
    Maximum 150 caracters.
    """
    slug: String @permission(name: "notions:write:slug") @rules(apply: ["string", "max:150"])
    """
    The notion order. If not set, the chapter will be placed in the last position of the group [chapter].
    Must be positive (i.e. >=0).
    """
    order: Int @rules(apply: ["nullable", "integer", "min:0"])
    """
    If the notion should be displayed to the end users.
    Requires the permission `notions:write:visible`.
    """
    visible: Boolean @permission(name: "notions:write:visible") @rules(apply: ["boolean"])
    """
    The notion related chapter ID.
    """
    chapter_id: ID @rules(apply: ["integer", "exists:chapters,id"])
}
