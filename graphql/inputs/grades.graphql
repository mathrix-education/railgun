input CreateGrade {
    """
    The grade human-readable name.
    Maximum 150 caracters.
    """
    name: String! @rules(apply: ["string", "max:150"])
    """
    The grade slug, which will be used in the URL generation.
    Maximum 150 caracters.
    """
    slug: String! @rules(apply: ["string", "max:150"])
    """
    The grade order. If not set, the chapter will be placed in the last position.
    Must be positive (i.e. >=0).
    """
    order: Int @rules(apply: ["nullable", "integer", "min:0"])
    """
    If the grade should be displayed to the end users.
    """
    visible: Boolean! @rules(apply: ["boolean"])
    """
    The grade related parent ID.
    """
    parent_id: ID @rules(apply: ["integer", "exists:grades,id"])
    """
    The grade related country ID.
    """
    country_id: ID! @rules(apply: ["integer", "exists:countries,id"])
}

input UpdateGrade {
    """
    The targeted grade ID.
    """
    id: ID! @rules(apply: ["integer", "exists:grades,id"])
    """
    The grade human-readable name.
    Maximum 150 caracters.
    """
    name: String @rules(apply: ["string", "max:150"])
    """
    The grade slug, which will be used in the URL generation.
    Maximum 150 caracters.
    """
    slug: String @rules(apply: ["string", "max:150"])
    """
    The grade order. If not set, the chapter will be placed in the last position.
    Must be positive (i.e. >=0).
    """
    order: Int @rules(apply: ["nullable", "integer", "min:0"])
    """
    If the grade should be displayed to the end users.
    """
    visible: Boolean @rules(apply: ["boolean"])
    """
    The grade related parent ID.
    """
    parent_id: ID @rules(apply: ["integer", "exists:grades,id"])
    """
    The grade related country ID.
    """
    country_id: ID @rules(apply: ["integer", "exists:countries,id"])
}
