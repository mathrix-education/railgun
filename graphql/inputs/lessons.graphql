input CreateLesson {
    """
    The lesson human-readable name.
    Maximum 150 caracters.
    """
    name: String! @rules(apply: ["string", "max:150"])
    """
    The lesson slug, which will be used in the URL generation.
    Maximum 150 caracters.
    """
    slug: String! @rules(apply: ["string", "max:150"])
    """
    The lesson content.
    """
    content: Silicate!
    """
    The lesson order. If not set, the chapter will be placed in the last position of the group [section].
    Must be positive (i.e. >=0).
    """
    order: Int @rules(apply: ["nullable", "integer", "min:0"])
    """
    If the lesson should be displayed to the end users.
    """
    visible: Boolean! @rules(apply: ["boolean"])
    """
    The lesson related section ID.
    """
    section_id: ID @rules(apply: ["integer", "exists:sections,id"])
    """
    The flashcard associated labels.
    """
    labels: CreateLessonLabels
}

input UpdateLesson {
    """
    The targeted lesson ID.
    """
    id: ID! @rules(apply: ["integer", "exists:lessons,id"])
    """
    The lesson new human-readable name.
    Maximum 150 caracters.
    """
    name: String @rules(apply: ["string", "max:150"])
    """
    The lesson new slug, which will be used in the URL generation.
    Maximum 150 caracters.
    """
    slug: String @rules(apply: ["string", "max:150"])
    """
    The lesson new content.
    """
    content: Silicate
    """
    The lesson new order. If not set, the chapter will be placed in the last position of the group [section].
    Must be positive (i.e. >=0).
    """
    order: Int @rules(apply: ["nullable", "integer", "min:0"])
    """
    If the lesson should be displayed to the end users.
    """
    visible: Boolean @rules(apply: ["boolean"])
    """
    The lesson related section ID.
    """
    section_id: ID @rules(apply: ["integer", "exists:sections,id"])
    """
    The flashcard associated labels.
    """
    labels: UpdateLessonLabels
}

input CreateLessonLabels {
    """
    Replace the related labels. Any previously linked label which is not in the passed [ID] will be detached.
    """
    replace: [ID!] @rename(attribute: "sync")
    """
    Add the passed ids to the linked model.
    """
    add: [ID!] @rename(attribute: "syncWithoutDetaching")
}

input UpdateLessonLabels {
    """
    Replace the related models. Any previously linked model which is not in the passed [ID] will be detached.
    """
    replace: [ID!] @rename(attribute: "sync")
    """
    Add the passed ids to the linked model.
    """
    add: [ID!] @rename(attribute: "syncWithoutDetaching")
}
