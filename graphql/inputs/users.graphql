input CreateUser {
    """
    The user username.
    Must be unique.
    Maximum 60 caracters.
    """
    username: String! @rules(apply: ["string", "max:60", "unique:users,username"])
    """
    The user email.
    Must be unique.
    Must be a valid email address.
    Maximum 150 caracters.
    """
    email: String! @rules(apply: ["string", "email", "max:150", "unique:users,email"])
    """
    The user first name.
    Maximum 60 caracters.
    """
    firstname: String @rules(apply: ["string", "max:60"])
    """
    The user last name.
    Maximum 60 caracters.
    """
    lastname: String @rules(apply: ["string", "max:60"])
    """
    The user password.
    """
    password: String! @rules(apply: ["string"])
    """
    **Deprecated: use `permissions` instead. Will be removed in version 8.0.0.**
    The user permissions.
    Requires the permission `*`.
    """
    scopes: [String!] @deprecated(reason: "Use `permissions` instead. Will be removed in version 8.0.0.")
    @permission(name: "*")
    """
    The user permissions.
    Requires the permission `*`.
    """
    permissions: [String!] @permission(name: "*")
    """
    The user related grade ID.
    """
    grade_id: ID @rules(apply: ["integer", "exists:grades,id"])
}

input UpdateUser {
    """
    The targeted user iD.
    """
    id: ID!
    """
    The user new username.
    Must be unique.
    Maximum 60 caracters.
    """
    username: String @rules(apply: ["string", "max:60", "unique:users,username"])
    """
    The user new email.
    Must be unique.
    Must be a valid email address.
    Maximum 150 caracters.
    """
    email: String @rules(apply: ["string", "email", "max:150", "unique:users,email"])
    """
    The user new first name.
    Maximum 60 caracters.
    """
    firstname: String @rules(apply: ["string", "max:60"])
    """
    The user new last name.
    Maximum 60 caracters.
    """
    lastname: String @rules(apply: ["string", "max:60"])
    """
    The user new password.
    """
    password: String @rules(apply: ["sometimes", "required"])
    """
    **Deprecated: use `permissions` instead. Will be removed in version 8.0.0.**
    The user new permissions.
    Requires the permission `*`.
    """
    scopes: [String!] @deprecated(reason: "Use `permissions` instead. Will be removed in version 8.0.0.")
    @permission(name: "*")
    """
    The user new permissions.
    Requires the permission `*`.
    """
    permissions: [String] @permission(name: "*")
    """
    The user new related grade ID.
    """
    grade_id: ID @rules(apply: ["exists:grades,id"])
}

