input CreateChapter {
    """
    The chapter human-readable name.
    Maximum 150 caracters.
    """
    name: String!@rules(apply: ["string", "max:150"])
    """
    The chapter slug, which will be used in the URL generation.
    Maximum 150 caracters.
    """
    slug: String!@rules(apply: ["string", "max:150"])
    """
    The chapter price **in cents** if applicable. Setting a non-null value implies that the chapter is **sellable**.
    """
    price: Int
    """
    The chapter order. If not set, the chapter will be placed in the last position of the group [grade/discipline].
    Must be positive (i.e. >=0).
    """
    order: Int @rules(apply: ["nullable", "integer", "min:0"])
    """
    If the chapter should be displayed to the end users.
    Requires the permission `chapters:write:visible`.
    """
    visible: Boolean! @permission(name: "chapters:write:visible") @rules(apply: ["boolean"])
    """
    The chapter related theme ID.
    Must be a valid theme ID.
    """
    theme_id: ID! @rules(apply: ["integer", "exists:themes,id"])
}

input UpdateChapter {
    """
    The targeted chapter ID.
    """
    id: ID! @rules(apply: ["integer", "exists:chapters,id"])
    """
    The chapter new human-readable name.
    Maximum 150 caracters.
    """
    name: String @rules(apply: ["string", "max:150"])
    """
    The chapter new slug, which will be used in the URL generation.
    Maximum 150 caracters.
    """
    slug: String @rules(apply: ["string", "max:150"])
    """
    The chapter price **in cents** if applicable. Setting a non-null value implies that the chapter is **sellable**.
    """
    price: Int
    """
    The chapter new order. Status quo if not set.
    Must be positive (i.e. >=0).
    """
    order: Int @rules(apply: ["nullable", "integer", "min:0"])
    """
    If the chapter should be displayed to the end users.
    Requires the permission `chapters:write:visible`.
    """
    visible: Boolean @permission(name: "chapters:write:visible") @rules(apply: ["boolean"])
    """
    The chapter new related theme ID.
    Must be a valid theme ID.
    """
    theme_id: ID @rules(apply: ["integer", "exists:themes,id"])
}
