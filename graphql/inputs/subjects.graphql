input CreateSubject {
    """
    The subject human-readable name.
    Maximum 150 caracters.
    """
    name: String! @rules(apply: ["string", "max:150"])
    """
    The subject slug, which will be used in the URL generation.
    Maximum 150 caracters.
    """
    slug: String! @rules(apply: ["string", "max:150"])
    """
    The subject order. If not set, the section will be placed in the last position of the group [notion].
    Must be positive (i.e. >=0).
    """
    order: Int @rules(apply: ["nullable", "integer", "min:0"])
    """
    If the subject is only accessible for premium users. Default value is `false`.
    Requires the permission `subjects:write:premium`.
    """
    premium: Boolean! @permission(name: "subjects:write:premium") @rules(apply: ["boolean"])
    """
    If the subject should be displayed to the end users. Default value is `false`.
    Requires the permission `subjects:write:visible`.
    """
    visible: Boolean! @permission(name: "subjects:write:visible") @rules(apply: ["boolean"])
    """
    The subject related notion ID.
    """
    notion_id: ID! @rules(apply: ["integer", "exists:notions,id"])
}

input UpdateSubject {
    """
    The targeted subject ID.
    """
    id: ID! @rules(apply: ["integer", "exists:subjects,id"])
    """
    The subject human-readable name.
    Maximum 150 caracters.
    """
    name: String @rules(apply: ["string", "max:150"])
    """
    The subject slug, which will be used in the URL generation.
    Maximum 150 caracters.
    """
    slug: String @rules(apply: ["string", "max:150"])
    """
    The subject order. If not set, the section will be placed in the last position of the group [notion].
    Must be positive (i.e. >=0).
    """
    order: Int @rules(apply: ["nullable", "integer", "min:0"])
    """
    If the subject is only accessible for premium users.
    Requires the permission `subjects:write:premium`.
    """
    premium: Boolean @permission(name: "subjects:write:premium") @rules(apply: ["boolean"])
    """
    If the subject should be displayed to the end users.
    Requires the permission `subjects:write:visible`.
    """
    visible: Boolean @permission(name: "subjects:write:visible") @rules(apply: ["boolean"])
    """
    The subject related notion ID.
    """
    notion_id: ID @rules(apply: ["integer", "exists:notions,id"])
}
