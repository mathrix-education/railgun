input CreateSection {
    """
    The section human-readable name.
    Maximum 150 caracters.
    """
    name: String! @rules(apply: ["string", "max:150"])
    """
    The section slug, which will be used in the URL generation.
    Maximum 150 caracters.
    """
    slug: String! @rules(apply: ["string", "max:150"])
    """
    The section order. If not set, the section will be placed in the last position of the group [training].
    Must be positive (i.e. >=0).
    """
    order: Int @rules(apply: ["nullable", "integer", "min:0"])
    """
    If the section should be displayed to the end users.
    """
    visible: Boolean! @rules(apply: ["boolean"])
    """
    The section related training ID.
    """
    training_id: ID! @rules(apply: ["integer", "exists:trainings,id"])
}

input UpdateSection {
    """
    The targeted section ID.
    """
    id: ID! @rules(apply: ["integer", "exists:sections,id"])
    """
    The section new human-readable name.
    Maximum 150 caracters.
    """
    name: String @rules(apply: ["string", "max:150"])
    """
    The section new slug, which will be used in the URL generation.
    Maximum 150 caracters.
    """
    slug: String @rules(apply: ["string", "max:150"])
    """
    The section order. If not set, the section will be placed in the last position of the group [training].
    Must be positive (i.e. >=0).
    """
    order: Int @rules(apply: ["nullable", "integer", "min:0"])
    """
    If the section should be displayed to the end users.
    """
    visible: Boolean @rules(apply: ["boolean"])
    """
    The section new related training ID.
    """
    training_id: ID @rules(apply: ["integer", "exists:trainings,id"])
}
