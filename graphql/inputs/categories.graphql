input CreateCategory {
    """
    The category human-readable name.
    Maximum 150 caracters.
    """
    name: String! @rules(apply: ["string", "max:150"])
    """
    The category slug, which will be used in the URL generation.
    Maximum 150 caracters.
    """
    slug: String!@rules(apply: ["string", "max:150"])
}

input UpdateCategory {
    """
    The targeted category ID.
    """
    id: ID! @rules(apply: ["integer", "exists:disciplines,id"])
    """
    The new category human-readable name.
    Maximum 150 caracters.
    """
    name: String @rules(apply: ["string", "max:150"])
    """
    The new category slug, which will be used in the URL generation.
    Maximum 150 caracters.
    """
    slug: String @rules(apply: ["string", "max:150"])
}
