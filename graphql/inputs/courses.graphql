input CreateCourse {
    name: String!
    slug: String!
    content: Silicate!
    order: Int
    premium: Boolean!
    frozen_until: DateTime @permission(scope: "courses:freeze")
    visible: Boolean!
    seo_index: Boolean
    seo_title: String
    seo_keywords: String
    seo_description: String
    notion_id: ID!
    labels: BelongsToMany
}

input UpdateCourse {
    id: ID!
    name: String
    slug: String
    content: Silicate
    order: Int
    premium: Boolean
    frozen_until: DateTime @permission(scope: "courses:freeze")
    visible: Boolean
    seo_index: Boolean
    seo_title: String
    seo_keywords: String
    seo_description: String
    notion_id: ID
    labels: BelongsToMany
}
