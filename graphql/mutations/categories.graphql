extend type Mutation {
    "Create a new category."
    createCategory(
        input: CreateCategory! @spread
    ): Category! @permission(scope: "categories:create") @create

    "Update an existing category."
    updateCategory(
        id: ID!
        input: UpdateCategory! @spread
    ): Category @permission(scope: "categories:update") @update

    "Delete an existing category."
    deleteCategory(
        id: ID!
    ): Category @permission(scope: "categories:delete") @delete
}
