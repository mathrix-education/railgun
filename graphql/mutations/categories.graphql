extend type Mutation {
    "Create a new category."
    createCategory(
        input: CreateCategory! @spread
    ): Category! @permission(name: "categories:write") @create

    "Update an existing category."
    updateCategory(
        input: UpdateCategory! @spread
    ): Category @permission(name: "categories:write") @update

    "Delete an existing category."
    deleteCategory(
        id: ID!
    ): Category @permission(name: "categories:delete") @delete
}
