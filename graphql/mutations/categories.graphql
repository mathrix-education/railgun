extend type Mutation {
    "Create a new category."
    createCategory(
        name: String!
        slug: String!
    ): Category! @permission(scope: "categories:read") @create

    "Update an existing category."
    updateCategory(
        id: ID!
        name: String
        slug: String
    ): Category @permission(scope: "categories:update") @update

    "Delete an existing category."
    deleteCategory(id: ID!): Category @permission(scope: "categories:delete") @delete
}
