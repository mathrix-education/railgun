extend type Mutation {
    "Create a new grade."
    createGrade(
        input: CreateGrade! @spread
    ): Grade @permission(name: "grades:write") @create

    "Update an existing grade."
    updateGrade(
        input: UpdateGrade! @spread
    ): Grade @permission(name: "grades:write") @update

    "Delete an existing grade."
    deleteGrade(
        id: ID!
    ): Grade @permission(name: "grades:delete") @delete
}
