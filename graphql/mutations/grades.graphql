extend type Mutation {
    "Create a new grade."
    createGrade(
        name: String!
        slug: String!
        order: Int
        visible: Boolean!
        parent_id: Int
        country_id: Int!
    ): Grade @create

    "Update an existing grade."
    updateGrade(
        id: ID!
        name: String
        slug: String
        order: Int
        visible: Boolean
        parent_id: Int
        country_id: Int
    ): Grade @update

    "Delete an existing grade."
    deleteGrade(id: ID!): Grade @delete
}
