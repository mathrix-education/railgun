extend type Mutation {
    "Create a new grade."
    createGrade(
        input: CreateGrade! @spread
    ): Grade @permission(scope: "grades:create") @create

    "Update an existing grade."
    updateGrade(
        id: ID!
        input: UpdateGrade! @spread
    ): Grade @permission(scope: "grades:update") @update

    "Delete an existing grade."
    deleteGrade(
        id: ID!
    ): Grade @permission(scope: "grades:delete") @delete
}
