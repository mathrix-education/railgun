extend type Mutation {
    "Create a new chapter."
    createChapter(
        name: String!
        slug: String!
        order: Int
        visible: Boolean!
        discipline_id: Int!
        grade_id: Int!
    ): Chapter! @permission(scope: "chapters:create") @create

    "Update an existing chapter."
    updateChapter(
        id: ID!
        name: String
        slug: String
        order: Int
        visible: Boolean
        discipline_id: Int
        grade_id: Int
    ): Chapter @permission(scope: "categories:update") @update

    "Delete an existing chapter."
    deleteChapter(id: ID!): Chapter @permission(scope: "categories:delete") @delete
}
