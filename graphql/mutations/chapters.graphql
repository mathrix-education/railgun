extend type Mutation {
    "Create a new chapter."
    createChapter(
        input: CreateChapter! @spread
    ): Chapter! @permission(name: "chapters:write") @create @chapterSlugRule

    "Update an existing chapter."
    updateChapter(
        input: UpdateChapter! @spread
    ): Chapter @permission(name: "chapters:write") @update @chapterSlugRule

    "Delete an existing chapter."
    deleteChapter(
        id: ID!
    ): Chapter @permission(name: "categories:delete") @delete

    "Clone an existing chapter"
    cloneChapter(
        input: CloneChapter! @spread
    ): Chapter! @permission(name: "chapters:write") @chapterSlugRule
}
