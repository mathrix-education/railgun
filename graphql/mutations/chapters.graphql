extend type Mutation {
    "Create a new chapter."
    createChapter(
        input: CreateChapter! @spread
    ): Chapter! @permission(scope: "chapters:create") @create

    "Update an existing chapter."
    updateChapter(
        id: ID!
        input: UpdateChapter! @spread
    ): Chapter @permission(scope: "categories:update") @update

    "Delete an existing chapter."
    deleteChapter(
        id: ID!
    ): Chapter @permission(scope: "categories:delete") @delete
}
