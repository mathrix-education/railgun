extend type Mutation {
    "Create a new training."
    createTraining(
        input: CreateTraining! @spread
    ): Training @permission(scope: "trainings:create") @create

    "Update an existing training."
    updateTraining(
        id: ID!
        input: UpdateTraining! @spread
    ): Training @permission(scope: "trainings:update") @update

    "Delete an existing traiting."
    deleteTraining(id: ID!): Training @permission(scope: "trainings:delete") @delete
}
