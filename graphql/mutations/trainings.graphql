extend type Mutation {
    "Create a new training."
    createTraining(
        input: CreateTraining! @spread
    ): Training @permission(name: "trainings:write") @create

    "Update an existing training."
    updateTraining(
        input: UpdateTraining! @spread
    ): Training @permission(name: "trainings:write") @update

    "Delete an existing traiting."
    deleteTraining(id: ID!): Training @permission(name: "trainings:delete") @delete
}
