extend type Mutation {
    "Create a new subject."
    createSubject(
        name: String!
        order: Int
        visible: Boolean!
        notion_id: ID!
    ): Subject! @permission(scope: "subjects:create") @create

    "Update an existing subject."
    updateSubject(
        id: ID!
        name: String!
        order: Int
        visible: Boolean!
        notion_id: ID!
    ): Subject @permission(scope: "subjects:update") @update

    "Delete an existing subject."
    deleteSubject(id: ID!): Subject @permission(scope: "subjects:delete") @delete
}
