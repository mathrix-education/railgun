extend type Coupon {
    "Create a new coupon"
    createCoupon(
        id: ID!
        type: CouponType!
        value: Int!
        counter: Int!
        expires_at: DateTime
    ): Coupon @permission(scope: "coupons:create") @create

    "Update an existing coupon"
    updateCoupon(
        id: ID!
        type: CouponType
        value: Int
        counter: Int
        expires_at: DateTime
    ): Coupon @permission(scope: "coupons:update") @update

    "Delete an existing coupon"
    deleteCoupon(id: ID!): Coupon @permission(scope: "coupons:delete") @delete
}
