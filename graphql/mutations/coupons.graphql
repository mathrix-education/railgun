extend type Mutation {
    "Create a new coupon"
    createCoupon(
        input: CreateCoupon! @spread
    ): Coupon @permission(scope: "coupons:create") @create

    "Update an existing coupon"
    updateCoupon(
        id: ID!
        input: UpdateCoupon! @spread
    ): Coupon @permission(scope: "coupons:update") @update

    "Delete an existing coupon"
    deleteCoupon(
        id: ID!
    ): Coupon @permission(scope: "coupons:delete") @delete
}
