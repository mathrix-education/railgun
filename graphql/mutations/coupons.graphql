extend type Mutation {
    "Create a new coupon"
    createCoupon(
        input: CreateCoupon! @spread
    ): Coupon @permission(name: "coupons:write") @create

    "Update an existing coupon"
    updateCoupon(
        input: UpdateCoupon! @spread
    ): Coupon @permission(name: "coupons:write") @update

    "Delete an existing coupon"
    deleteCoupon(
        id: ID!
    ): Coupon @permission(name: "coupons:delete") @delete
}
