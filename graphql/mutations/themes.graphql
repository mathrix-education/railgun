extend type Mutation {
    "Create a new theme."
    createTheme(
        input: CreateTheme! @spread
    ): Theme! @permission(name: "themes:write")

    "Update an existing theme."
    updateTheme(
        input: UpdateTheme! @spread
    ): Theme @permission(name: "themes:write")

    "Delete an existing theme."
    deleteTheme(
        id: ID!
    ): Theme @permission(name: "themes:delete") @delete
}
