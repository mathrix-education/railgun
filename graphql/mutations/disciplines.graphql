extend type Mutation {
    "Create a new discipline."
    createDiscipline(
        input: CreateDiscipline @spread
    ): Discipline @permission(name: "disciplines:write") @create

    "Update an existing disicpline."
    updateDiscipline(
        input: UpdateDiscipline @spread
    ): Discipline @permission(name: "disciplines:write") @update

    "Delete an existing discipline."
    deleteDiscipline(
        id: ID!
    ): Discipline @permission(name: "disciplines:delete") @delete
}
