extend type Mutation {
    "Create a new comment"
    createComment(
        input: CreateComment! @spread
    ): Comment! @create @inject(context: "user.id", name: "user_id")

    "Update an existing comment"
    updateComment(
        id: ID!
        input: UpdateComment! @spread
    ): Comment @permission(scope: "comments:update") @update @inject(context: "user.id", name: "user_id")

    "Delete an existing comment"
    deleteComment(
        id: ID!
    ): Comment @permission(scope: "comments:delete") @delete
}
