extend type Mutation {
    "Create a new country"
    createCountry(
        input: CreateCountry! @spread
    ): Country @permission(scope: "countries:create") @create

    "Update an existing country"
    updateCountry(
        id: ID!
        input: UpdateCountry! @spread
    ): Country @permission(scope: "countries:update") @update

    "Delete an existing country"
    deleteCountry(
        id: ID!
    ): Country @permission(scope: "countries:delete") @delete
}
