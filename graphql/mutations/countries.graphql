extend type Mutation {
    "Create a new country"
    createCountry(
        input: CreateCountry! @spread
    ): Country @permission(name: "countries:write") @create

    "Update an existing country"
    updateCountry(
        input: UpdateCountry! @spread
    ): Country @permission(name: "countries:write") @update

    "Delete an existing country"
    deleteCountry(
        id: ID!
    ): Country @permission(name: "countries:delete") @delete
}
