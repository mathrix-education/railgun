extend type Mutation {
    "Create a new report."
    createReport(
        input: CreateReport! @spread
    ): Report! @create

    "Update an existing report."
    updateReport(
        input: UpdateReport! @spread
    ): Report @permission(scope: "reports:update")  @update

    "Delete an existing report."
    deleteReport(
        id: ID!
    ): Report @permission(scope: "reports:delete")  @delete
}
