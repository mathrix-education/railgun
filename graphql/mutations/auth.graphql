type JWT {
    "The JWT token serialized and base64-encoded"
    token: String!
}

type Email {
    email: String!
}

extend type Mutation {
    """
    Register a new user into the application using email/password credentials.
    """
    registerBasic(
        email: String! @rules(apply: ["email", "max:120", "unique:users,email"])
        password: String!
    ): JWT!

    """
    Login a user into the application using email/password credentials.
    """
    loginBasic(email: String!, password: String!): JWT!

    """
    Login a user into the application using its Facebook token.
    A token can be retrieved using the
    [Facebook JS SDK](https://developers.facebook.com/docs/php/howto/example_access_token_from_javascript).
    """
    loginWithFacebook(accessToken: String!): JWT!

    """
    Login a user into the application using its Google access token.
    A token can be retrieved using the [Google JS SDK](https://developers.google.com/identity/sign-in/web/sign-in).
    """
    loginWithGoogle(accessToken: String!): JWT!

    """
    Send a password reset email to the given email address, if it exists. **No error** whill be thrown if the email does
    not exists in the database for security purposes. Furthermore, a additionnal random delay will be added to the
    request to mitigate the side-channel timing attacks.
    """
    forgotPassword(email: String!): Boolean!

    """
    Using the token which can be found in the query string `token`, change the password of the token account owner.
    *In debug mode, for testing purposes, passing the user id instead of the token allow to select the targeted user.*
    """
    resetPassword(token: String!, newPassword: String!): Boolean!
}
