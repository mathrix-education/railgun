type JWT {
    "The JWT token serialized and base64-encoded"
    token: String!
}

extend type Mutation {
    """
    Login a user into the application using email/password credentials.
    """
    loginBasic(email: String!, password: String!): JWT!

    """
    Login a user into the application using its Facebook token.
    A token can be retrieved using the Facebook JS SDK, as explained here
    https://developers.facebook.com/docs/php/howto/example_access_token_from_javascript/
    """
    loginWithFacebook(accessToken: String!): JWT!

    """
    Login a user into the application using its Google access token.
    A token can be retrieved using the Google JS SDK, as explained here
    https://developers.google.com/identity/sign-in/web/sign-in
    """
    loginWithGoogle(accessToken: String!): JWT!
}
