extend type Mutation {
    "Create a new exercise."
    createExercise(
        type: String
        questions: [String!]
        choices: [[String!]!]
        solutions: [[Int!]!]
        examplations: [Silicate!]
        order: Int
        premium: Boolean!
        visible: Boolean!
        subject_id: ID!
    ): Exercise @permission(scope: "exercices:create") @create

    "Update an existing exercise."
    updateExercise(
        id: ID!
        type: String
        questions: [String!]
        choices: [[String!]!]
        solutions: [[Int!]!]
        examplations: [Silicate!]
        order: Int
        premium: Boolean
        visible: Boolean
        subject_id: ID
    ): Exercise @permission(scope: "exercices:update") @update

    "Delete an existing exercise."
    deleteExercise(id: ID!): Exercise @permission(scope: "exercices:delete") @delete
}
