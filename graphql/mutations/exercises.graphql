extend type Mutation {
    "Create a new exercise."
    createExercise(
        input: CreateExercise! @spread
    ): Exercise @permission(name: "exercises:write") @create

    "Update an existing exercise."
    updateExercise(
        input: UpdateExercise! @spread
    ): Exercise @permission(name: "exercises:write") @update

    "Delete an existing exercise."
    deleteExercise(
        id: ID!
    ): Exercise @permission(name: "exercises:delete") @delete
}
