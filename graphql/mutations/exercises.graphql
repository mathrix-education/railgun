extend type Mutation {
    "Create a new exercise."
    createExercise(
        type: ExerciseType!
        questions: [Silicate!]!
        choices: [SilicateList!]!
        solutions: [IntList!]!
        explanations: [SilicateList!]!
        order: Int
        visible: Boolean!
        subject_id: ID!
        labels: ManageLabels
    ): Exercise @permission(scope: "exercises:create") @create

    "Update an existing exercise."
    updateExercise(
        id: ID!
        type: ExerciseType
        questions: [Silicate!]
        choices: [SilicateList!]
        solutions: [IntList!]
        explanations: [SilicateList!]
        order: Int
        visible: Boolean
        subject_id: ID
        labels: ManageLabels
    ): Exercise @permission(scope: "exercises:update") @update

    "Delete an existing exercise."
    deleteExercise(id: ID!): Exercise @permission(scope: "exercises:delete") @delete
}
