extend type Mutation {
    "Create a new exercise."
    createExercise(
        input: CreateExercise! @spread
    ): Exercise @permission(scope: "exercises:create") @create

    "Update an existing exercise."
    updateExercise(
        id: ID!
        input: UpdateExercise! @spread
    ): Exercise @permission(scope: "exercises:update") @update

    "Delete an existing exercise."
    deleteExercise(
        id: ID!
    ): Exercise @permission(scope: "exercises:delete") @delete
}
