extend type Mutation {
    "Create a new exercise."
    createExercise(
        type: ExerciseType!
        questions: [Silicate!]!
        choices: [[Silicate!]!]!
        solutions: [[Int!]!]!
        examplations: [Silicate!]!
        order: Int
        premium: Boolean!
        visible: Boolean!
        subject_id: ID!
        labels: ManageLabels
    ): Exercise @permission(scope: "exercices:create") @create

    "Update an existing exercise."
    updateExercise(
        id: ID!
        type: ExerciseType
        questions: [Silicate!]
        choices: [[Silicate!]!]
        solutions: [[Int!]!]
        examplations: [Silicate!]
        order: Int
        premium: Boolean
        visible: Boolean
        subject_id: ID
        labels: ManageLabels
    ): Exercise @permission(scope: "exercices:update") @update

    "Delete an existing exercise."
    deleteExercise(id: ID!): Exercise @permission(scope: "exercices:delete") @delete
}
