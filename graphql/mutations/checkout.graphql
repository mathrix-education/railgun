extend type Mutation {
    """
    Checkout a cart using a payment method id.
    A new payment method has to be created using Stripe.js
    [createPaymentMethod](https://stripe.com/docs/js/payment_methods/create_payment_method).

    This mutation may return a ThreeDSecureException error (category: `billing`, code: `THREE_D_SECURE`) containing the
    extensions:
    ```
    {
        "type": "setup_intent",
        "client_secret": "seti_foobar",
    }
    ```

    In this case, the `client_secret` must be passed to Stripe.js using
    [confirmCardPayment](https://stripe.com/docs/js/payment_intents/confirm_card_payment).
    """
    checkout(
        cart: CartInput!
        paymentMethodId: String!
    ): Invoice! @guard
}
