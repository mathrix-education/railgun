extend type Mutation {
    "Create new a pack."
    createPack(
        input: CreatePack! @spread
    ): Pack @permission(name: "packs:write") @create

    "Update an existing pack."
    updatePack(
        input: UpdatePack! @spread
    ): Pack @permission(name: "packs:write") @update

    "Delete an existing pack."
    deletePack(
        id: ID!
    ): Pack @permission(name: "packs:delete") @delete
}
