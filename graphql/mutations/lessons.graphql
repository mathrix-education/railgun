extend type Mutation {
    "Create a new lesson."
    createLesson(
        input: CreateLesson! @spread
    ): Lesson! @permission(name: "lessons:write") @create

    "Update an existing lesson."
    updateLesson(
        input: UpdateLesson! @spread
    ): Lesson! @permission(name: "lessons:write") @update

    "Delete an existing lesson."
    deleteLesson(
        id: ID!
    ): Lesson @permission(name: "lessons:delete") @delete
}
