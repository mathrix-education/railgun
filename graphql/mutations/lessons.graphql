extend type Mutation {
    "Create a new lesson."
    createLesson(
        input: CreateLesson! @spread
    ): Lesson! @permission(scope: "lessons:create") @create

    "Update an existing lesson."
    updateLesson(
        id: ID!
        input: UpdateLesson! @spread
    ): Lesson! @permission(scope: "lessons:update") @update

    "Delete an existing lesson."
    deleteLesson(
        id: ID!
    ): Lesson @permission(scope: "lessons:delete") @delete
}
