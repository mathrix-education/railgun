extend type Mutation {
    "Create a new notion."
    createNotion(
        input: CreateNotion! @spread
    ): Notion! @permission(name: "notions:write") @create

    "Update an existing notion."
    updateNotion(
        input: UpdateNotion! @spread
    ): Notion @permission(name: "notions:write") @update

    "Delete an existing notion."
    deleteNotion(
        id: ID!
    ): Notion @permission(name: "notions:delete") @delete
}
