extend type Mutation {
    "Create a new flashcard."
    createFlashcard (
        input: CreateFlashcard! @spread
    ): Flashcard @permission(name: "flashcards:write") @create

    "Update an existing flashcard."
    updateFlashcard (
        input: UpdateFlashcard! @spread
    ): Flashcard @permission(name: "flashcards:write") @update

    "Delete an existing flashcard."
    deleteFlashcard(
        id: ID!
    ): Flashcard  @permission(name: "flashcards:delete") @delete
}
