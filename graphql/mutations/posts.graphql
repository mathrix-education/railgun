extend type Mutation {
    "Create a new posts."
    createPost(
        input: CreatePost! @spread
    ): Post @permission(name: "posts:write") @create

    "Update an existing post."
    updatePost(
        input: UpdatePost! @spread
    ): Post @permission(name: "posts:write") @update

    "Delete an existing post."
    deletePost(
        id: ID!
    ): Post @permission(name: "posts:delete") @delete
}
