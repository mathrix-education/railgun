extend type Mutation {
    "Create a new posts."
    createPost(
        input: CreatePost! @spread
    ): Post @permission(scope: "posts:create") @create

    "Update an existing post."
    updatePost(
        input: UpdatePost! @spread
    ): Post @permission(scope: "posts:update") @update

    "Delete an existing post."
    deletePost(
        id: ID!
    ): Post @permission(scope: "posts:delete") @delete
}
