extend type Mutation {
    createUser(
        username: String!
        email: String!
        firstname: String
        lastname: String
        password: String!
        grade_id: ID
    ): User @create

    updateUser(
        id: ID!
        username: String
        email: String
        firstname: String
        lastname: String
        password: String
        grade_id: ID
    ): User @permission(scope: "users:update") @update

    """
    Update the current user.
    """
    updateMe(
        username: String
        email: String
        firstname: String
        lastname: String
        password: String
        grade_id: ID
    ): User @inject(context: "user.id", name: "id") @update
}
