extend type Mutation {
    createUser(
        username: String!
        email: String!
        firstname: String
        lastname: String
        grade_id: Int
    ): User @permission(scope: "users:create") @create

    updateUser(
        id: ID!
        username: String
        email: String
        firstname: String
        lastname: String
        password: String
    ): User @permission(scope: "users:update") @update
}
