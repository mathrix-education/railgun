extend type Mutation {
    createUser(
        input: CreateUser! @spread
    ): User @permission(name: "users:write") @create

    updateUser(
        input: UpdateUser! @spread
    ): User @permission(name: "users:write") @update

    """
    Update the current user.
    """
    updateMe(
        input: UpdateMe! @spread
    ): User @inject(context: "user.id", name: "id") @update
}
