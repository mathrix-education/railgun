extend type Mutation {
    "Create a new note."
    createNote(
        input: CreateNote! @spread
    ): Note @permission(scope: "notes:create") @create @inject(context: "user.id", name: "user_id")

    "Update an existing note."
    updateNote(
        id: ID!
        input: UpdateNote @spread
    ): Note!  @permission(scope: "notes:create") @update @inject(context: "user.id", name: "user_id")

    "Delete an existing note."
    deleteNote(
        id: ID!
    ): Note! @permission(scope: "notes:delete") @delete
}
