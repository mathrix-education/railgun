extend type Mutation {
    "Create a new exam."
    createExam(
        input: CreateExam! @spread
    ): Exam @permission(name: "exams:write") @create

    "Update an existing exam."
    updateExam(
        input: UpdateExam! @spread
    ): Exam @permission(name: "exams:write") @update

    "Delete an existing exam."
    deleteExam(
        id: ID!
    ): Exam  @permission(name: "exams:delete") @delete
}
