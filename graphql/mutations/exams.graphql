extend type Mutation {
    "Create a new exam."
    createExam(
        input: CreateExam! @spread
    ): Exam @permission(scope: "exams:create") @create

    "Update an existing exam."
    updateExam(
        id: ID!
        input: UpdateExam! @spread
    ): Exam @permission(scope: "exams:update") @update

    "Delete an existing exam."
    deleteExam(
        id: ID!
    ): Exam  @permission(scope: "exams:delete") @delete
}
