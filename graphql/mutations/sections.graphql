extend type Mutation {
    "Create a new section."
    createSection(
        input: CreateSection! @spread
    ): Section! @permission(name: "sections:write") @create

    "Update an existing section."
    updateSection(
        input: UpdateSection! @spread
    ): Section! @permission(name: "sections:write") @update

    "Delete an existing section."
    deleteSection(
        id: ID!
    ): Section! @permission(name: "sections:delete") @delete
}
