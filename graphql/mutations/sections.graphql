extend type Mutation {
    "Create a new section."
    createSection(
        input: CreateSection! @spread
    ): Section! @permission(scope: "sections:create") @create

    "Update an existing section."
    updateSection(
        id: ID!
        input: UpdateSection! @spread
    ): Section! @permission(scope: "sections:update") @update

    "Delete an existing section."
    deleteSection(
        id: ID!
    ): Section! @permission(scope: "sections:delete") @delete
}
