extend type Query {
    """
    List chapters matching a given criteria.
    The available options (mutually exclusive) are:

    - `gradeId` AND `disciplineId`
    - `gradeSlug` AND `disciplineSlug`
    """
    listChapters(
        gradeId: ID @rules(apply: ["required_with:disciplineId", "required_without:gradeSlug,disciplineSlug"])
        disciplineId: ID @rules(apply: ["required_with:gradeId", "required_without:gradeSlug,disciplineSlug"])
        gradeSlug: String @rules(apply: ["required_with:disciplineSlug", "required_without:gradeId,disciplineId"])
        disciplineSlug: String @rules(apply: ["required_with:gradeSlug", "required_without:gradeId,disciplineId"])
    ): [Chapter!]!

    """
    List chapters matching a given criteria.
    The available options (mutually exclusive) are:

    - `id`
    - `chapterSlug` AND `disciplineSlug` AND `gradeSlug`
    """
    readChapter(
        id: ID @rules(apply: ["required_without:chapterSlug,disciplineSlug,gradeSlug"])
        chapterSlug: String @rules(apply: ["required_with:disciplineSlug,gradeSlug", "required_without:id"])
        disciplineSlug: String @rules(apply: ["required_with:chapterSlug,gradeSlug", "required_without:id"])
        gradeSlug: String @rules(apply: ["required_with:chapterSlug,disciplineSlug", "required_without:id"])
    ): Chapter

    "Search for chapters."
    searchChapters(query: String!, grade_id: ID!): [Chapter!]! @paginate(
        builder: "\\Railgun\\GraphQL\\Queries\\SearchChapters"
    )
}
