extend type Query {
    "List chapters matching a given grade id and discipline id."
    listChaptersByGradeAndDiscipline(
        gradeId: ID! @where(key: "grade_id")
        disciplineId: ID! @where(key: "discipline_id")
    ): [Chapter!]! @all

    "List chapters matching a given grade slug and discipline slug."
    listChaptersByGradeSlugAndDisciplineSlug(
        gradeSlug: String!
        disciplineSlug: String!
    ): [Chapter!]!

    "Read an existing chapter."
    readChapter(id: ID @eq): Chapter @find

    "Read an existing chapter using its slug, and its linked discipline and grade slug."
    readChapterBySlugs(
        chapterSlug: String!
        disciplineSlug: String!
        gradeSlug: String!
    ): Chapter!

    "Search for chapters."
    searchChapters(query: String): [Chapter!]! @paginate(
        builder: "\\Railgun\\GraphQL\\Queries\\SearchChapters"
    )
}
