extend type Query {
    """
    List all disciplines.

    - `gradeSlug` allow to filter disciplines for a given grade.
    - `withInvisible` allow to include invisible disciplines for the given grade.
    """
    listDisciplines(
        gradeSlug: String
        withInvisible: Boolean = false
    ): [Discipline!]!

    """
    Read an existing discipline.
    """
    readDiscipline(
        id: ID @eq
        slug: String @eq
    ): Discipline @find
}
