extend type Query {
    """
    Paginate the users.
    """
    paginateUsers: [User!]! @permission(name: "users:read") @paginate(defaultCount: 10)

    """
    Read an existing user.
    """
    readUser(id: ID @eq): User @permission(name: "users:read") @find

    """
    Read the current authenticated user.
    """
    me: User @guard @auth

    """
    Search for users.
    """
    searchUsers(query: String!): [User!]! @permission(name: "users:read") @paginate(
        builder: "\\Railgun\\GraphQL\\Queries\\SearchUsers"
    )
}
