sonar.host.url=https://sonar.mathrix.tech
sonar.sourceEncoding=UTF-8
sonar.projectKey=education-api
sonar.projectName=Mathrix Education API
sonar.sources=.
sonar.exclusions=node_modules/**,storage/**,vendor/**,database/migrations/**,resources/views/**,docs/spec.html
sonar.coverage.exclusions=**.js,app/Console/**,bootstrap/**,config/**,database/**
sonar.test.inclusions=tests/**
sonar.php.tests.reportPath=artifacts/phpunit-junit.xml
sonar.php.coverage.reportPaths=artifacts/phpunit-coverage.xml
