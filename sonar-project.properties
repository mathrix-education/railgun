sonar.host.url=https://sonar.mathrix.tech
sonar.sourceEncoding=UTF-8
sonar.projectKey=education-api
sonar.projectName=Mathrix Education API
sonar.sources=.
sonar.exclusions=node_modules/**,vendor/**,database/migrations/**,resources/views/**
